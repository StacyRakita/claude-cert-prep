. Keep it to constraints that change behavior. Move history and archived notes elsewhere and long procedures into Skills<\/li><li>The rule you cannot afford to dilute should be the shortest path to a <b>hook<\/b><\/li><\/ul>\n<p><b>Rules files<\/b><\/p>\n<ul><li>Live in <code>.claude/rules/<\/code>. A <code>paths<\/code> glob in the YAML frontmatter scopes a rule so it loads only when Claude works with matching files. Subdirectories are organizational only. A rules file <b>without<\/b> <code>paths<\/code> loads at launch like CLAUDE.md<\/li><li>Universal constraints go in CLAUDE.md. Narrow, path-specific guidance (for example SQL transaction rules for <code>src/db/**/*.sql<\/code>) goes in a path-scoped rules file<\/li><\/ul>\n<p><b>Hooks<\/b><\/p>\n<ul><li>Your scripts at fixed lifecycle points. A hook fires <b>every time<\/b>, independent of what the model decides, which makes it a guardrail, while a CLAUDE.md instruction is a convention the model usually follows. Configure with <code>/hooks<\/code> or in settings. Each hook has an event, an optional matcher for tool types and a command<\/li><li><code>PreToolUse<\/code>: before a call. It can block by exiting with <b>code 2<\/b> and writing the reason to stderr, which the agent sees. Enforces access control<\/li><li><code>PostToolUse<\/code>: after a call. It cannot block (the call happened). Use it for formatters, tests, audit logging<\/li><li><code>UserPromptSubmit<\/code>: before the model processes a prompt (inject context, validate)<\/li><li><code>Stop<\/code>: when the model finishes responding. <code>Notification<\/code>: on permission requests or after 60 seconds idle<\/li><li><code>SessionStart<\/code> and <code>SessionEnd<\/code>: initialize, validate the environment, tear down, final audit write<\/li><li>A PreToolUse hook that blocks edits to a production path holds in every session and permission mode<\/li><\/ul>\n<p><b>Subagents<\/b><\/p>\n<ul><li>Work in their own context, do not inherit your conversation, accumulated files or session state, and return only their output<\/li><li>Built-in <b>Explore<\/b> and <b>Plan<\/b> subagents skip CLAUDE.md and git status to stay fast and cheap, so your project rules are <b>not<\/b> in their context. The general-purpose subagent loads both. For work that must respect project constraints use the general-purpose agent or a custom subagent<\/li><li>Custom subagents (in <code>.claude/agents<\/code>) do not see Skills automatically: list needed skills in the agent's frontmatter. Built-in agents have no preloaded skills<\/li><\/ul>\n<p><b>Which mechanism for what<\/b><\/p>\n<ul><li>CLAUDE.md: universal rules, persistent, dilutes with size. Rules file: path-specific guidance. Hook: enforced guardrails, side effects, audit. Subagent: exploration and parallel tasks whose details would bloat the main context<\/li><li>Not worth the setup for a one-off task you will never repeat<\/li><\/ul>"}, {"t": "h", "x": "Module 3: skills across runtimes, commands and plugins"}, {"t": "html", "x": "<p><b>Skills are portable, running everywhere is a design choice<\/b><\/p>\n<ul><li>A skill is a <code>SKILL.md<\/code> in <code>.claude/skills<\/code>: frontmatter says when it applies, the body holds the steps. The same file can run in Claude Code, on the Messages API, through the Agent SDK and in Claude Managed Agents. What differs is where it runs, how it loads and what it may touch<\/li><li><b>Claude Code<\/b>: found on the file system, loads on a description match or when invoked by name, runs in your terminal under the permission mode and deny rules<\/li><li><b>Messages API<\/b>: send the code-execution and skills beta headers. It runs in a container, so steps must not depend on local files or local tools<\/li><li><b>Agent SDK<\/b>: enable file-system sources by setting <code>settingSources<\/code> explicitly, never rely on a default<\/li><li><b>Managed Agents<\/b>: define the agent as an API resource that lists the skill and set the managed-agents beta header. The skill runs in Anthropic's sandbox, so no local-file dependencies<\/li><\/ul>\n<p><b>Three portability rules<\/b><\/p>\n<ul><li>Write the <b>description<\/b> as the matching criterion. A vague one fails to load in every runtime<\/li><li>Do not assume a local file system or local tools inside the skill body<\/li><li>Subagents do not inherit skills in any runtime. List them explicitly<\/li><\/ul>\n<p><b>Commands and plugins<\/b><\/p>\n<ul><li>A custom command is a named explicit entry point. In current Claude Code skills are the recommended format: invoke with <code>/skill-name<\/code> or let Claude load it automatically. The older <code>.claude/commands/<\/code> directory still works but is legacy. Use <code>disable-model-invocation: true<\/code> for a skill that should run only when you call it<\/li><li>A <b>plugin<\/b> bundles skills, hooks, subagents and MCP servers into one installable, versioned unit, shared through a <b>marketplace<\/b> (the official one is available automatically, add others from GitHub with <code>/plugin marketplace add owner/repo<\/code>)<\/li><li>Plugin commands are <b>namespaced<\/b>: a <code>run-tests<\/code> command in a plugin named <code>payments<\/code> is <code>/payments:run-tests<\/code>. Renaming the plugin renames every command<\/li><li>Administrators can deploy plugins through managed settings. A marketplace <b>allowlist<\/b> restricts which sources users may add but does not register them. To push a marketplace to everyone, pair it with <code>extraKnownMarketplaces<\/code>. Managed scope sits above user and project settings and cannot be overridden<\/li><\/ul>\n<p><b>Installing is not executing<\/b><\/p>\n<ul><li>Incident: a deployment skill pointed at <code>/Users/alexmorgan/projects/deploy-utils/validate.sh<\/code> and relied on an undocumented <code>DEPLOY_TOKEN<\/code> from the author's shell. The install succeeded for everyone, the run failed for everyone but the author<\/li><li>Use paths relative to the project root: <code>$CLAUDE_PROJECT_DIR<\/code> for scripts in the project and <code>${CLAUDE_PLUGIN_ROOT}<\/code> for scripts bundled in the plugin. Bundle or share every asset. Document and validate environment variables at install time. Test on a clean machine<\/li><li>A plugin carries only what is in the bundle. A deny rule or hook the author used locally is not included unless listed, so the guardrail does not travel<\/li><\/ul>"}]}, {"id": "r-evals", "title": "Evals and debugging", "minutes": 3, "groups": ["evals"], "blocks": [{"t": "h", "x": "Evals, testing and debugging"}, {"t": "html", "x": "<p><b>Why evals<\/b><\/p>\n<ul><li>Prompts and models change. Without an eval set you cannot say whether a change helped. Evals define \"done\" and catch regressions<\/li><\/ul>\n<p><b>Building an eval<\/b><\/p>\n<ul><li>A set of realistic inputs with expected outcomes (golden answers or criteria), including edge cases and past failures. Start small (dozens), grow it from real production failures<\/li><li>Graders: <b>code-based<\/b> (exact match, schema, tests: fast and cheap), <b>LLM-as-judge<\/b> (rubric, flexible, validate against human labels), <b>human<\/b> (slowest, gold standard)<\/li><li>Make criteria specific and measurable. Judge one dimension at a time. Use a different or stronger model as the judge when possible<\/li><li>Run evals before each prompt, model or tool change, and in CI. Batch API makes big eval runs cheap<\/li><\/ul>\n<p><b>Debugging an LLM system<\/b><\/p>\n<ul><li>Trace the full flow: prompt, tool calls, tool results, stop reason, tokens, latency, cost, request id<\/li><li>Classify failures: missing context, ambiguous instruction, bad tool description, tool bug, truncation (<code>max_tokens<\/code>), wrong model for the job, injection<\/li><li>Reproduce with the exact input, change one variable, compare on the eval set<\/li><li>Monitor in production: quality samples, error and refusal rates, latency, cost per request, tool failure rate. Alert on drift<\/li><\/ul>\n<p><b>Testing around the model<\/b><\/p>\n<ul><li>Mock the API for unit tests of your own code. Use real calls in a smaller eval and integration suite. Do not expect identical text, assert on structure and properties<\/li><\/ul>"}, {"t": "h", "x": "Module 4: evals, graders and a calibrated judge"}, {"t": "html", "x": "<p><b>Write the design document first<\/b><\/p>\n<ul><li>One short page with four decisions, each concrete enough to check the finished system against: <b>success criteria<\/b> (graded outputs for representative cases), <b>failure handling<\/b> (each error marked retriable or terminal, plus what the user gets when it cannot be recovered), <b>cost and latency budget<\/b> (per-request budget, monthly ceiling, latency target, minimum reliability), <b>trust boundary<\/b> (which inputs someone else can write, and the smallest set of actions the feature needs)<\/li><li>The criteria become the eval cases, the failures become the error paths, the numbers become the budget you instrument, the boundary becomes the hooks. An agentic coding tool should also plan first and produce this artifact before it writes code<\/li><\/ul>\n<p><b>What an eval is<\/b><\/p>\n<ul><li>A fixed set of input cases, an expected behavior for each, and a grade. Run the feature on every case, grade each output, average the scores. It works like a thermometer: it does not heal anything, it gives you a number you can trust<\/li><li>\"Done\" stops being a feeling after a few manual tries and becomes a score. Write the eval <b>before<\/b> the feature so you cannot rationalize whatever the model produces<\/li><li>The first score (say 2 or 3 out of 10) is normal. What matters is whether the number rises as you change the prompt, the tools or the model. Change <b>one component at a time<\/b>, and read per-case results, not only the average (an average can hide three fixed and three broken cases)<\/li><li>A failure category tells you where to look: formatting points at output instructions, factual errors on retrieved text point at retrieval, failures only on long input point at context handling<\/li><\/ul>\n<p><b>Pick the grader by the shape of the output<\/b><\/p>\n<ul><li><b>Exact or string match<\/b>: one correct form (a single label or value). Cheapest, brittle, fails valid paraphrases and reorderings<\/li><li><b>Code-graded check<\/b>: a function validates the output (valid JSON, parseable code, a number in range, a required field). Catches format failures, says nothing about quality<\/li><li><b>LLM-as-judge<\/b>: open-ended quality (faithfulness, instruction following, tone). The only method that scales those questions, but the most expensive and noisiest. Using it where a code check would do adds cost and variance for nothing<\/li><li>Code checks run locally for free, so run them on every commit. A judge is an extra model call per case, so many teams run it on a slower, scheduled quality pass<\/li><\/ul>\n<p><b>Build and calibrate the judge<\/b><\/p>\n<ul><li>Ask for <b>strengths, weaknesses and reasoning<\/b> before the score. Without that, models drift to a safe middle number around six<\/li><li><b>Calibrate<\/b>: run the judge on cases a human already labeled and measure agreement. A judge that disagrees half the time gives a number that looks rigorous and means nothing. If agreement is low, tighten the rubric (what each score band means), add an example of a good and a bad answer, and measure again<\/li><\/ul>\n<p><b>Coverage beats perfection<\/b><\/p>\n<ul><li>A larger set with slightly noisier grading usually finds more than a few hand-graded cases. Twenty cases with irregular inputs catch a break that three tidy ones never touch. Have Claude generate extra cases from a small labeled set and spot-check them<\/li><li>Ask the model to enumerate edge cases before launch (two dates in one sentence, no date, a relative date like \"next Tuesday\")<\/li><\/ul>\n<p><b>Incident: validation is not correctness<\/b><\/p>\n<ul><li>An extractor returned April 12 for \"ordered on March 3, received April 12\". Every check passed (non-empty, populated, well-formed date), because validation only checks the <b>shape<\/b> of a value, not that it is the right one. No graded case had two dates. The fix was a prompt change that names which date, but the eval is what detected it and guards the regression<\/li><\/ul>"}, {"t": "h", "x": "Module 4: test levels, tracing and retrieval routing"}, {"t": "html", "x": "<p><b>Four test levels<\/b><\/p>\n<ul><li><b>Unit<\/b>: one function (a parser, a tool wrapper). Cannot see how pieces fit<\/li><li><b>Functional<\/b>: one Claude call returns the expected shape for an input. Does not test the system around it<\/li><li><b>Integration<\/b>: the handoff between two components (retrieval into the model call). <b>Most silent failures hide here<\/b>, because each side passes its own tests<\/li><li><b>End-to-end<\/b>: the full flow as a user runs it. Catches whole-flow breaks, slowest, hardest to localize<\/li><\/ul>\n<p><b>Tracing<\/b><\/p>\n<ul><li>A trace records each step: prompt, tool calls, intermediate outputs, timing. Tests say a failure exists, the trace says <b>which step<\/b> produced it. It turns a day of manual digging into a five-minute fix and makes a change reviewable<\/li><li>Incident: parser and model-call tests passed, the end-to-end test failed. <code>retrieve()<\/code> returned a list of chunk dictionaries, <code>build_prompt()<\/code> expected a plain string, so the model got malformed context and answered from memory. Fix: align the contract at the handoff and add an integration test that drives retrieval into the prompt builder with real data<\/li><\/ul>\n<p><b>Retrieval routing<\/b><\/p>\n<ul><li>A cheap classification call can send single-fact lookups to fetch-once retrieval and multi-part questions to search across rounds, so you pay for iteration only when needed. Defaulting everything to iterative search inflates cost and latency, defaulting everything to a static index gives shallow answers on multi-step questions<\/li><li>The router pays off when traffic is mixed. If every query has the same shape, hardcode the fitting path<\/li><\/ul>"}]}, {"id": "r-memory", "title": "Agent memory and Skills", "minutes": 3, "groups": ["memory"], "blocks": [{"t": "h", "x": "Module 2: agent memory scope and Skills"}, {"t": "html", "x": "<p><b>Choose the memory scope at design time<\/b><\/p>\n<ul><li><b>In-context<\/b>: state lives in the conversation. Zero retrieval cost, but token cost grows every turn and everything is lost when the session ends. For short sessions that fit the window<\/li><li><b>External storage<\/b>: state written to a database and read at session start or on demand. Survives sessions, users and instances. Costs retrieval latency and read/write code<\/li><li><b>Summarized memory<\/b>: a condensed history injected at the next session start. Cheaper than replaying everything, but loses whatever the summarizer prompt did not keep<\/li><li><b>Stateless<\/b>: nothing persists. Right for jobs that finish and close, or fully independent runs<\/li><\/ul>\n<p><b>Matching examples<\/b><\/p>\n<ul><li>Support agent across daily check-ins for two weeks: external storage<\/li><li>Document formatter that finishes each file: stateless<\/li><li>Coding assistant in one multi-hour session that will not continue afterwards: in-context<\/li><\/ul>\n<p><b>Why decide early<\/b><\/p>\n<ul><li>Storing everything in the messages array works at first, then cost, latency and the window ceiling bite. Moving state out under production pressure takes hours of restructuring, while choosing at design time takes minutes<\/li><li>Incident: development ran one long session, production ran many shorter sessions with state accumulating. By session four more than 40,000 tokens of history were injected before the first tool call. Measure expected state size (history + system prompt + tool schemas) against the window before choosing in-context<\/li><\/ul>\n<p><b>Skills<\/b><\/p>\n<ul><li>A Skill is a reusable <code>SKILL.md<\/code> with frontmatter (name, description) and instructions. Claude reads the name and description of every skill and loads the full instructions only when a request matches. Unused skills cost almost nothing<\/li><li><b>Skill<\/b>: loads on demand, low context cost. For task-specific expertise (review checklists, output formats)<\/li><li><b>CLAUDE.md<\/b>: loads every session in Claude Code, fixed overhead. For always-on project standards. In the Agent SDK, whether CLAUDE.md loads depends on the <code>settingSources<\/code> setting, so set it explicitly<\/li><li><b>In-context instructions<\/b>: present every turn of that session, grow with it, gone at the end<\/li><li>On the Messages API, Skills are in beta and need the beta headers <code>code-execution-2025-08-25<\/code> and <code>skills-2025-10-02<\/code>. They run in the code execution container. Re-check headers before production<\/li><li>Subagents do <b>not<\/b> inherit Skills or conversation history from the parent (list needed Skills in the subagent's configuration), but they <b>do<\/b> inherit the permission context<\/li><\/ul>"}]}, {"id": "r-multimodal", "title": "Images, PDFs and volume", "minutes": 3, "groups": ["multimodal"], "blocks": [{"t": "h", "x": "Module 2: images, PDFs and high-volume processing"}, {"t": "html", "x": "<p><b>Images cost context<\/b><\/p>\n<ul><li>Claude sees an image in 28x28 pixel patches, one visual token per patch: cost = ceil(width/28) x ceil(height/28). A 1,000 x 1,000 image is 36 x 36 = 1,296 tokens<\/li><li>Each model tier has a maximum native resolution (long edge and visual-token limits). Larger images are downscaled first, then the formula runs on the scaled size. Limits differ by tier and change between generations, so check the Vision page<\/li><li>Measure the token cost of the <b>largest<\/b> production image at design time. An over-budget pipeline is often fixed by a resize step<\/li><\/ul>\n<p><b>Three ways to send an image<\/b><\/p>\n<ul><li><b>Inline base64<\/b>: the bytes travel with every request. Fine for a one-off image, costly if the same image repeats<\/li><li><b>URL reference<\/b>: Claude fetches it from a URL<\/li><li><b>Files API<\/b>: upload once and reference the <code>file_id<\/code> in each request. Best for assets reused across requests (a reference diagram in every call)<\/li><\/ul>\n<p><b>PDFs<\/b><\/p>\n<ul><li>Use a <code>document<\/code> block (not image). Its source can be base64, a URL or a Files API file_id. A <code>title<\/code> and <code>context<\/code> are optional, no name field is required. Token cost and Files API reuse work as for images<\/li><li>Prompting techniques still apply. Visual input adds ambiguity, so name how to handle it (\"if objects overlap, describe each separately and note the overlap\")<\/li><\/ul>\n<p><b>Message Batches API for volume<\/b><\/p>\n<ul><li>Up to 100,000 requests or 256 MB per batch, you get a <code>batch_id<\/code> and poll for completion. Lower per-token cost, latency non-deterministic (up to 24 hours, often faster). Results come back in any order, so match by <code>custom_id<\/code><\/li><li><b>Right for<\/b>: nightly classification of 5,000 records, an evaluation run over 2,000 examples. <b>Wrong for<\/b>: a user uploading a photo and waiting, a chatbot reply<\/li><li><b>Chunking a list and looping over the synchronous API is not batching.<\/b> The API still sees one request per item and the rate limits still fire. Batching is a different submission model, not a smaller batch size<\/li><li>Good combination for offline work: Files API for reused assets, Batches for latency-tolerant volume, structured outputs for machine-readable results<\/li><li>Mistakes: batching a user-facing flow (passes tests, fails in production) and ignoring image cost at scale<\/li><\/ul>"}]}, {"id": "r-accelerators", "title": "Accelerators and contribution", "minutes": 3, "groups": ["accelerators"], "blocks": [{"t": "h", "x": "Module 5: packaging a build as an accelerator and contributing it back"}, {"t": "html", "x": "<p><b>The idea<\/b><\/p>\n<ul><li>A build that runs is not yet a build that survives <b>reuse, review or deployment<\/b>. An accelerator is a solution packaged so the next engagement starts from a working foundation and <b>configures<\/b> it instead of rebuilding it. Package while the build is fresh: the knowledge of what is customer-specific is most expensive to reconstruct after the people who held it have moved on<\/li><\/ul>\n<p><b>Three asset types, packaged differently<\/b><\/p>\n<ul><li><b>Agent template<\/b> (system prompt, tool schemas, loop): move every customer-specific value (prompts, paths, scopes, credentials by reference, thresholds) into configuration with documented defaults<\/li><li><b>MCP server package<\/b> (tools and their inputs): document every tool input and let the installing team set the scope, so it installs into a new environment without code edits<\/li><li><b>Eval suite<\/b> (graded dataset plus judge rubric): ship the dataset and rubric together so a new team can run them in its own context. The same suite is the <b>deployment gate<\/b>: run a new model version against a pinned baseline score before it goes live<\/li><\/ul>\n<p><b>What a package must contain<\/b><\/p>\n<ul><li><b>Parameters<\/b> for what changes per customer. <b>Documentation<\/b> of what a reader cannot infer from code: environment assumptions, expected inputs, handled failure modes, and the eval that defines \"working\". <b>Audit bundle<\/b>: what data the asset touches, which identity it acts under, and the log it leaves. A regulated reviewer asks for exactly these, and an accelerator without them stalls at the first security review<\/li><li>Loose scripts are the most common wrong form: they run, so they look reusable, but every customer value is buried in a different file and the next team copies and diverges them<\/li><li>Incident: a template with hardcoded repo path, model name, thresholds and prompt fragments shipped on time. A second team could not configure it, found no documentation and no eval, and rewrote it. A template that runs has not been packaged for reuse<\/li><li>Not worth it for a one-off a customer will never reuse<\/li><\/ul>\n<p><b>Contributing back<\/b><\/p>\n<ul><li>Match the contribution to the channel built for its shape. The <b>Claude Cookbook<\/b> (GitHub) is for <b>focused reference implementations<\/b> of a single pattern or a few, shown end to end. Open-source MCP servers and tools live in <b>their own repositories<\/b> with their own conventions. A whole application (UI, deployment scripts) does not fit a Cookbook review: strip it down to the reusable pattern first<\/li><li>A maintainer accepts what they can verify: code that <b>does one thing<\/b>, a <b>runnable example<\/b>, a <b>test<\/b> that proves the behavior, and a short statement of <b>assumptions<\/b>. A PR with none of these sits at the back of the queue, because the reviewer would have to reconstruct your intent<\/li><li><b>Rights and attribution come first<\/b>, before technical review. Engagement code may carry licensing constraints on where it can go. Confirm you may contribute it and attribute prior work. If a constraint cannot be cleared, do not contribute: escalate to the owner<\/li><li>Your part as Developer is technical readiness (focused code, example, test, assumptions, rights check). Example: a reusable conversation-handling pattern from a customer-service engagement, stripped of customer specifics, prepared as a general Cookbook example<\/li><li>Case matching: a focused tool wrapping one API goes to the tool's own repository and needs a test; a full application needs reduction to one focused pattern; a one-line fix to an existing Cookbook example goes to that example's repository and needs a rights check when it came from an engagement<\/li><\/ul>\n<p><b>From business problem to requirements<\/b><\/p>\n<ul><li>A business goal (\"help support agents answer faster\") is not a requirement. A <b>functional requirement<\/b> is a checkable statement of behavior (\"classify each ticket into one of four queues; draft a reply citing policy; never auto-send without human approval\"). Each becomes a line in an eval<\/li><li><b>Infrastructure requirements<\/b> are non-functional constraints you derive by asking: latency (measured where the user is), scale (peak), residency (where processed, under which regulation), identity (who acts, what is auditable). They most often decide the platform. Record them with the regulation each comes from, so the platform choice is defended as following from requirements<\/li><li>Example, EU bank summarizing call transcripts: \"a human approves a summary before it is stored\" is functional. \"Transcript data is processed in the EU\" is an infrastructure (residency) requirement. \"Fast and accurate\" is not checkable<\/li><\/ul>\n<p><b>Lifecycle and gates<\/b><\/p>\n<ul><li>Requirements, design (platform, model, trust boundaries), build, test (evals, unit, integration, e2e), deploy (pin the version, gate promotion on the eval), operate (instrument cost, latency, errors, guardrails), iterate (feed findings back into requirements)<\/li><li>A gate is the decision to move to the next phase. Do not leave design before the platform satisfies residency, and do not move from deploy to full production until the new version clears the eval against the pinned baseline. A regulated deployment cannot collapse phases<\/li><li>Placement examples: pinning the full model ID and keeping the prior version = deploy. Gating promotion on the eval = deploy. Deciding data must stay in a region = requirements. Choosing Bedrock because the customer holds its compliance there = design. Instrumenting cost and latency per call in production = operate<\/li><\/ul>"}]}, {"id": "r-limits", "title": "Key numbers to memorize", "minutes": 3, "groups": ["limits"], "blocks": [{"t": "h", "x": "Key numbers to memorize"}, {"t": "html", "x": "<p><b>Exam<\/b><\/p>\n<ul><li>53 questions, 120 minutes, multiple choice and multiple response, pass 720 of 1000<\/li><li>Domains: Applications 33.1, Models and optimization 16.8, Agents 14.7, Prompt and context 11.0, Tools and MCP 10.6, Security 8.1, Claude Code 3.1, Evals 2.6<\/li><\/ul>\n<p><b>Models<\/b><\/p>\n<ul><li>1M context, 128K max output on all current models. Prices per MTok in/out: Fable 8/40, Opus 4/20, Sonnet 2/10, Haiku from 0.10/0.50<\/li><\/ul>\n<p><b>Caching<\/b><\/p>\n<ul><li>Order tools, system, messages. 4 breakpoints, 5 min or 1 hour TTL, write 1.25x or 2x, read 0.1x (0.05x on Opus 5.5 and Sonnet 5.5). Minimum 512 tokens on current models. Lookback 20 blocks<\/li><\/ul>\n<p><b>Batch<\/b><\/p>\n<ul><li>50% discount, 100,000 requests or 256 MB, 24 hours to complete, results kept 29 days, any order (use custom_id)<\/li><\/ul>\n<p><b>Structured outputs<\/b><\/p>\n<ul><li>20 strict tools, 24 optional parameters, 16 union-type parameters per request. Grammar cache 24 hours<\/li><\/ul>\n<p><b>Stop reasons<\/b><\/p>\n<ul><li>end_turn, max_tokens, stop_sequence, tool_use, pause_turn (server loop limit 10), refusal, model_context_window_exceeded<\/li><\/ul>\n<p><b>HTTP<\/b><\/p>\n<ul><li>400 bad request, 401 key, 403 permission, 404 not found, 413 too large, 429 rate limit, 500 server error, 529 overloaded<\/li><\/ul>\n<p><b>Effort<\/b><\/p>\n<ul><li>low, medium, high, xhigh, max. Default high (medium on Opus 5.5 and Haiku 5.5)<\/li><\/ul>\n<p><i>Check these against the updated exam guide published 17 November 2026.<\/i><\/p>"}]}]}]};
