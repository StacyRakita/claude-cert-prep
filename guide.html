<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#efece4;--border:#ded8c9;--text:#1b2028;--muted:#66707c;--accent:#b3620a;--accent-ink:#fff;--teal:#0d7d72;--ok:#1c7c4c;--ok-bg:#e3f3e9;--bad:#b3261e;--bad-bg:#fbe6e4;--warn-bg:#fdf1dc;--warn-b:#e8c98b;--code:#f0ece2;--shadow:0 1px 2px rgba(20,20,10,.06),0 8px 24px -14px rgba(20,20,10,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--surface:#161b22;--surface2:#1c222b;--border:#2b3340;--text:#e8ecf1;--muted:#8b95a3;--accent:#e2a33d;--accent-ink:#1b1300;--teal:#3fc7b8;--ok:#4fce88;--ok-bg:#123322;--bad:#ff7a70;--bad-bg:#3a1512;--warn-bg:#2a2112;--warn-b:#5a4721;--code:#222a35;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 80px}
header{display:flex;gap:12px;align-items:center;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border);margin-bottom:14px}
.back{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);color:inherit;text-decoration:none;font-weight:700;background:var(--surface);cursor:pointer;flex:none}
header h1{font-size:17px;margin:0;line-height:1.2}header .sub{color:var(--muted);font-size:13px}
h2{font-size:22px;margin:6px 0 4px;line-height:1.25}h3{font-size:17px;margin:22px 0 6px}
p{margin:10px 0}ul{margin:8px 0;padding-left:22px}li{margin:5px 0}
code{background:var(--code);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,Menlo,monospace}
pre{background:var(--code);padding:12px 14px;border-radius:12px;overflow:auto;font-size:13px;line-height:1.5;margin:12px 0}pre code{background:none;padding:0}
.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;margin:4px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.item:hover{border-color:var(--accent)}
.tag{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}.tag.ok{color:var(--ok);border-color:var(--ok)}
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.grow{flex:1}
/* widgets */
.tabs{margin:14px 0}.tabbar{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--border)}
.tabbar button{padding:10px 14px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}.tabpane{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:6px 16px 12px}
.steps{margin:14px 0}.stepbar{display:flex;gap:8px;flex-wrap:wrap}.stepbar button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.stepbar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}.steppane{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 16px 14px}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}.flip{min-height:150px;perspective:900px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;border:1px solid var(--border);padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto;font-size:14.5px;line-height:1.5}
.flip .f{background:var(--surface);display:flex;flex-direction:column;justify-content:center;font-weight:650}.flip .f small{color:var(--muted);font-weight:400;margin-top:8px}
.flip .b{background:var(--surface2);transform:rotateY(180deg)}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}th{background:var(--surface2);font-weight:650}tr:last-child td{border-bottom:none}
.callout{border-radius:12px;padding:12px 16px;margin:14px 0;border:1px solid var(--border);background:var(--surface)}.callout .ct{font-weight:700;margin-bottom:2px}
.callout.watch{background:var(--warn-bg);border-color:var(--warn-b)}.callout.tip{border-left:4px solid var(--teal)}.callout.key{border-left:4px solid var(--accent)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}.trio>div{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:14.5px}
.trio b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}.trio .g b{color:var(--ok)}.trio .c b{color:var(--accent)}.trio .o b{color:var(--teal)}
.incident{border:1px solid var(--warn-b);background:var(--warn-bg);border-radius:14px;padding:14px 16px;margin:16px 0}.incident h4{margin:0 0 8px;font-size:16px}.incident .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-top:10px}.incident p{margin:3px 0}
.quiz{border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:16px 0;background:var(--surface)}.quiz .qq{font-weight:650;margin-bottom:8px}
.quiz button.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.quiz button.o.ok{background:var(--ok-bg);border-color:var(--ok)}.quiz button.o.bad{background:var(--bad-bg);border-color:var(--bad)}.quiz .why{margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:14.5px;display:none}
details.term{border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--surface)}details.term summary{cursor:pointer;padding:12px 14px;font-weight:650}details.term div{padding:0 14px 12px;color:var(--text)}
.nav{display:flex;gap:10px;margin:22px 0}.nav .btn{flex:1}
@media (max-width:520px){h2{font-size:20px}.wrap{padding:0 14px 80px}}
</style></head><body><div class="wrap">

<script>
var G = {"title": "Claude Developer Guide", "modules": [{"id": "m1", "title": "Module 1 · How Claude works", "minutes": 47, "blurb": "Tokens, the context window, sampling, model tiers, reasoning, prompting modes, SDK and REST.", "intro": "The foundations every later module builds on: what a request really contains, why answers vary, how to choose a model, and how your code talks to the API.", "lessons": [{"id": "m1-behave", "title": "How LLMs behave: tokens, context, sampling", "minutes": 12, "groups": ["m1-behave"], "blocks": [{"t": "p", "x": "Before you build anything, you need a correct mental model of four things: **tokens**, the **context window**, **sampling** and **non-determinism**. Most production surprises trace back to one of them."}, {"t": "tabs", "items": [{"title": "Tokens", "body": [{"t": "h", "x": "Tokens: the unit of input, output and cost"}, {"t": "p", "x": "Claude does not read characters or words. It reads **tokens**, pieces of text. The characters-per-token average depends on the tokenizer of the model you use and **changes between model generations**, so treat any ratio as model-dependent and confirm it at build time."}, {"t": "p", "x": "Everything the model processes is counted in tokens: your prompt, the conversation history, tool definitions, tool results and the answer it generates. Tokens are the unit of **both pricing and budget**."}, {"t": "callout", "kind": "tip", "title": "A useful habit", "body": [{"t": "p", "x": "Think in tokens, not words. When you estimate what a feature costs, or whether an input fits, you are counting tokens. The API bills in tokens and the context window measures tokens."}]}]}, {"title": "Context window", "body": [{"t": "h", "x": "The context window is a fixed budget"}, {"t": "p", "x": "The **context window** is the total number of tokens the model can take in for one request. It holds everything at once: the system prompt, the whole conversation so far, any documents you inject, every tool result, and the output."}, {"t": "p", "x": "It has two distinct edge behaviors:"}, {"t": "ul", "items": ["**Input already larger than the window:** the request is rejected with a validation error before generation begins.", "**Input fits but generation reaches the ceiling:** current models stop and return the output generated so far, with the stop reason `model_context_window_exceeded`, instead of raising an error."]}, {"t": "p", "x": "Either way, nothing is silently dropped. Keeping a long session running means **your application** must trim or summarize history before each call."}, {"t": "callout", "kind": "watch", "title": "Development hides this", "body": [{"t": "p", "x": "In development the window rarely fills because test inputs are short. In production, longer inputs and more turns fill it faster. This is the failure Module 2 studies in detail."}]}]}, {"title": "Sampling", "body": [{"t": "h", "x": "Sampling: why the same prompt can give different answers"}, {"t": "p", "x": "A language model does not pick one fixed next token. At each step it produces a **probability distribution** over possible next tokens and then **samples** from it. Settings such as `temperature` shape that distribution: lower concentrates probability on the most likely tokens (more repeatable output), higher spreads it out (more varied output)."}, {"t": "p", "x": "Because the choice is sampled, the same prompt run twice can return different wording even when both answers are correct. That is how the model generates, not a defect."}, {"t": "callout", "kind": "watch", "title": "Sampling controls are model-dependent", "body": [{"t": "p", "x": "The newest Claude models **do not accept non-default sampling parameters**: setting `temperature`, `top_p` or `top_k` returns a **400 error**, and behavior is steered through prompting instead. Even where `temperature` is accepted, 0 makes outputs more repeatable but does **not** guarantee identical output across calls. Confirm parameter support in the API reference at build time."}]}]}, {"title": "Non-determinism", "body": [{"t": "h", "x": "What non-determinism means for testing and evals"}, {"t": "p", "x": "Non-determinism is the main consequence of sampling: **identical inputs do not guarantee identical outputs**. That changes how you test a Claude feature."}, {"t": "ul", "items": ["A test that asserts the **exact text** of a response is inconsistent, because the model can express the same correct answer many ways.", "Instead, assert the **property** that must hold: a required field is present, a value is in range, the structure parses.", "When you must judge **meaning** rather than structure, use an eval with a model-graded judge."]}, {"t": "p", "x": "This is why the course treats **evals** as the standard for knowing a feature is correct (Module 4)."}]}]}, {"t": "quiz", "q": "A teammate says two identical prompts must return identical text. What is the most accurate response?", "options": ["That is true, the model is deterministic.", "Not necessarily: the model samples each next token from a probability distribution, so wording can vary even when both answers are correct.", "That is only true if streaming is off.", "That is only true on the largest model."], "answer": 1, "why": "Sampling makes generation non-deterministic, which is why tests assert properties and meaning rather than exact text."}, {"t": "quiz", "q": "A request's input alone is larger than the whole context window. What happens?", "options": ["Claude silently drops the oldest messages and answers.", "The request is rejected with a validation error before generation.", "It is cut and answered with stop_reason max_tokens.", "It waits in a queue for a larger model."], "answer": 1, "why": "An oversized input never starts generating. Your application must trim or summarize history first."}]}, {"id": "m1-models", "title": "Model options and reasoning modes", "minutes": 10, "groups": ["models"], "blocks": [{"t": "p", "x": "Choosing **which model runs** and deciding **whether the model reasons first** are two separate decisions you make per request. They compose, and getting each right is the cheapest quality and cost lever you have."}, {"t": "tabs", "items": [{"title": "The model family", "body": [{"t": "p", "x": "Claude is a family of models that currently spans four tiers: **Fable, Opus, Sonnet and Haiku**. Each is a different tradeoff across cost, latency and capability."}, {"t": "table", "head": ["Tier", "Built for", "Claude API ID", "Price in / out per million tokens"], "rows": [["**Fable 5.2**", "The most demanding reasoning, coding and agentic work where maximum intelligence is the priority", "`claude-fable-5-2`", "$8 / $40"], ["**Opus 5.5**", "Demanding work above the Sonnet envelope: long-running agentic coding and knowledge work", "`claude-opus-5-5`", "$4 / $20"], ["**Sonnet 5.5**", "The balanced default for most production workloads", "`claude-sonnet-5-5`", "$2 / $10"], ["**Haiku 5.5**", "Speed and cost on tasks that fit its envelope: classification, extraction, routing", "`claude-haiku-5-5`", "from $0.10 / $0.50"]]}, {"t": "p", "x": "All four accept text and images, return text, support tool use, and offer a **1M-token context window** with up to **128K output tokens**."}, {"t": "callout", "kind": "key", "title": "The practical default", "body": [{"t": "p", "x": "**Start with Sonnet.** Move up to Opus only when an eval shows Sonnet missing your quality bar. Move down to Haiku only when an eval shows the quality drop is acceptable for the task. Confirm the current lineup and IDs at platform.claude.com/docs at build time, because the family keeps evolving."}]}]}, {"title": "Reasoning modes", "body": [{"t": "h", "x": "Reasoning is a separate setting from model choice"}, {"t": "p", "x": "Which model to run is one decision. Whether it reasons before answering is another, made per call. On current models the reasoning mode is **adaptive thinking**: the model decides when and how much to think, and you tune depth with the **effort** setting instead of a fixed token budget."}, {"t": "ul", "items": ["The older `budget_tokens` control is **deprecated** and, on the newest model generations, returns a **400 error**.", "Thinking content is **omitted from responses by default** on the newest models. Request summarized display when you need to show it.", "Reasoning earns its cost on **hard, multi-step problems** and is wasted on lookups and classification.", "Per-model defaults differ (some models think adaptively by default), so confirm the defaults for your model."]}]}, {"title": "How they work together", "body": [{"t": "p", "x": "Because model choice and reasoning mode are **independent**, you can set each separately:"}, {"t": "flip", "items": [{"front": "Capable model, reasoning off", "back": "Fast and direct. Good when the task is hard to phrase but not hard to reason about."}, {"front": "Smaller model, reasoning on", "back": "Spends more tokens thinking. Can reach a good answer on a task a bare small model would miss."}, {"front": "The hardest tasks", "back": "Pair a capable model with a higher effort setting."}]}, {"t": "p", "x": "Module 2 teaches the mechanics of enabling reasoning and handling the thinking blocks it returns. Module 4 teaches how to decide which model to run against cost, latency and quality."}]}]}, {"t": "quiz", "q": "Which statement best separates model choice from reasoning mode?", "options": ["They are the same setting.", "Extended thinking is a different model.", "Model choice picks which member of the family runs; reasoning is a per-call setting that a supporting model can run with on or off.", "Reasoning mode is fixed per account."], "answer": 2, "why": "The two levers are independent but can work together."}]}, {"id": "m1-modes", "title": "Prompting modes: zero-shot, one-shot, multi-shot", "minutes": 8, "groups": ["m1-modes"], "blocks": [{"t": "p", "x": "Separate from how you word a prompt is **how many worked examples** you put inside it. That choice trades quality against cost."}, {"t": "tabs", "items": [{"title": "The three modes", "body": [{"t": "ul", "items": ["**Zero-shot:** the instruction only, no examples. You describe the task and ask for the result.", "**One-shot:** one example of an input paired with the desired output.", "**Multi-shot** (also called few-shot): several such examples."]}, {"t": "callout", "kind": "key", "title": "Examples are not training data", "body": [{"t": "p", "x": "They sit **inside the prompt** and show the model the exact shape of the answer you want, which a description alone often fails to pin down. Nothing is learned or stored for later calls."}]}]}, {"title": "Cost and quality trade-off", "body": [{"t": "p", "x": "Each example you add costs tokens on **every call** and consumes context budget."}, {"t": "ul", "items": ["Reach for **zero-shot** when the task is simple and the output shape is obvious.", "Move to **one-shot or multi-shot** when the output has a specific structure, casing or edge case that a description keeps missing.", "Often **one or two correct examples fix the issue faster** than another paragraph of instructions.", "The general discipline: add the **smallest amount of prompt** that produces a reliable result."]}]}, {"title": "Mode and model choice", "body": [{"t": "p", "x": "Prompting mode and model choice are related levers. A more capable model often succeeds zero-shot on a task where a smaller model needs a few examples to match the structure. So **adding examples can let a cheaper model do the job**."}, {"t": "p", "x": "Make the two decisions together: try the simplest model and the fewest examples that meet your eval, and add capability or examples only where the eval says you need them."}]}]}, {"t": "trio", "good": "Zero-shot for simple tasks with an obvious output shape. Examples when the shape or an edge case keeps going wrong.", "cost": "Every example adds tokens to every call and can be copied too closely if all examples share a quirk.", "other": "If the structure must be guaranteed, use structured outputs instead of examples (Module 2)."}, {"t": "quiz", "q": "A short, well-specified classification task already returns the right answer zero-shot. What does adding three examples most likely do?", "options": ["Improves accuracy substantially.", "Adds token cost on every call for little or no gain.", "Changes the model being used.", "Disables sampling."], "answer": 1, "why": "Add examples when the output shape is wrong, not when zero-shot already works."}]}, {"id": "m1-substrate", "title": "The technical substrate: SDKs, REST, streaming, async", "minutes": 12, "groups": ["m1-substrate"], "blocks": [{"t": "p", "x": "Underneath every Claude feature is the same API. This lesson covers how your code reaches it and how responses can be delivered."}, {"t": "tabs", "items": [{"title": "SDK vs REST", "body": [{"t": "p", "x": "At its core, Claude is reached over an **HTTP REST API**: your code sends a request with your API key and a JSON body and reads a JSON response. You can call it with any HTTP client."}, {"t": "p", "x": "More commonly you use an **official SDK** (Python and TypeScript, among others). It is a thin convenience layer over the same API and model that handles authentication, request construction, **retries** and response parsing, so you write less boilerplate."}, {"t": "callout", "kind": "key", "title": "What stays the same", "body": [{"t": "p", "x": "The SDK and raw REST reach the **same API and the same model**. The SDK saves you from assembling requests by hand. Module 2 builds against the SDK and the Messages API."}]}]}, {"title": "Sync, streaming, real time", "body": [{"t": "ul", "items": ["**Synchronous:** you send the request and wait for the complete response in one piece. Fine for short answers and backend jobs where nobody is waiting.", "**Streaming:** the response arrives in pieces as the model generates it. Output appears immediately instead of after a blank-screen wait, and your code reassembles the pieces. Delivered over the same HTTP connection as **server-sent events**.", "**Real-time feel:** streaming is what makes an interface feel instant."]}, {"t": "p", "x": "Module 2 teaches how to consume a stream safely and recover when it is interrupted."}]}, {"title": "Async for high volume", "body": [{"t": "p", "x": "Two patterns address high-volume work, and they solve **different problems**."}, {"t": "ul", "items": ["**Async clients.** The Python SDK exposes `AsyncAnthropic`, which uses non-blocking `async/await` so your thread is free while a call waits. In TypeScript the standard client is already **Promise-based**, so there is no separate async class. The request still returns in real time, but your application can do other work meanwhile.", "**Message Batches API.** A separate pattern for bulk **offline** workloads: submit many requests in one call, receive an identifier, and **poll** for completion. Jobs can take up to 24 hours but cost less per token. Suited to offline pipelines, evaluation runs and bulk jobs where no user is waiting."]}]}]}, {"t": "table", "head": ["Delivery", "Use it when", "Trade-off"], "rows": [["Synchronous request", "Short answers, backend jobs, nobody waiting", "Simplest, but the caller waits for the whole answer"], ["Streaming", "Long answers, a user watching a screen", "You assemble blocks yourself and must handle interruptions"], ["Async client", "Many concurrent calls without blocking threads", "Still real time, still subject to rate limits"], ["Message Batches", "Large offline jobs, evals, bulk classification", "Latency up to 24 hours, results in any order"]]}, {"t": "quiz", "q": "How do an official SDK and raw REST calls differ?", "options": ["The SDK calls a different, faster model.", "Raw REST cannot stream.", "The SDK is a thin layer over the same API and model.", "The SDK bypasses the account's rate limits."], "answer": 2, "why": "Both reach the same API. The SDK saves boilerplate: auth, retries and parsing."}, {"t": "quiz", "q": "You must process thousands of inputs offline at the lowest cost. Which shape fits?", "options": ["Synchronous calls in a loop.", "Streaming.", "Batch submission with polling.", "A larger context window."], "answer": 2, "why": "Batch trades latency for lower per-token cost and avoids the rate limits a synchronous loop hits."}]}, {"id": "m1-recap", "title": "Module 1 recap: five takeaways and key terms", "minutes": 5, "groups": [], "blocks": [{"t": "h", "x": "Five takeaways"}, {"t": "flip", "items": [{"front": "1. Tokens are the unit of input, output and cost", "back": "Think and budget in tokens rather than words: that is what the API meters and the context window measures."}, {"front": "2. The context window is a fixed budget that holds the whole request", "back": "An oversized input errors before generation, while hitting the ceiling mid-generation returns truncated output with model_context_window_exceeded. Managing history is your application's job."}, {"front": "3. Sampling makes generation non-deterministic", "back": "The same prompt can return different wording on each run, so testing on exact text is unreliable. This is what evals are built for."}, {"front": "4. Model choice and reasoning mode are separate, composable levers", "back": "Pick the smallest model and the simplest reasoning and prompting that meet your eval, and add capability only where the eval says you need it."}, {"front": "5. The SDK and REST reach the same API", "back": "Choose the delivery that fits the work: synchronous, streaming, async client, or Message Batches for offline volume."}]}, {"t": "h", "x": "Key terms"}, {"t": "terms", "items": [{"term": "Token", "d": "The unit of text a model reads and writes. Input, output and pricing are all counted in tokens."}, {"term": "Context window", "d": "The fixed token budget for one request: system prompt, history, documents, tool results and output."}, {"term": "Sampling", "d": "Choosing each next token from a probability distribution. Temperature reshapes the distribution."}, {"term": "Non-determinism", "d": "Identical inputs do not guarantee identical outputs. Test properties, not exact text."}, {"term": "Adaptive thinking", "d": "The model decides when and how much to reason, steered by the effort setting."}, {"term": "Zero-shot, one-shot, multi-shot", "d": "No example, one example, or several examples placed inside the prompt."}, {"term": "Message Batches API", "d": "Asynchronous bulk processing at lower per-token cost, polled until complete."}]}]}]}, {"id": "m2", "title": "Module 2 · Prompting, tools and agents", "minutes": 104, "blurb": "Prompt craft, thinking, the Messages API, tool use, streaming, context engineering, agents, memory, multimodal, batch.", "intro": "The largest module and the core of the exam: how you actually build features and agents on the Messages API.", "lessons": [{"id": "m2-api", "title": "The Messages API and stop reasons", "minutes": 12, "groups": ["api", "stop"], "blocks": [{"t": "p", "x": "Almost everything runs through one endpoint, `POST /v1/messages`. Understanding its request, response and failure modes is the base for every other lesson."}, {"t": "tabs", "items": [{"title": "Request", "body": [{"t": "ul", "items": ["Required fields: `model`, `max_tokens`, `messages`.", "The API is **stateless**: Claude remembers nothing between calls. Your code resends the history each time and decides what to keep.", "`system` is a **top-level parameter**, not a message. Messages only have the roles `user` and `assistant`.", "`max_tokens` caps the **output** only. It is a ceiling, not a target."]}]}, {"title": "Response", "body": [{"t": "p", "x": "The response holds `content` (a list of **blocks**: text, tool_use, thinking and others), a `stop_reason` and `usage` (input and output tokens, plus cache fields)."}, {"t": "callout", "kind": "tip", "title": "Always read content as a list", "body": [{"t": "p", "x": "Do not assume `content[0]` is text. With tools or thinking enabled, the first block may be something else. Loop over blocks and branch on `type`."}]}]}, {"title": "Stop reasons", "body": [{"t": "table", "head": ["stop_reason", "Meaning", "Your code should"], "rows": [["`end_turn`", "Claude finished naturally", "Use the answer"], ["`max_tokens`", "Output hit your cap, possibly mid-sentence or mid-JSON", "Raise the cap or ask for shorter output; never parse truncated JSON as complete"], ["`tool_use`", "Claude wants a tool run", "Execute it, return a `tool_result`, call again"], ["`stop_sequence`", "A custom stop string was produced", "Handle as designed"], ["`refusal`", "Claude declined for safety reasons", "Surface it; do not retry blindly"], ["`model_context_window_exceeded`", "Generation reached the context ceiling", "Treat output as truncated; trim history"]]}]}, {"title": "HTTP errors", "body": [{"t": "table", "head": ["Status", "Cause", "Retry?"], "rows": [["400", "Invalid request, e.g. a rejected parameter", "No, fix the request"], ["401 / 403", "Bad key or no permission", "No"], ["429", "Rate limit", "Yes, with backoff; honor `retry-after`"], ["500 / 529", "Server error or overloaded", "Yes, with backoff"]]}, {"t": "p", "x": "The SDKs retry the retryable ones for you by default. Write your own backoff only if you bypass the SDK."}]}]}, {"t": "quiz", "q": "A response has stop_reason `max_tokens` and the JSON is cut off. What is right?", "options": ["Parse what you have.", "Treat it as incomplete: raise max_tokens or request less output, then retry.", "Switch to a larger model.", "It means the request was invalid."], "answer": 1, "why": "max_tokens means truncation, so the output cannot be trusted as complete."}, {"t": "quiz", "q": "Where does the system prompt go?", "options": ["As the first message with role system.", "As a top-level `system` parameter.", "Inside the first user message only.", "In a header."], "answer": 1, "why": "Messages only carry user and assistant roles."}]}, {"id": "m2-prompting", "title": "Prompt engineering", "minutes": 12, "groups": ["prompting"], "blocks": [{"t": "p", "x": "A good prompt is specific about the task, the audience, the format and the limits, and it shows rather than only tells."}, {"t": "steps", "items": [{"title": "State the task and the context", "body": "Say who the output is for and what it will be used for. Context lets Claude make the right trade-offs without you listing every rule."}, {"title": "Be explicit about format and length", "body": "If you need JSON, bullet points or two sentences, say so. Do not expect Claude to guess."}, {"title": "Separate instructions from data", "body": "Wrap untrusted or variable content in XML-style tags such as `<document>` so Claude cannot confuse it with your instructions."}, {"title": "Add examples where wording fails", "body": "One or two correct examples pin down shape and edge cases faster than extra paragraphs."}, {"title": "Say what to do, with the reason", "body": "Positive instructions with a reason ('keep it short because it is read on a phone') generalize better than bare prohibitions."}, {"title": "Test against an eval", "body": "Change one thing at a time and compare on a fixed set of cases, because one good output proves little."}]}, {"t": "callout", "kind": "watch", "title": "Prefilling is gone on newest models", "body": [{"t": "p", "x": "Prefilling the assistant turn to force a format is not supported on the newest models. Use structured outputs or clear instructions instead."}]}, {"t": "trio", "good": "Clear structure, XML tags, role in the system prompt, a few precise examples.", "cost": "Very long prompts cost tokens on every call; use caching for the stable part.", "other": "When the format must be guaranteed, use structured outputs or tool use with a schema."}, {"t": "quiz", "q": "User-supplied text sits inside your prompt. What reduces the risk it is read as an instruction?", "options": ["Put it at the end without markers.", "Wrap it in clear delimiters such as XML tags and tell Claude it is data.", "Lower the temperature.", "Use zero-shot."], "answer": 1, "why": "Delimiters plus an explicit statement of what is data help, though they are not a full security boundary."}]}, {"id": "m2-thinking", "title": "Thinking, effort and structured outputs", "minutes": 10, "groups": ["thinking", "structured"], "blocks": [{"t": "tabs", "items": [{"title": "Adaptive thinking", "body": [{"t": "p", "x": "On current models Claude decides when to think and how much. You steer depth with **effort**; the fixed `budget_tokens` control is deprecated and returns a 400 on the newest generations."}, {"t": "ul", "items": ["Thinking appears as `thinking` blocks in `content`; on the newest models it is omitted by default unless you request a summary.", "In a tool loop you must pass thinking blocks back unchanged with the tool result, so reasoning continues.", "Thinking tokens are billed as output tokens.", "Use it for multi-step reasoning; skip it for lookups and classification."]}]}, {"title": "Structured outputs", "body": [{"t": "p", "x": "When code must parse the answer, ask for output that conforms to a **JSON schema** rather than hoping the text is valid JSON."}, {"t": "ul", "items": ["Schema-constrained output guarantees the shape, so you do not need retry-and-parse loops for syntax.", "It guarantees **form**, not truth: values can still be wrong, so validate meaning.", "Refusals and `max_tokens` truncation can still yield output that does not match; check `stop_reason`."]}]}]}, {"t": "callout", "kind": "key", "title": "Rule of thumb", "body": [{"t": "p", "x": "Need reasoning quality: raise effort. Need parseable output: use a schema. They solve different problems and combine fine."}]}, {"t": "quiz", "q": "Your parser breaks on occasional malformed JSON. Best fix?", "options": ["Add 'return valid JSON' in capitals.", "Use schema-constrained structured output.", "Lower temperature.", "Add a larger model."], "answer": 1, "why": "A schema guarantees the structure rather than relying on instructions."}]}, {"id": "m2-tools", "title": "Tool use and MCP", "minutes": 14, "groups": ["tooluse", "mcp"], "blocks": [{"t": "p", "x": "Claude never runs your code. It emits a request to call a tool; your application executes it and reports back."}, {"t": "steps", "items": [{"title": "You define tools", "body": "Each tool has a `name`, a clear `description` and an `input_schema` (JSON schema). The description is the main signal Claude uses to decide when to call it."}, {"title": "Claude asks", "body": "The response has `stop_reason: tool_use` and one or more `tool_use` blocks, each with an `id`, the `name` and the `input`."}, {"title": "You run it", "body": "Execute the function in your code. Validate the input first, because it is model-generated."}, {"title": "You return the result", "body": "Send a `user` message containing `tool_result` blocks whose `tool_use_id` matches. Return errors with `is_error: true` so Claude can adapt."}, {"title": "Repeat until end_turn", "body": "The loop ends when Claude answers without asking for a tool."}]}, {"t": "ul", "items": ["**Parallel calls:** Claude may request several tools in one turn; return all results together in one user message.", "**tool_choice:** `auto` (default), `any` (must use some tool), a specific tool, or `none`.", "**Good descriptions beat many tools:** vague or overlapping tools cause wrong picks.", "**Server tools** (such as web search) run on Anthropic's side; **client tools** run in your code."]}, {"t": "h", "x": "Model Context Protocol (MCP)"}, {"t": "p", "x": "MCP is an open standard that lets a client connect to external **servers** which expose three things: **tools** (actions), **resources** (data to read) and **prompts** (templates). Write an integration once and any MCP client can use it, instead of building a custom connector per app."}, {"t": "table", "head": ["Piece", "Role"], "rows": [["Host / client", "The app (e.g. Claude Code) that connects to servers"], ["Server", "Exposes tools, resources, prompts"], ["Transport", "stdio for local processes, streamable HTTP for remote"]]}, {"t": "callout", "kind": "watch", "title": "Trust", "body": [{"t": "p", "x": "Tool descriptions and results from third-party servers are untrusted input. A malicious server can try to inject instructions through them."}]}, {"t": "quiz", "q": "After Claude returns stop_reason tool_use, what do you send next?", "options": ["A user message with a tool_result matching the tool_use_id.", "An assistant message with the result.", "Nothing, Claude runs the tool.", "A new system prompt."], "answer": 0, "why": "Your code runs the tool and returns the result as a user turn."}, {"t": "quiz", "q": "Which MCP feature exposes data for the model to read rather than an action?", "options": ["Tools", "Resources", "Transports", "Hooks"], "answer": 1, "why": "Resources are readable data; tools are actions."}]}, {"id": "m2-stream-cache", "title": "Streaming, caching, batch and cost", "minutes": 12, "groups": ["stream", "caching", "batch"], "blocks": [{"t": "tabs", "items": [{"title": "Streaming", "body": [{"t": "ul", "items": ["Set `stream: true`; events arrive as server-sent events: `message_start`, `content_block_start`, `content_block_delta`, `content_block_stop`, `message_delta`, `message_stop`.", "Text arrives in `text_delta`; tool input arrives as `input_json_delta` fragments you must **concatenate** and parse only at block end.", "If the connection drops, the partial output is incomplete; plan to retry or resume.", "Use it for long outputs, and the SDK stream helpers when a request may exceed the SDK's non-streaming time limit."]}]}, {"title": "Prompt caching", "body": [{"t": "p", "x": "Mark stable prefixes with `cache_control`. Later calls reuse the processed prefix at a **fraction of the input price** and lower latency."}, {"t": "ul", "items": ["A cache hit needs an **identical prefix** up to the breakpoint; any change before it invalidates it.", "Order content **stable first**: tools, system, documents, then the varying user turn.", "Cached entries expire after a short time to live that refreshes on use; check the docs for current TTL options.", "Writing the cache costs a bit more than normal input; reads cost much less, so it pays off on repeated prefixes.", "`usage` reports cache creation and cache read tokens so you can verify it works."]}]}, {"title": "Batch API", "body": [{"t": "p", "x": "Submit many requests at once for asynchronous processing at **about half price**, with results typically within a day. Results can arrive in any order, so match by `custom_id`."}, {"t": "p", "x": "Great for evals, bulk classification and backfills; wrong for anything a user is waiting on."}]}]}, {"t": "table", "head": ["Goal", "Lever"], "rows": [["Cut cost on a big repeated prefix", "Prompt caching"], ["Cut cost on offline bulk work", "Batch API"], ["Cut cost on easy tasks", "Smaller model"], ["Improve perceived speed", "Streaming"], ["Cut output cost", "Shorter outputs, lower effort"]]}, {"t": "quiz", "q": "Every request carries the same 20k-token policy document. Best cost lever?", "options": ["Batch API", "Prompt caching on the document", "A larger model", "Streaming"], "answer": 1, "why": "A stable repeated prefix is exactly what caching is for."}, {"t": "quiz", "q": "You get a cache miss every time though the system prompt is unchanged. Most likely cause?", "options": ["Streaming is on.", "Something earlier in the prefix, like a timestamp, changes each call.", "Batch is on.", "max_tokens is too low."], "answer": 1, "why": "Any change before the breakpoint breaks the prefix match."}]}, {"id": "m2-context", "title": "Context engineering", "minutes": 10, "groups": ["context"], "blocks": [{"t": "p", "x": "Quality depends on what is in the window at each call. Context engineering is choosing, ordering and trimming that content."}, {"t": "flip", "items": [{"front": "Trim", "back": "Drop content that no longer helps: old tool outputs, stale turns."}, {"front": "Summarize", "back": "Compact long history into a short summary that keeps decisions and open items."}, {"front": "Retrieve", "back": "Fetch only the relevant chunks when needed (RAG) instead of loading everything."}, {"front": "Order", "back": "Put long documents first, the question last; keep the stable prefix stable for caching."}, {"front": "Isolate", "back": "Give sub-tasks to subagents with clean windows and take back only their conclusions."}]}, {"t": "callout", "kind": "watch", "title": "Context rot", "body": [{"t": "p", "x": "More tokens is not better. Irrelevant or contradictory material dilutes attention and raises cost. Server-side options such as context editing and compaction exist to automate clearing old tool results and summarizing."}]}, {"t": "quiz", "q": "A long agent session is slowing and getting vague. Best fix?", "options": ["Raise max_tokens.", "Clear stale tool results and summarize older turns.", "Disable tools.", "Add more examples."], "answer": 1, "why": "Trim and summarize so the window holds only what helps."}]}, {"id": "m2-agents", "title": "Agents and workflow patterns", "minutes": 14, "groups": ["agents", "workflows"], "blocks": [{"t": "p", "x": "An **agent** is a loop: Claude decides, calls tools, observes results, and continues until done. A **workflow** is a fixed path you design in code. Prefer the simplest thing that works."}, {"t": "table", "head": ["Pattern", "Shape", "Use when"], "rows": [["Prompt chaining", "Step A output feeds step B", "Task splits cleanly into fixed stages"], ["Routing", "Classify, then send to a specialized path", "Distinct input categories"], ["Parallelization", "Run independent calls at once, or vote", "Speed, or confidence through multiple attempts"], ["Orchestrator-workers", "A lead splits work dynamically to workers", "Subtasks unknown in advance"], ["Evaluator-optimizer", "One generates, another critiques, loop", "Clear quality criteria and iteration helps"], ["Autonomous agent", "Loop with tools and its own plan", "Open-ended problems, trusted environment"]]}, {"t": "trio", "good": "Workflows: predictable, cheap, easy to test. Agents: flexible on open-ended tasks.", "cost": "Agents cost more, run longer, and compound errors across steps.", "other": "If a single well-prompted call solves it, use that instead."}, {"t": "h", "x": "Designing a safe agent"}, {"t": "ul", "items": ["Set **limits**: maximum turns, token budget, timeouts.", "Add **human-in-the-loop** approval for destructive or irreversible actions.", "Give each tool the **least privilege** needed.", "Make tool errors informative so the agent can recover.", "Log every step; you will need the trace to debug."]}, {"t": "incident", "title": "The runaway loop", "setup": "An agent was told to fix a failing test and could run shell commands and edit files.", "what": "It retried the same failing approach for hours, burning tokens, then deleted a directory to 'start clean'.", "why": "No turn or budget limit, no approval on destructive commands, and the tool errors gave no new information.", "watch": "Always cap iterations, require approval for deletes, and return actionable errors."}, {"t": "quiz", "q": "Subtasks cannot be known until the input is read. Which pattern fits?", "options": ["Prompt chaining", "Routing", "Orchestrator-workers", "Parallel voting"], "answer": 2, "why": "A lead model plans and delegates dynamically."}, {"t": "quiz", "q": "What is the best protection against a runaway agent?", "options": ["A bigger context window.", "Turn and budget limits plus approval for risky actions.", "Lower temperature.", "Streaming."], "answer": 1, "why": "Limits and human approval bound the damage."}]}, {"id": "m2-memory-mm", "title": "Memory, Skills, multimodal", "minutes": 10, "groups": ["memory", "multimodal"], "blocks": [{"t": "tabs", "items": [{"title": "Memory", "body": [{"t": "p", "x": "The model is stateless, so memory is something you build: store durable facts outside the window (files, a database, a memory tool) and load only what is relevant for the current task."}, {"t": "ul", "items": ["**Short-term:** the current conversation in the window.", "**Long-term:** external storage, retrieved on demand.", "Keep memory small and curated; stale or wrong memories mislead.", "Treat stored memory as untrusted if users or tools can write to it."]}]}, {"title": "Skills", "body": [{"t": "p", "x": "A **Skill** is a folder with instructions (a `SKILL.md`) and optional scripts or resources. Claude sees only the short name and description up front and loads the full content **when relevant**, which is called progressive disclosure. This keeps the context lean while making expertise reusable."}]}, {"title": "Images and PDFs", "body": [{"t": "ul", "items": ["Images and PDFs go in `content` blocks, by base64 or URL, or via the Files API for reuse.", "Put the image or document **before** your question.", "Images and pages cost tokens; very large or many images count against limits.", "For repeated documents, upload once with the Files API and reference the ID."]}]}]}, {"t": "quiz", "q": "Why do Skills keep context small?", "options": ["They compress files.", "Only name and description load at first; full content loads when needed.", "They disable tools.", "They run offline."], "answer": 1, "why": "Progressive disclosure."}]}, {"id": "m2-debug", "title": "Debug task and module 2 recap", "minutes": 10, "groups": [], "blocks": [{"t": "h", "x": "Practice: find the failure"}, {"t": "p", "x": "For each symptom, name the most likely cause before opening the answer."}, {"t": "flip", "items": [{"front": "JSON parse fails on about 2% of replies", "back": "Truncation by max_tokens, or reliance on instructions for format. Fix: check stop_reason and use structured outputs."}, {"front": "400 error after adding temperature=0.2", "back": "Newest models reject non-default sampling parameters. Remove them and steer through prompting."}, {"front": "Cache never hits", "back": "A changing element (timestamp, id) sits before the cache breakpoint."}, {"front": "Tool loop never ends", "back": "No iteration cap, or tool errors that give the model nothing new to try."}, {"front": "Output cut mid-answer in a long session", "back": "Context ceiling or max_tokens; trim history and check stop_reason."}, {"front": "Streamed tool input fails to parse", "back": "Parsing partial_json fragments before the block stops. Concatenate until content_block_stop."}]}, {"t": "h", "x": "Takeaways"}, {"t": "ul", "items": ["Stateless API: you own history. Read `stop_reason` every time.", "Format guaranteed by schema, not by pleading.", "Claude requests tools, your code executes them.", "Cache stable prefixes; batch offline work; stream for UX.", "Agents need limits, least privilege and human approval for risky steps."]}, {"t": "terms", "items": [{"term": "stop_reason", "d": "Why generation ended; drives your control flow."}, {"term": "tool_use / tool_result", "d": "Claude's request to run a tool and your reply with the outcome."}, {"term": "cache_control", "d": "Marker for a cacheable prefix."}, {"term": "MCP", "d": "Open protocol exposing tools, resources and prompts from servers."}, {"term": "Skill", "d": "Folder of instructions and resources loaded on demand."}, {"term": "Orchestrator-workers", "d": "A lead model delegates subtasks to worker calls."}]}]}]}, {"id": "m3", "title": "Module 3 · Claude Code", "minutes": 36, "blurb": "Permission modes, settings, CLAUDE.md, rules, hooks, subagents, plugins, MCP servers, auth and enterprise controls.", "intro": "Claude Code is an agentic coding tool in your terminal and IDE. This module covers how to configure and govern it. It is a small share of the exam, so learn the shape and the precedence rules.", "lessons": [{"id": "m3-config", "title": "Permissions, settings and CLAUDE.md", "minutes": 14, "groups": ["claude-code"], "blocks": [{"t": "tabs", "items": [{"title": "Permission modes", "body": [{"t": "p", "x": "The mode decides how much Claude does without asking."}, {"t": "table", "head": ["Mode", "Behavior"], "rows": [["Default", "Asks before edits and commands"], ["Accept edits", "Edits files freely, still asks for commands"], ["Plan", "Read-only: explores and proposes a plan, changes nothing"], ["Bypass", "Skips prompts; only for isolated sandboxes"]]}, {"t": "callout", "kind": "watch", "title": "Bypass is dangerous", "body": [{"t": "p", "x": "Use it only in containers or disposable environments with no sensitive access."}]}]}, {"title": "Settings files", "body": [{"t": "p", "x": "Settings are JSON, layered by scope. More specific scopes override broader ones, and **managed (enterprise) settings win over everything**."}, {"t": "ul", "items": ["**User:** `~/.claude/settings.json`, your personal defaults.", "**Project:** `.claude/settings.json`, committed and shared with the team.", "**Local:** `.claude/settings.local.json`, personal and not committed.", "**Managed:** set by the organization; cannot be overridden."]}, {"t": "p", "x": "Permission rules use `allow`, `ask` and `deny` lists; **deny takes priority**."}]}, {"title": "CLAUDE.md", "body": [{"t": "p", "x": "`CLAUDE.md` is a markdown file loaded into context at the start of every session: build commands, conventions, architecture notes. Locations stack: user-level, project root, and subdirectories (loaded when Claude works there)."}, {"t": "ul", "items": ["Keep it **short and specific**; it costs tokens every session.", "Use it for guidance Claude should follow, not for enforcement; use hooks or permissions for guarantees.", "`@path` imports pull in other files."]}]}, {"title": "Rules", "body": [{"t": "p", "x": "Rule files under `.claude/rules/` let you split instructions by topic, and scope them to **file paths** so they load only when matching files are involved. This keeps context small in large repos."}]}]}, {"t": "quiz", "q": "Which setting scope cannot be overridden by a developer?", "options": ["User", "Project", "Local", "Managed"], "answer": 3, "why": "Managed settings come from the organization and take precedence."}, {"t": "quiz", "q": "You need a guarantee that Claude never reads `.env`. What is the right tool?", "options": ["A line in CLAUDE.md", "A deny permission rule", "A longer prompt", "Plan mode"], "answer": 1, "why": "CLAUDE.md is guidance; permission rules are enforced."}]}, {"id": "m3-extend", "title": "Hooks, subagents, plugins and MCP servers", "minutes": 14, "groups": ["m3-extend"], "blocks": [{"t": "tabs", "items": [{"title": "Hooks", "body": [{"t": "p", "x": "Hooks are commands the **harness** runs at lifecycle events, so they are deterministic and not up to the model. Examples of events: before a tool runs (`PreToolUse`), after (`PostToolUse`), when a prompt is submitted, at session start, when Claude stops."}, {"t": "ul", "items": ["A `PreToolUse` hook can **block** an action (exit code 2) and tell Claude why.", "Typical uses: auto-format after edits, block dangerous commands, run tests, log activity.", "Configured in settings JSON with a matcher for which tools they apply to."]}, {"t": "callout", "kind": "key", "title": "Hook vs CLAUDE.md", "body": [{"t": "p", "x": "CLAUDE.md asks nicely. A hook guarantees."}]}]}, {"title": "Subagents", "body": [{"t": "p", "x": "A subagent is a specialized assistant defined in a markdown file, with its own system prompt, tool restrictions and **separate context window**. The main session delegates a task and gets back only the result."}, {"t": "ul", "items": ["Keeps noisy exploration out of the main context.", "Can have a restricted tool set (e.g. read-only reviewer).", "Can run in parallel on independent work."]}]}, {"title": "Plugins", "body": [{"t": "p", "x": "A plugin bundles commands, subagents, hooks, skills and MCP configuration into one installable, shareable package, distributed through a marketplace. It is the way to give a whole team the same setup."}]}, {"title": "MCP in Claude Code", "body": [{"t": "ul", "items": ["Add servers with scopes: local, project (shared via `.mcp.json`) or user.", "Transports: stdio for local processes; HTTP for remote servers.", "Remote servers may need OAuth.", "Tool names appear as `mcp__server__tool`, which you can use in permission rules.", "Tool definitions use context; many servers can crowd the window."]}]}]}, {"t": "trio", "good": "Hooks for rules that must always hold; subagents for isolated focused work.", "cost": "Every always-loaded instruction and MCP tool definition spends context.", "other": "One-off exploration: just ask in the main session."}, {"t": "quiz", "q": "You want tests to run automatically after every edit, without fail. Use:", "options": ["A CLAUDE.md note", "A PostToolUse hook", "A subagent", "Plan mode"], "answer": 1, "why": "Hooks run deterministically on events."}, {"t": "quiz", "q": "Why delegate a big codebase search to a subagent?", "options": ["It is cheaper per token.", "Its context is separate, so only the conclusion returns to the main window.", "It skips permissions.", "It works offline."], "answer": 1, "why": "Context isolation."}]}, {"id": "m3-auth", "title": "Authentication, enterprise and recap", "minutes": 8, "groups": [], "blocks": [{"t": "ul", "items": ["Sign in with a Claude subscription or Console account, or use an **API key**; enterprises can route through cloud platforms such as Bedrock or Vertex with their own credentials.", "Organizations distribute **managed settings** for permissions, hooks, MCP allowlists and model choices.", "Non-interactive use (`claude -p`) fits CI and scripts; limit its permissions explicitly there.", "Never commit API keys; prefer environment variables or a secrets manager."]}, {"t": "h", "x": "Takeaways"}, {"t": "flip", "items": [{"front": "Guidance vs guarantee", "back": "CLAUDE.md guides; hooks and permissions enforce."}, {"front": "Precedence", "back": "Managed beats user, project and local settings; deny beats allow."}, {"front": "Context cost", "back": "Instructions, rules and MCP tools all occupy the window; scope them."}, {"front": "Isolation", "back": "Subagents give clean context windows."}]}, {"t": "terms", "items": [{"term": "Plan mode", "d": "Read-only mode where Claude proposes without changing anything."}, {"term": "Hook", "d": "A harness-run command bound to a lifecycle event."}, {"term": "Subagent", "d": "A delegated assistant with its own context and tools."}, {"term": "Plugin", "d": "A shareable bundle of commands, agents, hooks and skills."}, {"term": "Managed settings", "d": "Organization-enforced configuration."}]}]}]}, {"id": "m4", "title": "Module 4 · Production engineering", "minutes": 57, "blurb": "Evals, testing and tracing, failure handling, model selection, cost and orchestration, security.", "intro": "Shipping is different from prototyping: you need to measure quality, survive failures, control cost and defend against attacks.", "lessons": [{"id": "m4-evals", "title": "Evals, testing and debugging", "minutes": 14, "groups": ["evals"], "blocks": [{"t": "p", "x": "Because output is non-deterministic, 'it worked once' proves nothing. An **eval** is a fixed set of test cases with a way to score the results."}, {"t": "tabs", "items": [{"title": "Building an eval", "body": [{"t": "steps", "items": [{"title": "Collect cases", "body": "Start with real inputs, including edge cases and past failures."}, {"title": "Define success", "body": "Write criteria you can score: exact fields, ranges, or rubric items."}, {"title": "Pick a grader", "body": "Code checks for structure and exact facts; a model-graded judge for meaning, tone or quality; humans to calibrate."}, {"title": "Run, change one thing, rerun", "body": "Compare scores across prompt, model or parameter changes."}, {"title": "Keep it as a regression suite", "body": "Every fixed bug becomes a new case."}]}]}, {"title": "LLM-as-judge", "body": [{"t": "ul", "items": ["Give the judge a clear rubric and ask for reasoning before the verdict.", "Prefer a fixed scale or pass/fail over vague scores.", "Check the judge against human labels; judges have biases such as favoring longer answers.", "Use a different, or at least well-prompted, model to grade."]}]}, {"title": "Test levels and tracing", "body": [{"t": "ul", "items": ["**Unit:** test your own code (parsers, tool functions) normally.", "**Component:** one prompt on a case set.", "**End-to-end:** the whole agent on realistic tasks.", "**Tracing:** record every prompt, tool call and result so you can see where a run went wrong."]}, {"t": "callout", "kind": "tip", "title": "Debug from the trace", "body": [{"t": "p", "x": "Find the first step where reality diverged from intent. Later errors are usually consequences."}]}]}]}, {"t": "quiz", "q": "Which grader fits judging whether a summary captures the key points?", "options": ["Exact string match", "A model-graded judge with a rubric", "Regex", "Token count"], "answer": 1, "why": "Meaning needs a judge; structure needs code."}, {"t": "quiz", "q": "A prompt change improved the one example you tried. What is the sound next step?", "options": ["Ship it.", "Run it against the full eval set and compare.", "Raise temperature.", "Add examples."], "answer": 1, "why": "One case proves little because of non-determinism."}]}, {"id": "m4-fail-model", "title": "Failures, retries and model selection", "minutes": 12, "groups": ["m4-fail-model"], "blocks": [{"t": "tabs", "items": [{"title": "Failure handling", "body": [{"t": "ul", "items": ["Retry **429, 500 and 529** with exponential backoff and jitter; respect `retry-after`.", "Do **not** retry 400, 401, 403: they will fail again.", "Make operations **idempotent**, so a retry does not repeat a side effect such as sending an email twice.", "Set timeouts and fall back gracefully (cached answer, smaller model, clear message).", "Validate model output before acting on it."]}]}, {"title": "Choosing a model", "body": [{"t": "steps", "items": [{"title": "Define the quality bar with an eval", "body": "Without a measurement you are guessing."}, {"title": "Start with the balanced default", "body": "Sonnet is the usual starting point."}, {"title": "Move down if quality holds", "body": "Haiku for classification, extraction and routing when the eval passes."}, {"title": "Move up only if it fails", "body": "Opus or Fable for the hardest reasoning and agentic work."}, {"title": "Re-check periodically", "body": "New models change the trade-off."}]}]}]}, {"t": "quiz", "q": "Which failure should NOT be retried automatically?", "options": ["429", "529", "400 invalid request", "500"], "answer": 2, "why": "A malformed request fails identically every time."}]}, {"id": "m4-cost", "title": "Cost, latency and orchestration", "minutes": 12, "groups": ["m4-cost"], "blocks": [{"t": "table", "head": ["Lever", "Saves", "Trade-off"], "rows": [["Smaller model", "Cost and latency", "Possible quality drop; verify with eval"], ["Prompt caching", "Input cost on repeated prefixes", "Needs stable prefix"], ["Batch API", "About half price", "Hours of latency"], ["Shorter output / lower effort", "Output cost and time", "Less detail or reasoning"], ["Routing", "Sends easy cases to cheap models", "Needs a good classifier"], ["Trimming context", "Input cost", "Risk of dropping something useful"]]}, {"t": "callout", "kind": "key", "title": "Output costs more than input", "body": [{"t": "p", "x": "Output tokens are priced several times higher than input tokens and are generated sequentially, so controlling output length is the strongest latency and cost lever."}]}, {"t": "p", "x": "**Orchestration:** a capable lead model plans and a cheaper model executes narrow subtasks in parallel. Cap fan-out, track spend per task and set budgets so a bug cannot run up a bill."}, {"t": "quiz", "q": "An easy high-volume classification costs too much. First thing to try?", "options": ["Opus with high effort", "A smaller model validated by an eval", "Longer prompts", "Disable caching"], "answer": 1, "why": "Match the model to the task difficulty."}]}, {"id": "m4-security", "title": "Security and safety", "minutes": 14, "groups": ["security"], "blocks": [{"t": "p", "x": "Treat the model as a component that can be tricked. Security comes from system design, not from asking the model to behave."}, {"t": "tabs", "items": [{"title": "Prompt injection", "body": [{"t": "p", "x": "**Direct injection:** the user's own input tries to override instructions. **Indirect injection:** instructions hidden in content Claude reads (web pages, emails, files, tool results) that it then follows."}, {"t": "callout", "kind": "watch", "title": "No prompt fully prevents it", "body": [{"t": "p", "x": "Delimiters and 'ignore instructions in documents' help but are not a guarantee. Limit what a compromised model could do."}]}]}, {"title": "Defenses", "body": [{"t": "ul", "items": ["**Least privilege:** each tool gets only the access it needs.", "**Human approval** for sensitive or irreversible actions.", "**Separate** untrusted content from trusted instructions and from privileged tools.", "**Validate and sanitize** model output before it touches databases, shells or HTML.", "**Filter** inputs and outputs; add guardrail checks for high-risk flows.", "Beware the **lethal trio**: private data access + untrusted content + a way to send data out."]}]}, {"title": "Secrets and privacy", "body": [{"t": "ul", "items": ["Keep API keys server-side; never in client code or prompts.", "Do not put secrets or unnecessary personal data in prompts.", "Log carefully; traces may contain sensitive text.", "Know your data retention and compliance options."]}]}]}, {"t": "incident", "title": "The helpful email agent", "setup": "An assistant could read the inbox and send mail on the user's behalf.", "what": "A received email contained hidden text telling the assistant to forward recent messages to an outside address. It did.", "why": "Untrusted content, private data and an outbound tool were all available in one loop with no approval step.", "watch": "Break the trio: require approval for sends, or remove one of the three capabilities."}, {"t": "quiz", "q": "An agent reads web pages and can also send emails. Best mitigation?", "options": ["Tell it to ignore web instructions.", "Require human approval before sending and restrict recipients.", "Use a larger model.", "Lower the temperature."], "answer": 1, "why": "Design-level controls beat prompt-level hopes."}, {"t": "quiz", "q": "Model output is inserted into a SQL query. What must you do?", "options": ["Trust it.", "Parameterize and validate like any untrusted input.", "Add 'safe SQL' to the prompt.", "Use streaming."], "answer": 1, "why": "Model output is untrusted input."}]}, {"id": "m4-recap", "title": "Module 4 recap", "minutes": 5, "groups": [], "blocks": [{"t": "flip", "items": [{"front": "Measure, do not guess", "back": "Evals with code graders and judges replace one-off checks."}, {"front": "Retry the transient", "back": "429/5xx with backoff and idempotency; never 4xx client errors."}, {"front": "Right-size the model", "back": "Start with Sonnet, move by eval evidence."}, {"front": "Design for compromise", "back": "Least privilege, approvals, separation, validated outputs."}]}, {"t": "terms", "items": [{"term": "Eval", "d": "A fixed case set with scoring, used to compare changes."}, {"term": "LLM-as-judge", "d": "A model grading outputs against a rubric."}, {"term": "Idempotent", "d": "Safe to repeat without extra side effects."}, {"term": "Prompt injection", "d": "Instructions smuggled in via input or content the model reads."}, {"term": "Least privilege", "d": "Grant only the access a task needs."}]}]}]}, {"id": "m5", "title": "Module 5 · Accelerators and platforms", "minutes": 45, "blurb": "Accelerators, contribution, requirements and lifecycle, platforms and versioning, trust boundaries, cumulative task.", "intro": "How to speed up delivery with reusable assets, where Claude runs, and how to reason about who is trusted with what.", "lessons": [{"id": "m5-accel", "title": "Accelerators and contribution", "minutes": 10, "groups": ["accelerators"], "blocks": [{"t": "p", "x": "An **accelerator** is a reusable, tested starting point (a reference architecture, template, or sample integration) that shortens the path to a working solution. Reuse beats rebuilding from zero."}, {"t": "ul", "items": ["Use accelerators for common patterns: RAG, agents with tools, customer-support flows, document processing.", "Adapt them: re-run evals on **your** data; do not assume they fit as is.", "Check license, maintenance status and security before adopting.", "**Contributing back:** document what you changed, add tests and evals, strip customer data and secrets, follow the project's contribution process."]}, {"t": "trio", "good": "Faster start, proven structure, shared best practice.", "cost": "Hidden assumptions, extra code you do not need, upkeep.", "other": "Truly novel requirement: build custom, but borrow pieces."}, {"t": "quiz", "q": "You adopt a sample RAG accelerator. What must you still do?", "options": ["Nothing, it is certified.", "Evaluate it on your own data and review security.", "Rewrite it fully.", "Disable retrieval."], "answer": 1, "why": "Accelerators are starting points that need validation."}]}, {"id": "m5-lifecycle", "title": "Requirements and the delivery lifecycle", "minutes": 10, "groups": ["m5-lifecycle"], "blocks": [{"t": "steps", "items": [{"title": "Clarify requirements", "body": "Users, success criteria, constraints (latency, cost, compliance), what happens on failure."}, {"title": "Prototype", "body": "Smallest working version, to test feasibility cheaply."}, {"title": "Build evals", "body": "Turn requirements into measurable cases before scaling."}, {"title": "Harden", "body": "Error handling, security review, cost controls, monitoring."}, {"title": "Deploy gradually", "body": "Staged rollout, with the ability to roll back."}, {"title": "Monitor and iterate", "body": "Watch quality, cost and latency; feed failures back into evals."}]}, {"t": "callout", "kind": "key", "title": "Non-functional requirements matter", "body": [{"t": "p", "x": "Latency, cost per task, data residency and auditability often decide the architecture more than raw model quality."}]}, {"t": "quiz", "q": "Which step should come before scaling a prototype?", "options": ["Marketing", "An eval that encodes the requirements", "A bigger model", "Disabling logs"], "answer": 1, "why": "Measurable criteria guide every later decision."}]}, {"id": "m5-platforms", "title": "Platforms, versioning and trust boundaries", "minutes": 14, "groups": ["models", "limits"], "blocks": [{"t": "tabs", "items": [{"title": "Where Claude runs", "body": [{"t": "table", "head": ["Platform", "Notes"], "rows": [["Claude API (first party)", "Newest features first; direct billing"], ["Amazon Bedrock", "AWS identity, networking, billing; feature set can lag"], ["Google Vertex AI", "Google Cloud integration; feature set can lag"], ["Microsoft Foundry", "Azure integration; verify supported features"]]}, {"t": "p", "x": "Choose by existing cloud commitments, compliance and data residency, then **verify that the features you need** (for example a given beta or tool) exist on that platform."}]}, {"title": "Versioning", "body": [{"t": "ul", "items": ["Pin **exact model IDs** in production; aliases may move to newer models.", "Models are **deprecated and retired** on a published schedule; plan migrations and re-run evals.", "New model versions can change behavior and parameter support, so never swap blindly.", "Use the API version header and SDK versions deliberately."]}]}, {"title": "Trust boundaries", "body": [{"t": "p", "x": "A trust boundary is where data or control passes between parties with different levels of trust."}, {"t": "table", "head": ["Source", "Trust level", "Treat as"], "rows": [["Your system prompt", "High", "Instructions"], ["The authenticated user's request", "Medium", "Request, not authority to bypass policy"], ["Documents, web pages, emails", "Low", "Data only"], ["Third-party tool/MCP output", "Low", "Data only, may carry injection"], ["Model output", "Untrusted until validated", "Input to validate"]]}]}]}, {"t": "quiz", "q": "Why pin an exact model ID in production?", "options": ["It is cheaper.", "Aliases can move to a newer model whose behavior differs.", "It disables retries.", "It speeds up caching."], "answer": 1, "why": "Pinning gives predictable behavior until you deliberately migrate."}, {"t": "quiz", "q": "A tool result from a third-party server contains imperative text. How should the system treat it?", "options": ["As trusted instructions.", "As untrusted data.", "As the system prompt.", "As a user message with authority."], "answer": 1, "why": "Third-party content crosses a trust boundary."}]}, {"id": "m5-capstone", "title": "Cumulative task and final recap", "minutes": 11, "groups": [], "blocks": [{"t": "h", "x": "Capstone: design a support agent"}, {"t": "p", "x": "Scenario: a company wants an agent that answers billing questions, can look up accounts and can issue refunds. Walk through the design before opening each answer."}, {"t": "flip", "items": [{"front": "Which pattern?", "back": "Routing to a billing path, then an agent with lookup and refund tools; a plain workflow if the steps are fixed."}, {"front": "Which model?", "back": "Start with Sonnet; use a small model for routing; validate by eval."}, {"front": "Tools?", "back": "get_account (read), issue_refund (write) with clear schemas and descriptions."}, {"front": "Safety?", "back": "Least privilege per tool, refund cap, human approval above a threshold, validated inputs, audit log."}, {"front": "Cost?", "back": "Cache the policy prompt, trim history, cap turns and output length."}, {"front": "Quality?", "back": "Eval with real past tickets, judge for tone, code checks for refund amounts; trace every run."}, {"front": "Failures?", "back": "Backoff on 429/5xx, idempotent refunds, graceful fallback to a human."}, {"front": "Trust?", "back": "Customer messages and attached documents are data; never let them authorize refunds."}]}, {"t": "h", "x": "Final takeaways"}, {"t": "ul", "items": ["Choose the simplest design that meets the requirement, then prove it with evals.", "You own state, limits, retries and validation; the model supplies judgment.", "Security is architecture: least privilege, approvals, separation.", "Pin versions and re-evaluate when models change."]}, {"t": "terms", "items": [{"term": "Accelerator", "d": "A reusable starting point that shortens delivery."}, {"term": "Trust boundary", "d": "A point where data crosses between differently trusted parties."}, {"term": "Pinning", "d": "Using an exact model or SDK version rather than a moving alias."}, {"term": "Non-functional requirement", "d": "A constraint such as latency, cost or compliance."}]}]}]}, {"id": "rev", "title": "Quick revision notes", "minutes": 60, "blurb": "Condensed notes by exam topic, for the last pass before the exam.", "intro": "Short, dense notes grouped by topic. Use after the full lessons.", "lessons": [{"id": "r-api", "title": "Messages API basics", "minutes": 3, "groups": ["api"], "blocks": [{"t": "h", "x": "Messages API: the basics"}, {"t": "html", "x": "<p><b>What the API is<\/b><\/p>\n<ul><li>One endpoint for chat and agents: <code>POST /v1/messages<\/code>. Required fields: <code>model<\/code>, <code>max_tokens<\/code>, <code>messages<\/code><\/li><li>The API is <b>stateless<\/b>: Claude remembers nothing between calls. Your code sends the full conversation every time and decides what history to keep<\/li><li><code>system<\/code> is a top-level parameter, not a message. Messages only have the roles <code>user<\/code> and <code>assistant<\/code><\/li><li>The response has <code>content<\/code> (a list of blocks: text, tool_use, thinking...), <code>stop_reason<\/code> and <code>usage<\/code> (input and output tokens, cache fields)<\/li><li><code>max_tokens<\/code> caps the <b>output<\/b> only. It is a ceiling, not a target, and a response cut by it is incomplete<\/li><li>SDKs (Python, TypeScript and others) add typed objects, retries with backoff for 429 and 5xx, streaming helpers and timeouts. Raw REST gives you full control but you write all of it yourself<\/li><\/ul>\n<p><b>Tokens and context<\/b><\/p>\n<ul><li>A token is a piece of text, not a character or a word. The characters-per-token ratio depends on the model's tokenizer and changes between model generations, so treat any ratio as model-dependent and count tokens. Input and output are billed per million tokens, output costs more than input<\/li><li>The <b>context window<\/b> is a fixed budget that holds the system prompt, tools, history, your new input and the output. All current models have a 1M-token window and up to 128K output tokens<\/li><li>Counting tokens before sending: use the token counting endpoint, do not guess from characters<\/li><li>Sampling is probabilistic: at each step the model builds a probability distribution over next tokens and samples from it. <code>temperature<\/code> lowers or raises randomness, but even at 0 answers can vary, so never rely on exact repeatability<\/li><li><b>The newest Claude models do not accept non-default sampling parameters<\/b>: setting <code>temperature<\/code>, <code>top_p<\/code> or <code>top_k<\/code> returns a 400 error, and behavior is steered through prompting instead. Confirm parameter support in the API reference at build time<\/li><li><b>Non-determinism changes testing<\/b>: do not assert exact text. Assert properties that must hold (a field is present, a value is in range, the structure parses) and use an eval with a model-graded judge when meaning matters<\/li><\/ul>\n<p><b>Roles and prefill<\/b><\/p>\n<ul><li>Consecutive messages with the same role are merged. The first message must be from the user<\/li><li>Putting text into the last assistant message used to steer the start of a reply (prefill). Newer models may reject it. Prefer structured outputs or clear instructions<\/li><\/ul>"}]}, {"id": "r-stop", "title": "Stop reasons and errors", "minutes": 3, "groups": ["stop"], "blocks": [{"t": "h", "x": "Stop reasons and error handling"}, {"t": "html", "x": "<p><b>stop_reason: what to do for each value<\/b><\/p>\n<ul><li><code>end_turn<\/code>: Claude finished. Use the answer<\/li><li><code>max_tokens<\/code>: hit your limit. The answer is cut. Raise the limit or ask Claude to continue. If the last block is a half-written <code>tool_use<\/code>, retry with a higher limit<\/li><li><code>stop_sequence<\/code>: one of your <code>stop_sequences<\/code> appeared. Read <code>response.stop_sequence<\/code> to see which<\/li><li><code>tool_use<\/code>: run each requested client tool and send back <code>tool_result<\/code> blocks in the next user message<\/li><li><code>pause_turn<\/code>: a server-side tool loop hit its iteration limit (default 10). Append the assistant response unchanged and call again<\/li><li><code>refusal<\/code>: Claude declined. It is an HTTP 200 and is billed. Rephrase or fall back to another model, do not retry blindly<\/li><li><code>model_context_window_exceeded<\/code>: the window filled before <code>max_tokens<\/code>. Treat the output as truncated<\/li><\/ul>\n<p><b>HTTP errors<\/b><\/p>\n<ul><li>400 invalid request (bad schema, bad parameter): fix the request, retrying will not help<\/li><li>401 bad API key, 403 no permission, 404 unknown resource or model<\/li><li>413 request too large, 429 rate limit (or per-key spending limit), 500 server error, 529 API overloaded<\/li><li>Retry 429, 500 and 529 with <b>exponential backoff and jitter<\/b>, honour the <code>retry-after<\/code> header, use idempotent logic. Never retry 400 or 401 in a loop<\/li><li>Rate limits are measured in requests, input tokens and output tokens per minute and grow with usage tiers. Cached input tokens often do not count against input limits, so caching also raises effective throughput<\/li><li>Every response carries a <code>request-id<\/code>. Log it, support needs it<\/li><\/ul>"}, {"t": "h", "x": "Module 4: surviving production failures"}, {"t": "html", "x": "<p><b>The one question: retriable or terminal?<\/b><\/p>\n<ul><li>Would waiting and repeating the exact same request plausibly work? If yes it is retriable, if not it is terminal<\/li><li>Retriable: <b>429<\/b> rate limit, <b>529<\/b> overloaded, and 5xx server faults (500, 502, 503, 504). Terminal: <b>400<\/b> bad request, <b>401<\/b> auth, <b>403<\/b> permission, <b>404<\/b> missing<\/li><li>Timeouts are usually retriable, but repeated timeouts on an expensive request mean fix the request. When unsure, treat as terminal and raise: a wrongly terminal failure fails loudly and gets fixed, a wrongly retriable one hammers a service and hides the real problem<\/li><\/ul>\n<p><b>Retry design<\/b><\/p>\n<ul><li>Use <b>exponential backoff with jitter and a cap<\/b>. An instant retry loop counts as more requests against the same limit and deepens it<\/li><li>Honor the <code>retry-after<\/code> header when a 429 or 529 includes it (authoritative), and fall back to your own backoff when it is absent<\/li><li>The SDKs already retry transient failures with progressive delays. Do not wrap a second retry loop around the same call, because two loops multiply attempts. Either let the SDK handle transient cases and write only application-specific fallbacks, or turn SDK retries down and own the whole path<\/li><li>Incident: a loop with no error path, then an immediate-retry loop. The broken pattern is <code>except Exception: time.sleep(0)<\/code>. The first rate-limit response took the request down. Fix: classify, back off with a cap, honor retry-after, raise cleanly when the budget is exhausted<\/li><\/ul>\n<p><b>Refusals and tool errors<\/b><\/p>\n<ul><li>A <b>refusal<\/b> is an HTTP 200 with <code>stop_reason: \"refusal\"<\/code>, so a status-code classifier will not catch it. Fail fast: no retry, raise or log it. It is a content decision, not a transient error<\/li><li>A failed tool must come back with <code>is_error: true<\/code> and a message, never as a silent empty result. An empty result looks like valid data, and the model reasons on a false premise<\/li><li>A stream that breaks mid-response is a transient failure: retry the whole request, do not pass partial output downstream<\/li><\/ul>\n<p><b>Decision table<\/b><\/p>\n<ul><li>429: retriable, backoff with jitter, honor retry-after, capped, then a clean error or cached or simpler fallback<\/li><li>529: retriable, backoff, Anthropic-side load (not a rate-limit signal), fail over or degrade gracefully<\/li><li>400: fail fast, fix or reject the input<\/li><li>Tool error: depends on the cause, retry only if transient, always return the error flag<\/li><li>Refusal: fail fast, raise and log<\/li><\/ul>"}]}, {"id": "r-stream", "title": "Streaming and limits", "minutes": 3, "groups": ["stream"], "blocks": [{"t": "h", "x": "Streaming, timeouts and long outputs"}, {"t": "html", "x": "<p><b>Streaming<\/b><\/p>\n<ul><li>Set <code>stream: true<\/code> to receive server-sent events as tokens are generated. Time to first token drops, the user sees progress<\/li><li>Event order: <code>message_start<\/code>, then per block <code>content_block_start<\/code>, many <code>content_block_delta<\/code>, <code>content_block_stop<\/code>, then <code>message_delta<\/code> (carries the stop_reason and final usage) and <code>message_stop<\/code><\/li><li>Tool input arrives as <code>input_json_delta<\/code> fragments. They are <b>partial JSON<\/b>: accumulate them and parse only after <code>content_block_stop<\/code><\/li><li>Streaming is strongly recommended for long outputs: non-streaming requests that run very long risk network timeouts. The SDKs require streaming (or a long-request helper) when max_tokens is large<\/li><li>Errors can arrive mid-stream after a 200 status, so handle an <code>erro
