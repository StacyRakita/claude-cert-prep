d. D — reactive and costly."}, {"id": 996163873, "d": "eval", "t": "evals", "q": "An LLM-as-judge grader is used to score answers. Which practice makes it more trustworthy?", "o": ["Ask one open question such as is this answer good, and use the reply as the score", "Use the very same prompt for the generation step and for the grading step", "Trust the grader without any checks, since it is a language model as well", "Use a specific rubric, judge one dimension at a time, and check against human labels"], "a": 3, "e": "A judge needs <b>clear criteria<\/b> and calibration with human judgments.", "w": "A — vague criteria give noisy scores. B — the same model can favor its own style. C — unvalidated graders drift."}, {"id": 1050732658, "d": "eval", "t": "evals", "q": "Production quality dropped after a model update. What is the best debugging approach?", "o": ["Increase the temperature and wait for a while to see whether quality returns", "Disable the logging to reduce the noise in the monitoring dashboards of the team", "Rewrite all of the prompts in the system at once and ship them together", "Trace the failures, reproduce the input, change one variable, compare on evals"], "a": 3, "e": "Traces with prompts, tool calls, stop reasons and tokens reveal the cause. Change <b>one variable<\/b> at a time.", "w": "A — random changes. C — hides the cause. B — removes the evidence you need."}, {"id": 249479906, "d": "eval", "t": "evals", "q": "Unit tests for application code that calls Claude should avoid asserting on exact response text because:", "o": ["The API forbids exact comparisons of the text that it returns to a client", "Outputs vary between calls, so tests should check structure, or mock the API", "Test frameworks are not able to read JSON from an API response at all", "Claude always returns exactly the same text for exactly the same prompt"], "a": 1, "e": "Assert on <b>schema, required content and rules<\/b>. Use mocks for unit tests and real calls in a smaller eval suite.", "w": "A — there is no such rule. D — not guaranteed. C — tests can parse JSON."}, {"id": 1186974916, "d": "app", "t": "api", "q": "A team wants to avoid unexpected behavior changes when Anthropic releases a new model. What should the production code do?", "o": ["Omit the model so the API picks the best one", "Let users choose the model in their browser", "Pin an explicit model ID and upgrade after evals", "Always call the newest model automatically"], "a": 2, "e": "Explicit IDs are stable snapshots. Move to a new model only after your evals show it is at least as good.", "w": "D — a surprise change in tone, format or cost can break the product. A — model is a required parameter. B — users should not control a production model choice."}, {"id": 2369264136, "d": "app", "t": "api", "q": "The API request header anthropic-version is used to:", "o": ["Pins the version of a stored system prompt", "Declares the installed SDK version", "Chooses which model snapshot answers", "Selects the version of the API contract"], "a": 3, "e": "The header pins the <b>API version<\/b> (request and response format). The model is chosen by the model parameter.", "w": "C — that is the model field. B — SDKs set the version for you but the header is not about the SDK. A — the API stores no prompts."}, {"id": 3768081357, "d": "app", "t": "api", "q": "An application sends an image to Claude together with a question. How is the image provided in the Messages API?", "o": ["A long encoded string in the system prompt", "A separate endpoint called before the request", "A metadata field attached to the request", "An image content block in the user message"], "a": 3, "e": "Images are <b>content blocks<\/b> in the user message, next to text blocks. Image tokens count toward input.", "w": "B — there is no separate upload step required for basic image input. A — the system prompt is text instructions, not a data channel for images. C — metadata is not read by the model."}, {"id": 2775341311, "d": "app", "t": "api", "q": "A developer needs Claude to answer questions about a long PDF and show which passages support each claim. Which capability fits best?", "o": ["Splitting the PDF into single words", "A higher temperature to explore the text", "A system prompt asking for accuracy", "Document input with citations enabled"], "a": 3, "e": "<b>Citations<\/b> return structured references to the exact passages of the provided documents.", "w": "C — a request for accuracy gives no verifiable sources. B — randomness does not improve grounding. A — destroys the meaning of the text."}, {"id": 513111118, "d": "app", "t": "api", "q": "What is the purpose of stop_sequences in a request?", "o": ["They list words Claude may never use", "Claude stops when it would emit one of them", "They define the order of tool calls", "They cap the number of conversation turns"], "a": 1, "e": "When one of the strings appears, generation stops and <code>stop_reason<\/code> is <code>stop_sequence<\/code>.", "w": "A — they stop output, they are not a banned-word filter. C — tool order is not configured this way. D — turns are counted by your application."}, {"id": 1728868243, "d": "app", "t": "api", "q": "A chatbot should answer in the user's language without the developer detecting it. Which approach is simplest and reliable?", "o": ["Translate every message to English and back", "Refuse messages that are not in English", "Run language detection and one prompt per language", "Tell Claude in the system prompt to match the user"], "a": 3, "e": "Claude is multilingual. A clear instruction in the system prompt is enough for most cases.", "w": "C — extra moving parts without need. A — adds cost, latency and translation errors. B — poor product behavior."}, {"id": 3824735593, "d": "app", "t": "api", "q": "Why does the usage object matter for an application that serves many customers?", "o": ["It lists the tools the model considered", "It names the data centre that handled the call", "It tracks input, output and cache tokens per call", "It shows Claude's own quality score for the answer"], "a": 2, "e": "Log <code>usage<\/code> with a customer id to build cost reports, budgets and alerts.", "w": "D — no such score exists. A — considered tools are not reported. B — usage reports token counts."}, {"id": 583295366, "d": "app", "t": "api", "q": "A developer calls the API from a script and it sometimes fails with connection errors. Which SDK behavior helps without extra code?", "o": ["Automatic retries with backoff on transient errors", "Automatic switch to a cheaper model on failure", "Automatic rewriting of the prompt until it works", "Automatic replay cache for every failed call"], "a": 0, "e": "Official SDKs retry transient failures a few times by default and let you configure retries and timeouts.", "w": "C — SDKs never change your prompt. B — never changes the model silently. D — no replay cache exists."}, {"id": 884658284, "d": "app", "t": "api", "q": "Which statement about API keys is correct?", "o": ["Keep them server-side and rotate if exposed", "Embed them in a mobile app and obfuscate", "Rotate them only when the account closes", "Share one key across all teams for auditing"], "a": 0, "e": "Keys are secrets. Separate keys and workspaces make leaks easier to contain and costs easier to attribute.", "w": "B — obfuscation does not protect a key. D — shared keys hide who did what. C — rotation is a response to risk, not to account closure."}, {"id": 1126442880, "d": "app", "t": "api", "q": "A product needs the answer in at most three sentences. What is the most dependable way to achieve this?", "o": ["Raise the temperature so replies get shorter", "State the limit and add an example", "Set max_tokens to 60 and accept cut sentences", "Add the word however as a stop sequence"], "a": 1, "e": "Clear instructions with an example control length. A hard <code>max_tokens<\/code> cuts text mid-sentence, so use it only as a safety net.", "w": "C — truncation produces broken sentences. A — temperature does not control length. D — a random word is not a length control."}, {"id": 3088413599, "d": "app", "t": "api", "q": "A developer asks Claude for a very long report and the reply ends abruptly. The response has stop_reason max_tokens. What is the best way to get the full report?", "o": ["Resend the request and join the pieces", "Lower the temperature to zero", "Raise max_tokens or ask Claude to continue", "Switch to another model name with the same limits"], "a": 2, "e": "The cut is caused by your limit. Raise it within the model's output ceiling or continue the text.", "w": "A — each reply has the same limit and different content. D — same limits give the same result. B — temperature is unrelated to length."}, {"id": 4076437419, "d": "app", "t": "stop", "q": "An integration receives HTTP 401 from the API. What is the most likely cause?", "o": ["The selected model has been retired", "The API key is missing, invalid or revoked", "The request exceeded the rate limit", "The prompt is longer than the context window"], "a": 1, "e": "401 is an <b>authentication<\/b> error. Check the key and the header.", "w": "D — a too large input gives 400 or 413. C — the rate limit gives 429. A — an unknown or retired model gives 404."}, {"id": 3332371183, "d": "app", "t": "stop", "q": "An integration receives HTTP 403 from the API for a specific resource. What does it usually mean?", "o": ["The server is overloaded, retry later", "The key lacks permission for that resource", "The monthly allowance has been used up", "The request body is invalid JSON"], "a": 1, "e": "403 means <b>permission denied<\/b>: authentication worked, authorization did not.", "w": "A — overload is 529. D — invalid JSON is 400. C — limits and spend caps are reported through 429."}, {"id": 962233105, "d": "app", "t": "stop", "q": "A batch job receives many 429 responses. Which combination is the best fix?", "o": ["Use a brand new key for every request", "Send requests faster so the limit resets sooner", "Queue the load and back off with jitter", "Disable retries so the whole job fails fast"], "a": 2, "e": "Rate limits are per organization or workspace. Smooth the load and back off instead of creating a retry storm.", "w": "B — makes the limit worse. A — circumventing limits is not valid. D — failing quickly loses work."}, {"id": 1472508218, "d": "app", "t": "stop", "q": "A response has an empty text content and stop_reason end_turn right after a tool_result. What is a sound handling?", "o": ["Raise max_tokens and send it again", "Retry until the text is not empty", "Assume the tool failed and drop the result", "Treat it as end of turn or ask to continue"], "a": 3, "e": "An empty end_turn can happen when a result already answers the question. Do not resend identical content in a loop.", "w": "B — an identical request gives the same shape. C — the tool did not fail. A — max_tokens was not the cause."}, {"id": 1946828949, "d": "app", "t": "stop", "q": "What is a safe way to design retries for a request that has side effects through tools?", "o": ["Idempotent tools or a log of completed calls", "Never retry anything, not even a 429", "Restart the whole conversation after any error", "Ask Claude to remember not to repeat actions"], "a": 0, "e": "Retries are safe only when repeating an action is harmless or tracked. Idempotency keys and a call log do that.", "w": "C — can repeat actions that were already done. D — a prompt is not a guarantee. B — transient errors should be retried with backoff."}, {"id": 2274449759, "d": "app", "t": "stop", "q": "A request returns HTTP 400 with an error message about a malformed tool schema. What should the developer do?", "o": ["Switch to streaming to skip validation", "Retry with exponential backoff", "Ask support to raise the rate limit", "Fix the input_schema and send it again"], "a": 3, "e": "400 means the request is invalid. Retrying cannot help until the request changes.", "w": "B — backoff is for transient errors. C — it is not a rate problem. A — streaming does not skip validation."}, {"id": 525595949, "d": "app", "t": "stop", "q": "How should an application use the request-id of a response?", "o": ["Treat it as proof that the answer is correct", "Send it back to continue the conversation", "Use it as the prompt cache key", "Log it so support can find that exact call"], "a": 3, "e": "The request id identifies one API call. It is for debugging, not for state.", "w": "B — the API is stateless. C — caching uses content, not ids. A — it proves nothing about correctness."}, {"id": 2843803732, "d": "app", "t": "stop", "q": "A developer sees stop_reason model_context_window_exceeded. What does it mean?", "o": ["The prompt was rejected before generation", "The window filled before max_tokens, output cut", "The model refused for a policy reason", "The batch expired before processing"], "a": 1, "e": "Generation ran until the window was full. Reduce the input or the amount of history.", "w": "A — a rejected prompt returns an error instead of a response. C — that is refusal. D — that is a batch result type."}, {"id": 3662722106, "d": "app", "t": "stream", "q": "Which transport does the streaming Messages API use?", "o": ["gRPC with a bidirectional stream", "Server-sent events over HTTP", "WebSocket connections from the client", "Long polling with repeated requests"], "a": 1, "e": "Streaming responses are delivered as <b>server-sent events<\/b>.", "w": "C — the API does not use WebSocket. A — not supported on the Messages API. D — one request is held open instead of repeated polling."}, {"id": 1261973916, "d": "app", "t": "stream", "q": "A UI shows the streamed text and the user presses Stop. What is the right behavior?", "o": ["Close the stream and keep the partial text", "Send a cancel message to the model", "Keep reading in the background anyway", "Discard the partial text and resend"], "a": 0, "e": "Closing the connection ends generation. Keep consistent history: what was shown is what the model saw.", "w": "C — wastes tokens. B — there is no such message. D — loses what was already useful."}, {"id": 2503920274, "d": "app", "t": "stream", "q": "While streaming, which delta type carries visible answer text?", "o": ["stop_delta in content_block_stop", "thinking_delta in message_start", "text_delta in content_block_delta", "input_json_delta in message_delta"], "a": 2, "e": "Text arrives as <code>text_delta<\/code> in <code>content_block_delta<\/code>. Tool input uses <code>input_json_delta<\/code>.", "w": "D — input_json_delta carries tool arguments. B — thinking_delta carries reasoning inside block deltas. A — no such event exists."}, {"id": 3049724065, "d": "app", "t": "stream", "q": "A proxy server buffers the entire streamed response before sending it to the browser. What is the effect?", "o": ["Users see nothing until the end", "The API charges less for the call", "The answer becomes more accurate", "The model generates tokens faster"], "a": 0, "e": "Streaming helps only if every hop forwards chunks immediately. Disable proxy buffering for the stream route.", "w": "C — accuracy is unchanged. B — pricing is the same. D — generation speed is unchanged."}, {"id": 3030339858, "d": "app", "t": "structured", "q": "When is a JSON schema with structured outputs the better choice than a tool with strict: true?", "o": ["When the final answer must have a defined shape", "When the app needs web search results", "When Claude should decide whether to call a function", "When the reply must be streamed token by token"], "a": 0, "e": "JSON outputs shape the <b>answer<\/b>. Strict tools shape the <b>function call<\/b> inputs.", "w": "C — that is tool use. B — web search is a server tool. D — streaming works with both."}, {"id": 2827105677, "d": "app", "t": "structured", "q": "A model sometimes returns an enum value with different capitalization than the schema. What is the best way to handle it?", "o": ["Raise the temperature to vary the casing", "Remove the enum and accept any string", "Compare case-insensitively in your code", "Retry until the capitalization matches"], "a": 2, "e": "Casing may differ. Normalize on your side and design enum values that stay distinct without case.", "w": "D — wastes tokens. B — loses the benefit of the schema. A — temperature has no role here."}, {"id": 2800992964, "d": "app", "t": "structured", "q": "A schema is rejected with an error that it is too complex. Which change is most likely to help?", "o": ["Flatten nesting and make parameters required", "Turn off streaming for the request", "Increase max_tokens", "Add more optional parameters for freedom"], "a": 0, "e": "Complexity is limited (strict tools, optional parameters, union types). Simplify the schema.", "w": "D — optional parameters add to the limit. B — streaming is unrelated. C — max_tokens is unrelated."}, {"id": 1435075331, "d": "app", "t": "structured", "q": "Why should an application still validate business rules after a schema-valid response?", "o": ["Schemas cannot describe strings or numbers", "Schema validity covers shape, not correct values", "The terms of service require validation", "The API may still return invalid JSON"], "a": 1, "e": "A date in the right format can still be the wrong date. Validate meaning, ranges and permissions.", "w": "D — decoding guarantees parseable JSON for finished output. A — schemas describe types. C — not a legal requirement, but sound engineering."}, {"id": 122616552, "d": "app", "t": "batch", "q": "A batch contains 1,000 requests and 20 of them fail with invalid parameters. What happens to the others?", "o": ["The failed ones are retried until they pass", "The rest are processed, each with its own result", "The whole batch is rejected", "The batch pauses until the 20 are fixed"], "a": 1, "e": "Results are per request: succeeded, errored, canceled or expired.", "w": "C — failure of one request does not fail the batch. D — no pause exists. A — invalid requests are not retried automatically."}, {"id": 1638049465, "d": "app", "t": "batch", "q": "What does a unique custom_id in a batch request allow?", "o": ["Matching each result to its request", "Cancelling one request inside a running batch", "Sorting the results by price", "Sharing the prompt cache between batches"], "a": 0, "e": "Results may arrive in any order, so <code>custom_id<\/code> is the link between request and result.", "w": "B — cancellation works on the batch. D — not related to caching. C — not a feature."}, {"id": 3333813253, "d": "app", "t": "batch", "q": "Which workload is a poor fit for the Batch API?", "o": ["Bulk summarization of an archive", "A weekly evaluation over 10,000 prompts", "A nightly ticket classification", "A chat assistant where a user waits"], "a": 3, "e": "Batch is asynchronous with up to 24 hours of processing. Interactive work needs the synchronous API.", "w": "C — ideal for batch. B — ideal for batch. A — ideal for batch."}, {"id": 2301392201, "d": "app", "t": "api", "q": "A developer wants Claude to answer in a fixed company voice for all conversations. Where should that style guidance live?", "o": ["A stop sequence", "Each user message, rewritten every time", "The metadata field of the request", "The system prompt, kept stable for caching"], "a": 3, "e": "Stable behavior belongs in the system prompt. Keeping it unchanged also enables cache hits.", "w": "B — repeated and error-prone. C — metadata is not read by the model. A — stop sequences end generation."}, {"id": 2535369004, "d": "app", "t": "api", "q": "Which of these is the best use of the assistant role in the messages array?", "o": ["Giving Claude permanent rules for later chats", "Replaying earlier Claude replies as history", "Storing the user's API key for later calls", "Telling the API which model should be used"], "a": 1, "e": "The assistant role carries the model's previous turns (including tool_use blocks) that you replay.", "w": "A — rules belong in the system prompt. C — secrets never go in messages. D — model is a request parameter."}, {"id": 2381213655, "d": "app", "t": "api", "q": "A developer wants to know whether a request would fit into the context window before sending it. What should be used?", "o": ["Characters divided by a fixed ratio", "The token counting endpoint", "A trial call with a tiny max_tokens", "The size of the JSON in kilobytes"], "a": 1, "e": "Counting tokens is exact and free of generation. Use it to decide when to compact history.", "w": "A — varies by language and content. C — a billed call that does not count anything. D — bytes are not tokens."}, {"id": 1473259479, "d": "app", "t": "api", "q": "A multi-turn app keeps appending every message forever and eventually fails. Which is a sound long-term strategy?", "o": ["Summarize or trim the oldest turns", "Set max_tokens to the maximum value", "Delete the system prompt after turn one", "Switch the API key every fifty turns"], "a": 0, "e": "History growth costs money and eventually exceeds the window. Manage it deliberately.", "w": "D — keys do not affect the window. B — max_tokens limits output only. C — loses the rules."}, {"id": 11845334, "d": "app", "t": "api", "q": "Which request field lets an application tag a call with an opaque user identifier for abuse detection?", "o": ["system.user", "messages.name", "tool_choice.user", "metadata.user_id"], "a": 3, "e": "<code>metadata.user_id<\/code> is an opaque identifier (never put personal data in it) that helps detect abuse.", "w": "A — not a field. B — not a field. C — not a field."}, {"id": 2640465428, "d": "app", "t": "stop", "q": "An agent loop receives stop_reason tool_use but also text before the tool_use block. How should the application treat the text?", "o": ["Log the text, still run the tool, continue", "Stop the loop and return only the text", "Delete the text to keep the history valid", "Ignore the call since Claude already answered"], "a": 0, "e": "Claude can explain what it is about to do. The tool_use block still needs a result.", "w": "D — leaves the call unanswered. B — breaks the task. C — keep the assistant turn unchanged in history."}, {"id": 2911386666, "d": "app", "t": "stop", "q": "A function is called by Claude with arguments that fail your own validation. What is the best response?", "o": ["Return success without running the tool", "Crash the app so someone notices", "Silently fix the arguments and run it", "Return is_error true explaining the problem"], "a": 3, "e": "A clear error lets Claude correct itself on the next step.", "w": "C — hides the model's mistake and can cause wrong actions. B — loses the session. A — lies to the model."}, {"id": 590485192, "d": "app", "t": "api", "q": "Which is the most appropriate place to enforce a per-user spending cap for a public Claude-powered feature?", "o": ["The system prompt, asking Claude to refuse", "The browser, with a local storage counter", "Your backend, with usage logged per user", "Nowhere, API rate limits are enough"], "a": 2, "e": "Enforce quotas where you control the logic and log usage. Prompts and browsers can be bypassed.", "w": "A — not enforceable. B — easy to bypass. D — API limits protect the account, not your margin per user."}, {"id": 3031732175, "d": "app", "t": "api", "q": "A team wants to run Claude calls from several services but see cost separated by product. What helps most?", "o": ["Separate workspaces or keys per product", "One key and a hand-kept spreadsheet", "Different system prompts per product", "Different temperatures per product"], "a": 0, "e": "Workspaces and keys give isolation, limits and reporting per product.", "w": "B — error-prone. C — prompts do not separate billing. D — temperature has no role."}, {"id": 2899701249, "d": "app", "t": "structured", "q": "Which approach would you pick to classify tickets into exactly five categories and never get any other label?", "o": ["A higher temperature to explore labels", "A prompt that lists the categories once", "A regex on the answer, retrying on mismatch", "Structured outputs with an enum of five values"], "a": 3, "e": "An enum in a JSON schema constrains the output to the allowed values.", "w": "B — usually works but no guarantee. C — wasteful and still unguaranteed. A — randomness hurts consistency."}, {"id": 3943080331, "d": "app", "t": "stream", "q": "Which statement about streaming and cost is correct?", "o": ["Streaming costs double for the open connection", "Price is the same, only delivery differs", "The first 1,000 streamed tokens are free", "Streaming is cheaper, it sends fewer tokens"], "a": 1, "e": "Price depends on tokens, not on delivery mode.", "w": "D — same tokens. A — no surcharge. C — no such allowance."}, {"id": 2918429345, "d": "app", "t": "api", "q": "Why might two identical requests send to Claude return different answers at temperature 1?", "o": ["The API keeps a hidden history", "The second call hits another model version", "Sampling is probabilistic", "Replies are altered to avoid caching"], "a": 2, "e": "LLM output is sampled. Design tests and logic around variance.", "w": "A — the API is stateless. B — the model ID is pinned. D — not a feature."}, {"id": 3856790105, "d": "app", "t": "api", "q": "A developer sends user text that contains the words Ignore previous instructions inside a user message of a summarizer app, and the summary follows it. What is the first improvement?", "o": ["Increase max_tokens to allow more time", "Lower the temperature to exactly zero", "Move the user text into the system prompt", "Tag the text as data and only summarize it"], "a": 3, "e": "Separate data from instructions with delimiters and an explicit instruction. For high risk, add screening and least privilege.", "w": "A — unrelated. C — gives the text even more authority. B — does not stop instruction following."}, {"id": 111319754, "d": "app", "t": "stop", "q": "A developer wants to detect whether Claude was cut by max_tokens in a streaming response. Where is stop_reason found?", "o": ["In message_start at the beginning", "In the first content_block_start event", "It is not available when streaming", "In message_delta near the end of the stream"], "a": 3, "e": "The final stop_reason arrives in <code>message_delta<\/code>.", "w": "A — unknown at the start. B — block start holds block info. C — it is available."}, {"id": 3941664818, "d": "app", "t": "api", "q": "Which description of the tokens in a request is most accurate?", "o": ["Only the newest user message is input", "Thinking tokens are counted as input tokens", "Input covers system, tools, history, new text", "Tool definitions are free and not counted"], "a": 2, "e": "Everything you send counts as input, including tool definitions. Thinking is billed as output.", "w": "A — history counts. D — tool definitions use input tokens. B — thinking is output."}, {"id": 720272880, "d": "app", "t": "api", "q": "A team stores prompts in a database and edits them without code review. Which risk is most relevant?", "o": ["Untested edits can degrade quality silently", "Stored prompts cannot be cached", "The API rejects prompts from databases", "Database prompts are always slower"], "a": 0, "e": "Prompts are code. Version them, review them and run evals before release.", "w": "C — the API sees only text. D — latency is unaffected by storage. B — caching depends on identical content."}, {"id": 2129736388, "d": "app", "t": "api", "q": "An application translates short phrases and needs the lowest cost with very low latency. Which design is sensible?", "o": ["A long system prompt with many examples", "Streaming with extended thinking enabled", "The top model with maximum effort", "A small model, short prompt, low max_tokens"], "a": 3, "e": "Simple, short tasks fit the smallest tier. Keep the prompt and output small.", "w": "C — overspending for an easy task. A — adds input cost. B — thinking adds latency and cost."}, {"id": 3363465272, "d": "app", "t": "stop", "q": "Why is it risky to retry a request without a limit when the API returns 529?", "o": ["The API blocks clients that retry at all", "Endless retries cause a storm, hide an outage", "Each retry doubles the request price", "529 means the account is banned"], "a": 1, "e": "Cap retries, use backoff with jitter and surface persistent failures.", "w": "D — 529 is overload, not a ban. C — price is per processed tokens. A — retries are expected, within reason."}, {"id": 689092189, "d": "app", "t": "api", "q": "A developer wants to guarantee the answer cites only the provided documents. Which measure helps most?", "o": ["Ask Claude to be honest in the prompt", "Supply the documents and require quotes", "Raise the temperature for diverse sources", "Remove the question to avoid confusion"], "a": 1, "e": "Grounding with quotes or citations makes unsupported claims easier to spot.", "w": "A — a request for honesty has no mechanism. C — randomness reduces grounding. D — the task needs the question."}, {"id": 1827409657, "d": "app", "t": "api", "q": "A customer-facing app should tell users clearly when Claude cannot answer. Which design supports that?", "o": ["Force Claude to always guess an answer", "Allow an I don't know answer and refusals", "Hide errors and show a blank answer", "Retry until Claude sounds confident"], "a": 1, "e": "Permission to say unknown reduces fabricated answers, and refusals need a user-facing message.", "w": "A — encourages hallucination. C — confuses users. D — loops and rewards guessing."}, {"id": 4000938044, "d": "model", "t": "models", "q": "A startup wants the cheapest option for tagging 5 million short reviews per day. Which model tier?", "o": ["Sonnet with a 1-hour cache", "Opus at xhigh effort", "Haiku, tested on an eval set", "Fable, for the highest accuracy"], "a": 2, "e": "Short, simple, high-volume tagging is the Haiku use case. Verify quality with evals first.", "w": "D — the most expensive tier for an easy job. B — high effort adds cost without need. A — caching does not fix a pricier tier."}, {"id": 1667679566, "d": "model", "t": "models", "q": "An agent plans a multi-day refactor across a huge code base. Which tier is the natural first choice?", "o": ["Opus, for long-running agentic coding", "Any tier, since tiers do not differ", "Haiku, for the lowest latency", "Haiku with thinking turned off"], "a": 0, "e": "Opus targets long-running agentic coding and knowledge work. Fable is for the most demanding reasoning.", "w": "C — latency is not the main need. D — would limit the planning. B — tiers differ in capability, latency and price."}, {"id": 367350516, "d": "model", "t": "models", "q": "Two models pass your evals equally. One costs half as much per token. What should you ship?", "o": ["The pricier one, since price signals quality", "Neither until a third model appears", "The cheaper one, and keep monitoring quality", "Both, chosen randomly per request"], "a": 2, "e": "When evals tie, take the cheaper and faster one, and keep watching production samples.", "w": "A — price is not a quality proof. D — adds variance without benefit. B — pointless delay."}, {"id": 3723373167, "d": "model", "t": "models", "q": "Which statement about the current Claude models and input types is correct?", "o": ["All accept text and images and return text", "Image input needs a separate model family", "Only Haiku supports tool use", "Only the largest tier accepts images"], "a": 0, "e": "All current models support text and image input, text output, vision and tool use.", "w": "D — image input is available on every current tier. C — every tier supports tools. B — no separate family is needed."}, {"id": 2445789539, "d": "model", "t": "models", "q": "Why can the same model ID have different features on Bedrock than on the Claude API?", "o": ["Each platform has its own feature rollout", "Platforms apply a different tokenizer", "Bedrock hosts older weights of the model", "Bedrock removes tool use on purpose"], "a": 0, "e": "Check the platform's feature page. Some beta features arrive on one platform before others.", "w": "C — the same model is served. D — tool use is available. B — the tokenizer belongs to the model."}, {"id": 1067620389, "d": "model", "t": "models", "q": "A company needs data to stay in a specific region and uses one cloud for everything. What should drive the platform choice?", "o": ["A random pick, since models are identical everywhere", "The platform with the most beta features only", "Whichever platform shows the lowest list price", "Data residency, contracts, IAM and feature support"], "a": 3, "e": "Residency and compliance come first, then check that the features you need exist there.", "w": "B — beta features are not a primary driver. C — price is only one factor. A — IDs, features and terms differ."}, {"id": 2271695254, "d": "model", "t": "models", "q": "What is the purpose of the Models API?", "o": ["Estimate monthly spend", "Change the default model of your organization", "Train a custom model on your data", "List models and read their limits and capabilities"], "a": 3, "e": "The Models API reports <code>max_input_tokens<\/code>, <code>max_tokens<\/code> and capabilities programmatically.", "w": "C — not offered there. B — you choose the model per request. A — not a function of the endpoint."}, {"id": 1787765636, "d": "model", "t": "models", "q": "A pipeline needs a quick yes or no gate before an expensive step. Which design is cost-efficient?", "o": ["The top model writes a long justification", "A small model returns a structured verdict", "A human reviews every item", "A batch job runs at midnight"], "a": 1, "e": "Cheap gating with a small model and a constrained output keeps the expensive step for the items that need it.", "w": "A — costly and slow. D — a gate must run inline. C — does not scale."}, {"id": 3016562077, "d": "model", "t": "models", "q": "How do the current Claude models compare in context window and maximum output?", "o": ["128K context window and 1M of output", "Same 1M context and 128K output on all", "1M context for Fable only, 200K for the rest", "Context size grows with the tier's price"], "a": 1, "e": "All four current models share a 1M-token context window and up to 128K output tokens.", "w": "C — not tier dependent. A — reversed. D — price does not change the window."}, {"id": 1090738549, "d": "model", "t": "models", "q": "When a model is announced for retirement, what is the right response?", "o": ["Switch to the most expensive tier now", "Ignore it until requests start failing", "Pin an alias that never gets retired", "Test the replacement with evals first"], "a": 3, "e": "Plan migration early. Run your evals on the replacement and adjust prompts if needed.", "w": "B — causes an outage. C — IDs are pinned snapshots, they do retire. A — cost is not the issue."}, {"id": 1644202608, "d": "model", "t": "thinking", "q": "Which task benefits most from extra thinking or higher effort?", "o": ["Detecting the language of a sentence", "Planning a multi-step migration", "Mapping a status code to a message", "Extracting a date from a short email"], "a": 1, "e": "Thinking helps hard reasoning, planning and difficult coding, not simple lookups or extraction.", "w": "A — trivial. D — simple extraction. C — a lookup table."}, {"id": 3679629734, "d": "model", "t": "thinking", "q": "A team sees high latency and high cost on a simple summarization feature using maximum effort. What is the best change?", "o": ["Switch to streaming and keep the rest", "Lower the effort and re-run the evals", "Raise max_tokens to the maximum value", "Add three more few-shot examples to it"], "a": 1, "e": "Effort controls token spend. Simple tasks rarely need maximum effort.", "w": "C — raises the ceiling, not the speed. D — adds input tokens. A — improves perceived latency only."}, {"id": 3204355490, "d": "model", "t": "thinking", "q": "In multi-turn tool use with thinking, what should be done with returned thinking blocks?", "o": ["Edit them so they match your own goals", "Remove them from history to save tokens", "Resend them as separate user messages", "Pass them back unchanged in the turn"], "a": 3, "e": "Keep thinking blocks unmodified in the assistant turn so reasoning continues across tool calls.", "w": "B — breaks continuity. A — editing them is not allowed. C — they belong to the assistant turn."}, {"id": 3114791220, "d": "model", "t": "thinking", "q": "What does a higher effort setting generally cause?", "o": ["A smaller context window for the call", "More thorough work, more tokens used", "Faster answers with fewer tokens used", "A lower price for every single token"], "a": 1, "e": "Higher effort spends more tokens on thinking, tool calls and detail.", "w": "C — that is lower effort. A — the window is fixed. D — price per token is unchanged."}, {"id": 2503216196, "d": "model", "t": "thinking", "q": "What is the default effort level on most current models?", "o": ["low", "max", "xhigh", "high"], "a": 3, "e": "<code>high<\/code> is the default on most models. Opus 5.5 and Haiku 5.5 default to <code>medium<\/code>.", "w": "A — a lower setting must be chosen. B — must be requested. C — must be requested."}, {"id": 3898749365, "d": "model", "t": "caching", "q": "A document of 30,000 tokens is asked about 10 times over 3 minutes. How should the prompt be built?", "o": ["Question first and the document at the end", "Document first with a breakpoint, then questions", "Document repeated in every user message", "Document split into ten smaller prompts"], "a": 1, "e": "Put the stable document at the front with the breakpoint so later requests read it from the cache.", "w": "A — a varying prefix never matches. C — repeats tokens and breaks caching. D — loses the shared context."}, {"id": 2202948888, "d": "model", "t": "caching", "q": "What is the effect of a cache hit on the price of the cached tokens?", "o": ["The same price as normal uncached input", "They are free of charge for the call", "Twice the base input price per token", "A small fraction of the base input price"], "a": 3, "e": "Reads cost 0.1x of the base price by default, and 0.05x on Opus 5.5 and Sonnet 5.5.", "w": "B — not free. C — that is the 1-hour write. A — that is the uncached price."}, {"id": 991708479, "d": "model", "t": "caching", "q": "What does cache_creation_input_tokens show in the usage object?", "o": ["Tokens rejected before reaching the model", "Tokens written to the cache by this call", "Tokens read from the cache on this call", "Tokens saved by sending the call in a batch"], "a": 1, "e": "<code>cache_creation_input_tokens<\/code> counts tokens written, <code>cache_read_input_tokens<\/code> counts tokens read.", "w": "C — that is cache_read_input_tokens. A — no such measure. D — unrelated to batching."}, {"id": 265661104, "d": "model", "t": "caching", "q": "After a prompt change, cache hits dropped to zero. What is the most likely reason?", "o": ["The change was inside the cached prefix", "The cache storage for your org was full", "The model forgot the earlier prompt text", "The previous response ended with end_turn"], "a": 0, "e": "Any change inside the prefix breaks an exact match. Stable parts should come first.", "w": "B — no such limit applies to your prompt. C — models keep nothing. D — the stop reason is unrelated."}, {"id": 2308272748, "d": "model", "t": "caching", "q": "Which element can you place after the last cache breakpoint without hurting the cache?", "o": ["The system prompt edited per user", "A tool definition that changes daily", "The new user question of this request", "The tool_choice setting"], "a": 2, "e": "Content after the final breakpoint is processed normally. Changes before it invalidate the cache.", "w": "B — tools are at the start of the prefix. A — system comes before messages. D — changes to tool_choice invalidate system and tools."}, {"id": 2167872835, "d": "model", "t": "caching", "q": "A team enables the 1-hour TTL for a prompt used once a week. What is the result?", "o": ["They get cache hits all week long", "The cache refreshes itself every week", "They pay nothing for the cache writes", "They pay the write cost and get no hits"], "a": 3, "e": "A cache that expires before the next use is wasted money. Match the TTL to the reuse pattern.", "w": "A — it expires after an hour. C — writes cost 2x. B — no automatic refresh exists."}, {"id": 3899477975, "d": "model", "t": "caching", "q": "Can thinking blocks carry a cache_control marker directly?", "o": ["Only for requests sent in batch mode", "Yes, every block can carry the marker", "Only when the 1-hour TTL is selected", "No, they are cached within the prefix"], "a": 3, "e": "Thinking blocks cannot be marked directly, but they become part of the cached prefix.", "w": "B — not allowed for thinking blocks. C — TTL does not change it. A — batch is unrelated."}, {"id": 2911747518, "d": "model", "t": "caching", "q": "Why does a long conversation benefit from automatic caching?", "o": ["The breakpoint moves forward with each turn", "The model gets smarter as the chat goes on", "Old turns are deleted from history for free", "Input tokens are billed once per day only"], "a": 0, "e": "Automatic caching places the breakpoint on the last cacheable block and moves it as the conversation grows.", "w": "C — nothing is deleted. B — models do not learn in-session. D — billing is per request."}, {"id": 2294068975, "d": "model", "t": "batch", "q": "Which pairing of features can cut the cost of a bulk job the most?", "o": ["Batch API plus a shared cached prefix", "More retries plus backoff", "Streaming plus higher effort", "A bigger model plus longer prompts"], "a": 0, "e": "Batch gives 50% off, and cache reads make the shared instructions cheap.", "w": "C — raises cost. D — raises cost. B — retries do not lower cost."}, {"id": 2504581074, "d": "model", "t": "batch", "q": "A batch result for one request has type expired. What does it mean?", "o": ["It was blocked by a safety filter", "It was not processed within 24 hours", "Its custom_id was a duplicate of another", "Its response was too long to store"], "a": 1, "e": "Batches expire after 24 hours. Unprocessed requests are reported as expired and can be resubmitted.", "w": "A — that would be an error or a refusal. C — duplicates are rejected on creation. D — truncation shows in stop_reason."}, {"id": 240692507, "d": "model", "t": "batch", "q": "How long do finished batch results stay downloadable?", "o": ["24 hours after completion", "Forever", "7 days after completion", "29 days after creation"], "a": 3, "e": "Results are available for 29 days from batch creation.", "w": "A — that is the processing window. C — wrong number. B — not forever."}, {"id": 3252196592, "d": "model", "t": "batch", "q": "Which is a good reason to split one huge batch into several?", "o": ["Smaller batches are billed less per token", "Batches cannot use system prompts", "Batches cannot use more than one model", "Limits of 100,000 requests or 256 MB per batch"], "a": 3, "e": "A batch holds up to 100,000 requests or 256 MB, whichever is reached first.", "w": "C — one model per batch is fine, all requests can share it. B — system prompts are allowed. A — the discount is the same."}, {"id": 2175376710, "d": "agents", "t": "agents", "q": "An agent must read 200 files to answer one question. Which design protects the main context?", "o": ["Paste all 200 files into one message", "Lower the temperature for the whole run", "Ask the user to pick which files matter", "Sub-agents summarize batches of files"], "a": 3, "e": "Sub-agents work in separate contexts and return short results to the orchestrator.", "w": "A — exhausts the window. C — shifts work to the user. B — unrelated."}, {"id": 2426255863, "d": "agents", "t": "agents", "q": "What does an agent do differently from a fixed workflow?", "o": ["It ignores the system prompt entirely", "It never calls any tools during the task", "It chooses its own next step at run time", "It always uses exactly one single request"], "a": 2, "e": "Workflows follow code-defined paths. Agents let the model direct the process.", "w": "B — agents use tools. D — they loop. A — the system prompt defines the goal."}, {"id": 3595162717, "d": "agents", "t": "agents", "q": "A coding agent should never delete production data on its own. What is the strongest control?", "o": ["Tell it in the prompt never to delete data", "Do not give it that permission at all", "Lower the effort setting of the agent", "Log every deletion after it has happened"], "a": 1, "e": "Remove the capability. Instructions can fail, permissions cannot be talked around.", "w": "A — a prompt is not enforcement. D — after the harm. C — unrelated."}, {"id": 4290736628, "d": "agents", "t": "agents", "q": "An agent task can run for hours. How should progress survive a crash?", "o": ["Checkpoint state outside the model", "Keep everything in the context window", "Rely on the model to remember the state", "Restart from the first step each time"], "a": 0, "e": "Store state in your own system so a restart resumes instead of repeating or losing work.", "w": "B — lost on crash. D — repeats side effects. C — models are stateless."}, {"id": 324700297, "d": "agents", "t": "agents", "q": "Which question helps decide whether to use an agent instead of a workflow?", "o": ["Is the end user a developer or not?", "Does the task involve any text at all?", "Can the steps be listed in advance?", "Is streaming enabled on the account?"], "a": 2, "e": "If the path is predictable, a workflow is simpler, cheaper and easier to test.", "w": "B — nearly everything does. A — irrelevant. D — irrelevant."}, {"id": 2645390794, "d": "agents", "t": "agents", "q": "Which log entry is most useful for debugging a failed agent run?", "o": ["Only the final answer shown to the user", "Every prompt, tool call, result, stop reason", "Only the very first message of the user", "Only the token counts of each request"], "a": 1, "e": "A full trace shows where the reasoning or tooling went wrong.", "w": "A — hides the cause. D — shows cost, not behavior. C — too little."}, {"id": 3264236704, "d": "agents", "t": "agents", "q": "An agent keeps asking the same tool the same question. What is a sensible guard?", "o": ["Detect repeated calls, then stop or adapt", "Switch the agent to the cheapest model", "Disable all of the tools for the agent", "Raise max_tokens so the agent can continue"], "a": 0, "e": "Loop detection plus iteration limits prevent wasted spend.", "w": "D — does not stop repetition. C — removes capability. B — may worsen quality."}, {"id": 1953943901, "d": "agents", "t": "agents", "q": "What is the right moment to ask the user a clarifying question in an agent flow?", "o": ["Only after the whole task has failed once", "When the request is ambiguous and a guess is costly", "Never, an agent should always just guess", "Before every single tool call it makes"], "a": 1, "e": "Ask when ambiguity could cause wrong or irreversible work. Do not interrupt for trivial choices.", "w": "D — too noisy. C — risky. A — too late."}, {"id": 467710941, "d": "agents", "t": "workflows", "q": "A pipeline first extracts facts and then writes a summary from them. Which pattern is this?", "o": ["Routing", "Orchestrator-workers", "Prompt chaining", "Voting"], "a": 2, "e": "Each step uses the previous output in a fixed sequence.", "w": "A — routing branches by input type. D — voting repeats one task. B — workers are planned dynamically."}, {"id": 2336843994, "d": "agents", "t": "workflows", "q": "Running the same classification three times and taking the majority is an example of:", "o": ["Evaluator-optimizer loop", "Routing by category", "Parallelization by voting", "Prompt chaining"], "a": 2, "e": "Voting runs the same task several times for higher confidence.", "w": "D — sequential steps. B — branches by category. A — critic and rewrite loop."}, {"id": 2959524489, "d": "agents", "t": "workflows", "q": "Which signal suggests adding an evaluator-optimizer loop?", "o": ["Inputs from five different customer types", "Clear criteria and drafts that improve", "A task whose subtasks are unknown upfront", "Independent subtasks that must finish fast"], "a": 1, "e": "A loop pays off when a critic can judge against a rubric and revisions help.", "w": "A — routing. D — parallelization. C — orchestrator-workers."}, {"id": 2938023422, "d": "agents", "t": "workflows", "q": "Why use a small model as a router?", "o": ["Routing needs no prompt", "Classifying the input is simple and cheap", "Small models cannot be wrong", "Small models are always more accurate"], "a": 1, "e": "Routing is classification, a good fit for the fastest, cheapest tier.", "w": "D — not always. A — it needs clear categories. C — they can be wrong."}, {"id": 933810752, "d": "agents", "t": "workflows", "q": "An orchestrator delegates to workers. What is a key risk?", "o": ["The orchestrator cannot see the results", "Cost and complexity grow with delegation", "Workers are not able to use any tools", "Workers must all use the very same model"], "a": 1, "e": "More calls mean more tokens and harder debugging. Use only when subtasks are unpredictable.", "w": "C — they can. A — results come back. D — models can differ."}, {"id": 822835613, "d": "agents", "t": "workflows", "q": "A validation step between two LLM calls checks the JSON of the first. What is it called in workflow design?", "o": ["A router", "A gate", "A worker", "A cache"], "a": 1, "e": "Gates validate intermediate output so errors do not compound.", "w": "A — routes by category. C — executes subtasks. D — stores prefixes."}, {"id": 3343723045, "d": "agents", "t": "agents", "q": "Which of these best describes the human-in-the-loop checkpoint?", "o": ["A pause for approval before a risky step", "A retry of the call after a timeout", "A prompt that sounds extra polite", "A fallback to a smaller model on error"], "a": 0, "e": "Show what will happen and let a person approve or reject.", "w": "C — wording only. D — a cost tactic. B — a reliability tactic."}, {"id": 642660962, "d": "prompt", "t": "prompting", "q": "Which instruction is most likely to be followed reliably?", "o": ["Answer in whatever way feels the best", "Be short but complete but also thorough", "Do your best and use no particular limit", "Reply in two sentences using plain words"], "a": 3, "e": "Specific, measurable and consistent instructions work best. Contradictions confuse the model.", "w": "B — contradictory. C — vague. A — vague."}, {"id": 1760281395, "d": "prompt", "t": "prompting", "q": "What is a good use of a role in the system prompt?", "o": ["A specific role such as a support analyst", "The exact version number of the model", "Only the current date and the time zone", "Only that you are a helpful assistant"], "a": 0, "e": "A specific role focuses behavior and tone more than a generic one.", "w": "D — generic. B — not helpful. C — useful, but not a role."}, {"id": 2686515608, "d": "prompt", "t": "prompting", "q": "Few-shot examples in a prompt mainly help to:", "o": ["Switch on the thinking mode of the model", "Reduce the cost per token of the call", "Raise the context window of the model", "Show the exact format and style wanted"], "a": 3, "e": "Examples demonstrate the target output. Use diverse, relevant ones wrapped in tags.", "w": "C — fixed. B — they add tokens. A — unrelated."}, {"id": 1873418177, "d": "prompt", "t": "prompting", "q": "Examples in a prompt all share one unusual feature, and every answer now has it. What is the lesson?", "o": ["XML tags around examples cause copying", "Few-shot prompting never really works", "The temperature of the call is too low", "Examples are copied closely, so vary them"], "a": 3, "e": "Models imitate examples strongly. Use diverse examples that differ in irrelevant ways.", "w": "B — it works well. C — unrelated. A — tags are not the cause."}, {"id": 1046015042, "d": "prompt", "t": "prompting", "q": "Why ask Claude to think before the final answer on a hard problem?", "o": ["It prevents the model from refusing a task", "Reasoning improves accuracy on hard tasks", "It makes the response cheaper to produce", "It removes the need for any further tests"], "a": 1, "e": "Allow reasoning (thinking or step by step), then request a concise final answer.", "w": "C — it costs more tokens. D — tests are still needed. A — unrelated."}, {"id": 3582221988, "d": "prompt", "t": "prompting", "q": "A prompt asks for JSON but sometimes adds a sentence before the JSON. What is the most robust fix?", "o": ["Use structured outputs", "Ask politely again", "Add the word JSON ten times", "Lower the max_tokens"], "a": 0, "e": "Structured outputs constrain the text to the schema. Prompt-only methods are best effort.", "w": "B — no guarantee. C — no guarantee. D — would truncate."}, {"id": 1120102065, "d": "prompt", "t": "prompting", "q": "Which change usually improves a vague prompt the most?", "o": ["Make it much longer with repeated phrases", "Write the whole prompt in capital letters", "State the task, audience and format", "Remove most of the surrounding context"], "a": 2, "e": "Clarity beats length. Tell Claude what good looks like.", "w": "A — repetition adds noise. B — emphasis is weak. D — context is needed."}, {"id": 1035877718, "d": "prompt", "t": "prompting", "q": "Which is a reasonable way to keep prompt changes safe?", "o": ["Edit the prompts live in production", "Never change a prompt that works today", "Version prompts and run evals first", "Let each developer keep a private copy"], "a": 2, "e": "Treat prompts as code: review, version, test.", "w": "A — risky. D — drift. B — blocks improvement."}, {"id": 1451839496, "d": "prompt", "t": "context", "q": "Which info belongs in a long-term memory store for a coding agent?", "o": ["Every raw tool output that was returned", "Random notes without any clear purpose", "The user's passwords and access tokens", "Project conventions and earlier decisions"], "a": 3, "e": "Store durable, useful facts. Never store secrets or noise.", "w": "A — bloat. C — never store secrets. B — noise."}, {"id": 147790889, "d": "prompt", "t": "context", "q": "A conversation includes 10 large tool results that are no longer needed. What helps the context budget?", "o": ["Raising the temperature of the requests", "Adding even more tools to the agent", "Switching the conversation over to batch", "Context editing or summarizing old results"], "a": 3, "e": "Stale tool results waste tokens. Clear or summarize them.", "w": "A — unrelated. C — unrelated. B — adds tokens."}, {"id": 1627408434, "d": "prompt", "t": "context", "q": "What is a risk of putting too many irrelevant documents into the prompt?", "o": ["The API rejects the request at once", "The model becomes slower to learn", "Cost rises and answer quality can drop", "Citations stop working"], "a": 2, "e": "Context is a budget. Retrieve what is relevant, not everything.", "w": "A — it only fails past the window. B — models do not learn in context. D — citations still work."}, {"id": 3314550601, "d": "prompt", "t": "context", "q": "A retrieval system returns 8 chunks. How should they be given to Claude?", "o": ["In the system prompt as rules", "As tagged documents with source names", "As the assistant's previous reply", "As one unlabeled paragraph"], "a": 1, "e": "Label sources so Claude can cite and separate data from instructions.", "w": "D — loses structure. A — gives data authority. C — misuses the assistant role."}, {"id": 1532170260, "d": "prompt", "t": "context", "q": "Where does Claude's knowledge of your private data come from during a chat?", "o": ["From training on your own usage data", "From past conversations of other users", "From the API key used for the request", "Only what you put in the request or tools"], "a": 3, "e": "The model has no access to your data unless you provide it in the context or through tools.", "w": "B — no cross-user memory. A — requests are not used this way by default. C — a key only authenticates."}, {"id": 971781158, "d": "prompt", "t": "context", "q": "A support bot answers using a 500-page manual. Which approach scales best?", "o": ["Fine-tune the model every single week", "Paste the whole manual into every prompt", "Ask Claude to recall the manual by heart", "Retrieve relevant sections per question"], "a": 3, "e": "Retrieval keeps prompts small and the answers current.", "w": "B — costly. A — slow. C — the manual is not in the model."}, {"id": 1765071890, "d": "prompt", "t": "context", "q": "What should happen to untrusted retrieved text in the prompt?", "o": ["Treat it as part of the system rules", "Put it in tagged data blocks, not rules", "Merge it into the user's question text", "Hide where the text came from entirely"], "a": 1, "e": "Separate data from instructions and keep the source visible.", "w": "A — dangerous. D — hides context. C — mixes roles."}, {"id": 1767599531, "d": "prompt", "t": "prompting", "q": "When Claude ignores a formatting rule, what should you check first?", "o": ["The request id of the response headers", "Whether another instruction contradicts it", "The release date of the model snapshot", "The API version header of the request"], "a": 1, "e": "Contradictions and missing examples are common causes.", "w": "C — unrelated. D — unrelated. A — unrelated."}, {"id": 1034924403, "d": "prompt", "t": "context", "q": "Why place the instructions after a very long document?", "o": ["It saves a few tokens from the request", "It switches off prompt caching entirely", "The API rejects questions placed up front", "Queries at the end improve long-input quality"], "a": 3, "e": "Put long data first and the question last.", "w": "C — not required. A — same tokens. B — caching is unaffected."}, {"id": 2077047977, "d": "tools", "t": "tooluse", "q": "Where do the parameters of a tool call from Claude come from?", "o": ["They are copied from the previous tool call", "Your server sends them before the call", "The API fills them from account settings", "Claude generates them from your input_schema"], "a": 3, "e": "Claude produces the <code>input<\/code> object of the tool_use block according to the schema you defined.", "w": "C — nothing is filled from account settings. B — the server does not pre-send arguments. A — each call is generated again."}, {"id": 132582837, "d": "tools", "t": "tooluse", "q": "What does is_error true on a tool_result tell Claude?", "o": ["The tool_use id was not valid anymore", "The tool failed and the content explains why", "The next request should use another model", "The conversation must stop immediately"], "a": 1, "e": "Claude can read the message and retry, change arguments or explain the problem to the user.", "w": "D — nothing forces a stop. A — ids are checked by the API, not signalled this way. C — models are not switched."}, {"id": 985413903, "d": "tools", "t": "tooluse", "q": "Claude never calls a tool you expected, and answers from memory instead. What is the best first step?", "o": ["Increase max_tokens so it can decide later on", "Move the tool to the end of the tools array", "Improve the tool description and its usage hint", "Rename the tool to a much longer name"], "a": 2, "e": "The description tells Claude when the tool applies. You can also require it with tool_choice.", "w": "A — output length does not decide tool use. D — a long name is not a better description. B — order has little effect."}, {"id": 2084483169, "d": "tools", "t": "tooluse", "q": "How can an application stop Claude from calling more than one tool in a single turn?", "o": ["Ask for short answers in the system prompt", "Set disable_parallel_tool_use in tool_choice", "Lower the temperature of the request to zero", "Define only one property in each input_schema"], "a": 1, "e": "<code>tool_choice: {type: auto, disable_parallel_tool_use: true}<\/code> limits Claude to at most one call per turn.", "w": "D — schema size does not limit the call count. C — temperature does not control it. A — answer length is a different matter."}, {"id": 1940648773, "d": "tools", "t": "tooluse", "q": "What should a tool return when a search finds nothing?", "o": ["An error that stops the whole conversation", "A made-up result so Claude can continue", "A clear empty result that says nothing matched", "Nothing, so that no tool_result is sent"], "a": 2, "e": "An explicit empty result lets Claude try another query or tell the user. Every tool_use needs a tool_result.", "w": "A — an empty result is not a failure. B — fabricated data misleads the model. D — a missing result makes the next request invalid."}, {"id": 3185734678, "d": "tools", "t": "tooluse", "q": "Which tool type runs entirely inside Anthropic's infrastructure?", "o": ["The bash tool", "A function you define", "The text editor tool", "Web search"], "a": 3, "e": "Server tools such as web search, web fetch and code execution run on Anthropic's side. Bash and text editor are client tools you execute.", "w": "B — your own functions run in your app. A — bash is executed by your code. C — edits are applied by your code."}, {"id": 2777183368, "d": "tools", "t": "tooluse", "q": "What is the role of the tool_use id?", "o": ["It selects which tool should run next", "It links a tool_result to the call it answers", "It stores the tool arguments for later reuse", "It signs the call so it cannot be changed"], "a": 1, "e": "Each <code>tool_result<\/code> carries the matching <code>tool_use_id<\/code>.", "w": "A — the name selects the tool. C — ids hold no arguments. D — ids are not signatures."}, {"id": 4268797110, "d": "tools", "t": "tooluse", "q": "A tool returns a huge HTML page. What is the best change?", "o": ["Return only the relevant text in compact form", "Send the page in the system prompt instead", "Split the page into many assistant messages", "Raise max_tokens to the largest allowed value"], "a": 0, "e": "Tool output uses context tokens. Trim and structure it for what Claude needs.", "w": "D — output limit is not the problem. B — gives untrusted text authority. C — misuses the assistant role."}, {"id": 565072687, "d": "tools", "t": "mcp", "q": "Which side of an MCP connection exposes tools and resources?", "o": ["The server", "The model provider", "The user's browser", "The host application"], "a": 0, "e": "Servers expose capabilities. Clients connect from the host application and relay them to the model.", "w": "D — hosts contain the clients. B — the model only sees what the client passes. C — not part of the protocol roles."}, {"id": 37210180, "d": "tools", "t": "mcp", "q": "A team writes an MCP server in Python. What do the function docstring and type hints become?", "o": ["The server's authentication rules", "Comments that the client ignores", "The list of allowed users", "The tool description and input schema"], "a": 3, "e": "SDKs such as FastMCP derive the tool description and schema from the function definition.", "w": "B — they are used. A — authentication is separate. C — access control is separate."}, {"id": 2381291202, "d": "tools", "t": "mcp", "q": "Which tool helps you test and debug an MCP server interactively?", "o": ["The MCP Inspector", "The batch endpoint", "The models list endpoint", "The token counting endpoint"], "a": 0, "e": "The Inspector lets you call tools, read resources and see messages during development.", "w": "B — not for MCP. D — only counts tokens. C — lists models."}, {"id": 3022437592, "d": "tools", "t": "mcp", "q": "An MCP server needs a database password. Where should it be stored?", "o": ["In the messages sent to the model", "In the tool description for Claude to read", "In an environment variable or a secret store", "In the resource list of the server"], "a": 2, "e": "Never place secrets where the model or the logs can see them. Keep credentials outside the prompt path.", "w": "B — exposes it to the model. D — resources are exposed content. A — messages are visible to the model."}, {"id": 1791326258, "d": "tools", "t": "mcp", "q": "Which MCP primitive would you use to give a user a reusable slash-command-like template?", "o": ["A transport", "A prompt", "A resource", "A tool"], "a": 1, "e": "Prompts are templates the user chooses. Tools are model-controlled and resources are application-controlled.", "w": "D — model-controlled. C — data. A — a connection mechanism."}, {"id": 3313960059, "d": "tools", "t": "mcp", "q": "What is the main risk of connecting an unknown third-party MCP server?", "o": ["It changes the training data of the model", "It will make the model slower to start up", "Its tools may read data or act unexpectedly", "It switches off prompt caching for requests"], "a": 2, "e": "Treat servers like third-party code: review tools, apply least privilege and require confirmation for risky actions.", "w": "B — not the main concern. A — nothing is trained. D — unrelated."}, {"id": 3609714788, "d": "tools", "t": "tooluse", "q": "Why is the order of tool_result blocks inside the user message important?", "o": ["They must be sorted alphabetically by tool name", "They must alternate with assistant text blocks", "They must be placed after the system prompt", "They must come before any other text there"], "a": 3, "e": "Put <code>tool_result<\/code> blocks first, then optional text.", "w": "A — no sorting rule exists. C — the system prompt is a separate parameter. B — they sit in one user message."}, {"id": 2394712538, "d": "tools", "t": "tooluse", "q": "Which design makes tool selection easier for Claude?", "o": ["One tool that accepts any free text", "Tools named with random short codes", "Few tools with clearly different purposes", "Many tools with almost the same description"], "a": 2, "e": "Distinct, well-described tools reduce confusion and token cost.", "w": "D — overlap causes wrong picks. A — hides the structure. B — names carry meaning for the model."}, {"id": 3261758052, "d": "sec", "t": "security", "q": "Which source of text is the most dangerous for indirect prompt injection?", "o": ["The system prompt written by your team", "A web page fetched by an agent tool", "A reviewed internal style guide", "A constant defined in your code"], "a": 1, "e": "Third-party content can be written by an attacker. Treat it as data.", "w": "A — controlled by you. D — controlled by you. C — reviewed and trusted."}, {"id": 3144513655, "d": "sec", "t": "security", "q": "A summarizing agent is allowed to call a send_email tool. What is the best way to reduce injection risk?", "o": ["Raise the effort level of the agent", "Log the sent emails every night", "Remove the tool or require approval for each send", "Tell the agent in bold never to send emails"], "a": 2, "e": "Capabilities should match the task. Sensitive actions need explicit user approval.", "w": "D — a prompt is not enforcement. A — more reasoning is not control. B — detects harm after it happened."}, {"id": 1143153802, "d": "sec", "t": "security", "q": "A system prompt contains a secret API key so the model can use a service. What is wrong?", "o": ["Keys use too many tokens", "The API rejects prompts that contain keys", "Keys in prompts make caching impossible", "The model and its output can reveal the key"], "a": 3, "e": "Never put secrets in prompts. Call services from your code or tools and keep the key outside the model's context.", "w": "C — caching is not the issue. B — the API does not scan for keys. A — token use is not the problem."}, {"id": 2976735432, "d": "sec", "t": "security", "q": "Why should logs of prompts and answers be handled carefully?", "o": ["They can contain personal data and secrets", "Logs void the model's safety features", "Logs are not allowed by the API", "Logs make the API slower"], "a": 0, "e": "Apply retention limits, masking and access control to anything that stores user content.", "w": "D — logging is on your side. B — unrelated. C — logging is allowed and recommended."}, {"id": 340128480, "d": "sec", "t": "security", "q": "A jailbreak attempt appears in user chat input. Which layer helps most before the main call?", "o": ["A small model screening the input", "A lower temperature", "A longer answer from the main model", "A higher max_tokens value"], "a": 0, "e": "A harmlessness screen with a cheap model and a structured verdict filters obvious attacks.", "w": "C — unrelated. D — unrelated. B — does not block attacks."}, {"id": 1172553912, "d": "sec", "t": "security", "q": "What does least privilege mean for an agent with database access?", "o": ["Admin rights so that it never fails a task", "Read access only to the tables it needs", "One shared admin account for all the agents", "Write access now, with logging done later on"], "a": 1, "e": "Limit scope so a successful attack can do little damage.", "w": "A — maximal damage. C — no accountability. D — after the fact."}, {"id": 2745428726, "d": "sec", "t": "security", "q": "Which handling of a refusal is best in a customer-facing app?", "o": ["Retry the same request ten times", "Switch to a larger model automatically", "Show a clear message and offer a safe next step", "Hide the response and show a blank screen"], "a": 2, "e": "Refusals are valid outcomes. Communicate clearly instead of looping.", "w": "A — likely to refuse again. D — confusing. B — a fallback may be reasonable but not automatic for every refusal."}, {"id": 196459277, "d": "sec", "t": "security", "q": "A web app lets users upload documents that Claude summarizes. Which is the right mental model for the document text?", "o": ["Trusted configuration written by the app", "Untrusted data that may contain instructions", "System instructions with high priority", "Private text that cannot influence the model"], "a": 1, "e": "Uploaded text may carry hidden instructions. Tag it as data and limit what the agent can do.", "w": "A — users can write anything. C — documents are not system instructions. D — anything in context can influence the model."}, {"id": 1077122677, "d": "sec", "t": "security", "q": "Which practice helps comply with data minimization when calling Claude?", "o": ["Send only needed fields and mask identifiers", "Send the whole customer record for context", "Ask the users to share passwords for speed", "Store the full prompts forever for debugging"], "a": 0, "e": "Less personal data in prompts means less exposure.", "w": "B — more data than needed. D — long retention increases risk. C — never collect passwords this way."}, {"id": 1277204935, "d": "sec", "t": "security", "q": "How should JSON-encoding help with untrusted tool output?", "o": ["It marks boundaries so text cannot act as rules", "It removes every malicious word from the text", "It makes the output smaller and cheaper", "It lets the model skip its safety checks"], "a": 0, "e": "Escaping gives unambiguous delimiters between data and the surrounding structure.", "w": "C — size is unchanged. B — it does not filter words. D — safety checks are unaffected."}, {"id": 175436721, "d": "sec", "t": "security", "q": "Which statement about monitoring a deployed agent is correct?", "o": ["Users will always report attacks themselves", "Monitoring is only needed before launch", "Sample outputs and alert on unusual tool use", "Logs make attacks impossible"], "a": 2, "e": "Continuous monitoring finds successful injections and drift so you can refine defenses.", "w": "B — risks appear after launch. D — logs only help detection. A — many attacks stay invisible to users."}, {"id": 4145568207, "d": "sec", "t": "security", "q": "Model output will be shown in a web page. What is required before rendering it?", "o": ["Lower the temperature", "Escape or sanitize it like any untrusted input", "Add the word safe to the prompt", "Nothing, the model always writes safe HTML"], "a": 1, "e": "Model text can contain scripts or markup, so treat it as untrusted to avoid cross-site scripting.", "w": "D — not guaranteed. C — a prompt is not a sanitizer. A — unrelated."}, {"id": 3767336719, "d": "cc", "t": "claude-code", "q": "Where can personal Claude Code preferences that apply to all your projects be stored?", "o": ["In the model's own system prompt on the server", "Only in each repository's CLAUDE.md file", "Inside the configuration of the CI pipeline", "In your user-level settings under the home folder"], "a": 3, "e": "User-level files apply across projects. Project files are shared with the team.", "w": "B — project file is shared per repository. A — not editable by users. C — unrelated to personal setup."}, {"id": 77870704, "d": "cc", "t": "claude-code", "q": "A team wants Claude Code to run tests automatically after each edit. Which feature fits best?", "o": ["A different permission mode", "A sub-agent that only reads files", "A hook triggered after file edits", "A longer CLAUDE.md file"], "a": 2, "e": "Hooks run your commands at lifecycle events, which makes the behavior deterministic.", "w": "D — advice only. B — cannot run tests. A — controls approvals, not triggers."}, {"id": 798587434, "d": "cc", "t": "claude-code", "q": "What is plan mode in Claude Code used for?", "o": ["Running code faster while using less memory", "Skipping all of the permission checks", "Turning off every configured hook for a while", "Exploring and planning without any changes"], "a": 3, "e": "Plan mode keeps Claude read-only while it explores and proposes a plan for approval.", "w": "A — not its purpose. B — it does the opposite. C — unrelated."}, {"id": 1306187958, "d": "cc", "t": "claude-code", "q": "How can Claude Code be used inside a CI pipeline?", "o": ["It cannot run without a person being present", "Only by typing into a terminal by hand", "Only through the desktop application window", "In headless mode with claude -p or the SDK"], "a": 3, "e": "Headless mode and the Agent SDK run Claude Code from scripts.", "w": "C — scripts can call it. B — automation is supported. A — it can run unattended."}, {"id": 2465989328, "d": "cc", "t": "claude-code", "q": "What is a skill in Claude Code?", "o": ["A list of commands that are always banned", "A hardware key used for authentication", "A model setting that gives faster output", "A folder of instructions Claude loads on demand"], "a": 3, "e": "Skills package reusable know-how that Claude pulls in when the task matches.", "w": "B — unrelated. C — unrelated. A — that is a deny rule."}, {"id": 4010775424, "d": "cc", "t": "claude-code", "q": "Which habit gives the best results when working with Claude Code?", "o": ["Never review the changes", "Keep one huge conversation for all tasks", "Plan first, implement, then verify with tests", "Ask for the whole app in one prompt"], "a": 2, "e": "Give Claude a way to check its work and clear context between unrelated tasks.", "w": "D — large unfocused tasks fail more often. A — review is essential. B — context bloat hurts quality."}, {"id": 175132291, "d": "eval", "t": "evals", "q": "What should an eval set contain besides typical cases?", "o": ["Only examples the prompt already passes", "Edge cases and past production failures", "Only the easiest examples", "Random text unrelated to the task"], "a": 1, "e": "Evals should reflect real difficulty. Add every new failure so it stays fixed.", "w": "C — hides weaknesses. A — no signal. D — no value."}, {"id": 338815610, "d": "eval", "t": "evals", "q": "Which grader type is fastest and cheapest for checking that output matches a schema?", "o": ["A customer survey", "A human reviewer", "An LLM judge with a rubric", "A code-based grader"], "a": 3, "e": "Deterministic checks (schema, exact match, tests) are cheap and reliable where they apply.", "w": "B — slow. C — slower and costlier. A — too slow and noisy."}, {"id": 39821988, "d": "eval", "t": "evals", "q": "Why compare scores per category instead of only the overall average?", "o": ["Category scores are free of charge", "An average can hide a drop in one category", "Categories are required by the API", "Averages are always wrong about quality"], "a": 1, "e": "Break results down so a drop in one area is not masked by gains elsewhere.", "w": "C — not required. D — averages are useful. A — no such rule."}, {"id": 1511673021, "d": "eval", "t": "evals", "q": "Production monitoring shows more refusals after a prompt change. What is the best first step?", "o": ["Remove the monitoring to avoid the alerts", "Raise max_tokens for every single request", "Switch the model name at random each day", "Inspect sampled traces and compare with evals"], "a": 3, "e": "Use traces to find what changed and reproduce it on evals.", "w": "A — hides the issue. B — unrelated. C — adds variables."}, {"id": 864824421, "d": "eval", "t": "evals", "q": "When using Claude as a judge, what should you do before trusting its scores?", "o": ["Compare its verdicts with human labels on a sample", "Ask it to be extremely strict", "Skip the rubric to avoid bias", "Use the same prompt for generation and grading"], "a": 0, "e": "Calibrate the judge against human judgment and keep the rubric specific.", "w": "D — shares blind spots. B — vague instruction. C — a rubric is needed."}], "C": [{"id": 3798616281, "t": "api", "f": "Which parameters are required in a Messages API request?", "b": "model, max_tokens and messages."}, {"id": 1812455697, "t": "api", "f": "Is the Messages API stateful?", "b": "No. You send the full history every call and you store state yourself."}, {"id": 3150992858, "t": "api", "f": "Where does the system prompt go?", "b": "In the top-level system parameter. There is no system role in messages."}, {"id": 508743393, "t": "api", "f": "What does max_tokens limit?", "b": "Only the output tokens of the answer."}, {"id": 3738965975, "t": "api", "f": "How do you count input tokens before sending?", "b": "Use the token counting endpoint."}, {"id": 2137644253, "t": "api", "f": "Does temperature 0 guarantee identical output?", "b": "No. Outputs are very similar but identical text is not guaranteed."}, {"id": 2979213928, "t": "stop", "f": "stop_reason end_turn: what to do?", "b": "Use the answer. Claude finished naturally."}, {"id": 1521242273, "t": "stop", "f": "stop_reason max_tokens: what to do?", "b": "The answer is cut. Raise the limit or ask Claude to continue."}, {"id": 865568409, "t": "stop", "f": "stop_reason tool_use: what to do?", "b": "Run each client tool and send tool_result blocks in a user message."}, {"id": 3298697943, "t": "stop", "f": "stop_reason pause_turn: what to do?", "b": "A server tool loop hit its limit (default 10). Send the assistant response back unchanged."}, {"id": 2199478510, "t": "stop", "f": "stop_reason refusal: what to know?", "b": "It is an HTTP 200 and is billed. Handle it explicitly, do not loop."}, {"id": 17648365, "t": "stop", "f": "stop_reason model_context_window_exceeded", "b": "The context window filled before max_tokens. The output is truncated."}, {"id": 74109250, "t": "stop", "f": "Which HTTP errors are worth retrying?", "b": "429, 500 and 529, with exponential backoff and jitter. Not 400 or 401."}, {"id": 3773666524, "t": "stop", "f": "What does HTTP 413 mean?", "b": "The request is too large."}, {"id": 1666865606, "t": "stop", "f": "Why log the request-id header?", "b": "Support needs it to trace a specific request."}, {"id": 1226936032, "t": "stream", "f": "How do you stream a response?", "b": "Set stream: true and read server-sent events."}, {"id": 3516252653, "t": "stream", "f": "How do you read streamed tool input?", "b": "Accumulate input_json_delta fragments and parse after content_block_stop."}, {"id": 3000150661, "t": "stream", "f": "Which event carries the final stop_reason?", "b": "message_delta."}, {"id": 4193857863, "t": "stream", "f": "Can an error arrive after a 200 in a stream?", "b": "Yes, as an error event in the stream."}, {"id": 2729300426, "t": "models", "f": "Claude Haiku 5.5: what is it for?", "b": "High-volume, latency-sensitive work: classification, extraction, routing. From $0.10 / $0.50 per MTok."}, {"id": 284833187, "t": "models", "f": "Claude Sonnet 5.5: what is it for
