", "f": "Three ways to send an image", "b": "Inline base64 (one-off), URL, Files API (reuse across requests)."}, {"id": 3055977297, "t": "multimodal", "f": "Is looping over the sync API in chunks batching?", "b": "No. The API still sees one request per item. Batching is a different submission model."}, {"id": 438902789, "t": "claude-code", "f": "Claude Code permission modes", "b": "default, acceptEdits, plan, auto, dontAsk, bypassPermissions."}, {"id": 3218764777, "t": "claude-code", "f": "What does bypassPermissions skip?", "b": "Every prompt, including the protected-path guard that other modes keep."}, {"id": 941325059, "t": "claude-code", "f": "Settings that cannot be overridden", "b": "managed-settings.json set by administrators. A deny rule always wins over an allow."}, {"id": 2629685703, "t": "claude-code", "f": "Hook events and which can block", "b": "PreToolUse (exit code 2 blocks), PostToolUse, UserPromptSubmit, Stop, Notification, SessionStart, SessionEnd. Only PreToolUse blocks."}, {"id": 2463943555, "t": "claude-code", "f": "Built-in Explore and Plan subagents", "b": "They skip CLAUDE.md and git status to stay fast, so project rules are not in their context."}, {"id": 1731197268, "t": "claude-code", "f": "Paths for plugin scripts", "b": "$CLAUDE_PROJECT_DIR for project scripts, ${CLAUDE_PLUGIN_ROOT} for scripts bundled in the plugin. Never an absolute home path."}, {"id": 3337366649, "t": "claude-code", "f": "How are plugin commands named?", "b": "Namespaced by plugin: a run-tests command in plugin payments is /payments:run-tests."}, {"id": 3692671459, "t": "mcp", "f": "MCP scopes", "b": "Local (~/.claude.json), user (personal), project (.mcp.json committed), enterprise (managed)."}, {"id": 4043448737, "t": "mcp", "f": "Permission rule for one MCP tool", "b": "mcp__server__tool. A deny on one tool overrides an allow on the server."}, {"id": 1565800427, "t": "security", "f": "Never commit a credential", "b": "Use a variable reference in .mcp.json. A committed key is compromised and must be rotated."}, {"id": 413726225, "t": "security", "f": "OAuth redirect URI across environments", "b": "Registered per host. Staging working does not mean production works. Many customers need a separate app per environment."}, {"id": 1983431171, "t": "security", "f": "Three practices for secrets", "b": "Separation from config, a home (env variable or secret store), rotation."}, {"id": 1887233248, "t": "security", "f": "Rule precedence", "b": "Deny over ask over allow."}, {"id": 3453377097, "t": "security", "f": "What does OS-level sandboxing add?", "b": "Process-level isolation (files, network) that holds even when a hook is missing or misconfigured."}, {"id": 2651006299, "t": "security", "f": "Zero data retention eligibility", "b": "Varies by model and platform and is not guaranteed for every model. Confirm per model at scoping."}, {"id": 419198604, "t": "evals", "f": "Design document: four decisions", "b": "Success criteria, failure handling, cost and latency budget, trust boundary."}, {"id": 1505668416, "t": "evals", "f": "Four test levels", "b": "Unit, functional, integration (the seam), end-to-end. Most silent failures hide at the integration seam."}, {"id": 3530579911, "t": "evals", "f": "Why does validation not equal correctness?", "b": "It checks the shape of a value, not that it is the right one. Only a graded case detects a wrong value."}, {"id": 513204051, "t": "stop", "f": "Retriable vs terminal errors", "b": "Retriable: 429, 529, 5xx. Terminal: 400, 401, 403, 404. A refusal is HTTP 200 and fails fast."}, {"id": 1471014399, "t": "stop", "f": "Two retry loops around one call", "b": "Attempts multiply. Let the SDK retry, or turn it down and own the whole path."}, {"id": 4003506845, "t": "stop", "f": "Failed tool: what to return?", "b": "A tool_result with is_error true and a message. An empty result looks like valid data."}, {"id": 3354637073, "t": "models", "f": "Model selection default", "b": "Start with Sonnet, move up only when an eval shows it misses the bar, down to Haiku only when the drop is acceptable. Route with a default plus override."}, {"id": 2426065351, "t": "batch", "f": "Orchestrator-worker cost", "b": "Roughly 15x the tokens of a normal chat in Anthropic's reported system. Use only when work splits into independent parts."}, {"id": 2614992057, "t": "batch", "f": "Reliability floor", "b": "Set latency and retry limits first, then tune cost above them. A pinned baseline eval score enforces it."}, {"id": 2196088098, "t": "caching", "f": "When does caching pay off?", "b": "When cache reads outnumber the costlier writes: identical prefix, reuse within the lifetime, prefix above the minimum, content that is not live state."}, {"id": 3852117444, "t": "accelerators", "f": "Three accelerator asset types", "b": "Agent template, MCP server package, eval suite. Parameterize, document assumptions, bundle the audit log."}, {"id": 184836549, "t": "accelerators", "f": "What a maintainer needs to accept a contribution", "b": "Focused code, a runnable example, a test, an assumptions note, and the rights check first."}, {"id": 1439058522, "t": "accelerators", "f": "Where do contributions go?", "b": "Cookbook for focused reference implementations. Tools and servers to their own repositories."}, {"id": 3221134169, "t": "accelerators", "f": "Functional vs infrastructure requirements", "b": "Functional: checkable behavior. Infrastructure: latency, scale, residency, identity."}, {"id": 2395920670, "t": "accelerators", "f": "Lifecycle phases", "b": "Requirements, design, build, test, deploy, operate, iterate, with gates between them."}, {"id": 1330747359, "t": "platforms", "f": "Claude Platform on AWS vs Claude in Bedrock", "b": "Platform on AWS: Anthropic-operated inference outside the AWS boundary. Bedrock: data stays inside the customer's AWS boundary."}, {"id": 3866410599, "t": "platforms", "f": "Alias vs pinned model ID", "b": "An alias moves. A pinned full ID is a fixed snapshot. Pin what ships and keep the prior version for rollback."}, {"id": 301990588, "t": "platforms", "f": "Why can a familiar platform fail review?", "b": "Easy to build is not allowed to ship. Residency and compliance are often pass or fail and must be raised in scoping."}, {"id": 3860388218, "t": "platforms", "f": "Comparing platforms", "b": "Latency from the customer's region, compliance against their certifications, total cost including egress and integration."}, {"id": 3168223040, "t": "security", "f": "Seams in a multi-component app", "b": "A component passing its own tests says nothing about the seam. Mark each seam as a boundary and treat fetched content as data."}, {"id": 2381355764, "t": "limits", "f": "The exam in numbers", "b": "53 questions, 120 minutes, multiple choice and multiple response, pass 720 of 1000."}, {"id": 3926569802, "t": "limits", "f": "Exam domain weights", "b": "Applications 33.1, Models 16.8, Agents 14.7, Prompt and context 11.0, Tools and MCP 10.6, Security 8.1, Claude Code 3.1, Evals 2.6 (percent)."}], "O": [{"id": "o-toolloop", "t": "tooluse", "title": "The tool-use loop", "prompt": "Put the steps of one client tool round trip in order.", "steps": ["Send the request with tools and the user message", "Claude answers with stop_reason tool_use and a tool_use block", "Your code runs the requested tool", "Send a user message with a tool_result for the tool_use id", "Claude answers with stop_reason end_turn and the final text"], "note": "Keep the same tools array on the follow-up request and keep the assistant's tool_use turn in the history."}, {"id": "o-stream", "t": "stream", "title": "Streaming events", "prompt": "Put the streamed events of a simple text answer in order.", "steps": ["message_start", "content_block_start", "content_block_delta", "content_block_stop", "message_delta", "message_stop"], "note": "message_delta carries the final stop_reason and output usage."}, {"id": "o-cacheprefix", "t": "caching", "title": "Cache prefix order", "prompt": "Put the levels of the cached prompt prefix in order, first to last.", "steps": ["tools", "system", "messages"], "note": "A change at one level invalidates that level and every level after it."}, {"id": "o-improve", "t": "thinking", "title": "Improving quality cheaply", "prompt": "Put the levers for improving a weak answer in the sensible order, cheapest first.", "steps": ["Improve the prompt and the context", "Add examples and fix the tool descriptions", "Raise effort or enable thinking", "Move to a more capable model"], "note": "Measure with an eval set after each step. A bigger model is the most expensive lever."}, {"id": "o-injection", "t": "security", "title": "Handling untrusted content", "prompt": "Put the safe handling of a fetched web page in order.", "steps": ["Fetch the page with a tool that has narrow permissions", "Label the content with its source and mark it as untrusted", "Return it to Claude inside a tool_result block", "Screen it with a small classifier if the risk is high", "Ask the user to approve any sensitive action Claude proposes"], "note": "Least privilege limits the damage if an injection still gets through."}, {"id": "o-eval", "t": "evals", "title": "Shipping a prompt change", "prompt": "Put the steps of changing a prompt safely in order.", "steps": ["Collect failing cases and write the change", "Run the old and new prompt on the eval set", "Compare scores per category, not only the average", "Ship the change behind a gradual rollout", "Monitor production samples and add new failures to the eval set"], "note": "Evals define done and catch regressions."}, {"id": "o-stream-handler", "t": "stream", "title": "Handling a streamed tool call", "prompt": "Put the steps of a safe streamed tool call in order.", "steps": ["Open a slot for the block on content_block_start", "Append each input fragment on content_block_delta", "Parse the JSON only after content_block_stop", "Append the turn to history only after message_stop", "Run the tool and send the tool_result"], "note": "A stream ending is not a message completing. On an interrupted stream discard the partial turn and retry."}, {"id": "o-agent-steps", "t": "agents", "title": "Wiring an agent loop", "prompt": "Put the four steps that hold on every wiring path in order.", "steps": ["Register the tools the agent needs", "Scope the system prompt to the task and tools", "Handle the tool-use loop and return every result", "Define exit conditions that do not rely on Claude stopping"], "note": "A human-in-the-loop checkpoint goes before any irreversible action inside the loop."}, {"id": "o-lifecycle", "t": "accelerators", "title": "The systems lifecycle", "prompt": "Put the lifecycle phases of a Claude application in order.", "steps": ["Requirements", "Design", "Build", "Test", "Deploy", "Operate", "Iterate"], "note": "Gates sit between phases: no build before the platform satisfies residency, no full production before the eval clears the baseline."}, {"id": "o-leaked-key", "t": "security", "title": "A key was committed in a config file", "prompt": "Put the right response to a leaked credential in order.", "steps": ["Treat the key as compromised and rotate it", "Move the value to an environment variable or secret store", "Replace the config value with a variable reference", "Add a hook that blocks credential-looking writes", "Record which services use the credential"], "note": "Overwriting a file does not remove a value from history."}], "M": [{"id": "m-stop", "t": "stop", "title": "Stop reasons", "prompt": "Match each stop_reason with the right reaction.", "pairs": [["end_turn", "Use the answer"], ["max_tokens", "Raise the limit or continue the answer"], ["tool_use", "Run the tool and send a tool_result"], ["pause_turn", "Send the assistant response back unchanged"], ["refusal", "Show a message, rephrase or use a fallback"]], "note": "refusal is an HTTP 200 and is billed."}, {"id": "m-models", "t": "models", "title": "Model tiers", "prompt": "Match each model with the work it is built for.", "pairs": [["Haiku 5.5", "High-volume, latency-sensitive classification and routing"], ["Sonnet 5.5", "Best balance of speed and intelligence"], ["Opus 5.5", "Long-running agentic coding and knowledge work"], ["Fable 5.2", "Demanding reasoning and long-horizon agentic work"]], "note": "Start with the smallest model that passes your evals."}, {"id": "m-http", "t": "stop", "title": "HTTP errors", "prompt": "Match each status code with its meaning.", "pairs": [["400", "Invalid request, fix it"], ["401", "Bad or missing API key"], ["403", "No permission for the resource"], ["413", "Request too large"], ["429", "Rate limit, back off and retry"], ["529", "API overloaded, retry later"]], "note": "Retry 429, 500 and 529 with exponential backoff and jitter."}, {"id": "m-mcp", "t": "mcp", "title": "MCP primitives", "prompt": "Match each MCP concept with who controls it or what it does.", "pairs": [["Tools", "Functions the model decides to call"], ["Resources", "Read-only data the application loads into context"], ["Prompts", "Templates the user triggers"], ["stdio", "Local server as a subprocess"], ["Streamable HTTP", "Remote server over the network"]], "note": "Log to stderr on stdio servers, stdout carries the protocol."}, {"id": "m-workflow", "t": "workflows", "title": "Workflow patterns", "prompt": "Match each situation with the best pattern.", "pairs": [["Fixed steps, each uses the previous output", "Prompt chaining"], ["Different kinds of input need different handling", "Routing"], ["Independent subtasks to finish faster", "Parallelization"], ["Subtasks cannot be known in advance", "Orchestrator-workers"], ["A clear rubric and iteration improves quality", "Evaluator-optimizer"]], "note": "Use the simplest pattern that works and measure the gain."}, {"id": "m-cost", "t": "batch", "title": "Cost levers", "prompt": "Match each goal with the best lever.", "pairs": [["Cheaper repeated long prefixes", "Prompt caching"], ["Cheaper non-urgent bulk jobs", "Message Batches API"], ["Cheaper simple high-volume steps", "A smaller model"], ["Faster perceived response", "Streaming"], ["Guaranteed parseable output", "Structured outputs"]], "note": "Batch is 50% off, cache reads cost a fraction of normal input."}, {"id": "m-failure-technique", "t": "prompting", "title": "Failure and missing piece", "prompt": "Match each prompt failure with the piece that is missing.", "pairs": [["Right answer in the wrong shape", "An output constraint"], ["Scope drifts over a long chat", "A more specific system prompt"], ["Task understood but structure invented", "Few-shot examples"], ["Breaks only on a rare variant", "A rule or example covering it"]], "note": "Name the failure type first, then add the one matching technique."}, {"id": "m-memory-scope", "t": "memory", "title": "Memory scope by use case", "prompt": "Match each agent with the memory scope that fits.", "pairs": [["Support agent over two weeks of check-ins", "External storage"], ["File formatter that finishes each job", "Stateless"], ["One long coding session that will not continue", "In-context"], ["Long chat that outgrows the window", "Summarized memory"]], "note": "Choose at design time. Moving state out under production pressure takes far longer."}, {"id": "m-encoding", "t": "multimodal", "title": "How to send the input", "prompt": "Match each input with the best way to send it.", "pairs": [["A reference diagram used in every request", "Files API"], ["A one-off screenshot in a single request", "Inline base64"], ["5,000 feedback records to classify overnight", "Message Batches API"], ["A user waiting for an instant reply", "Synchronous request"]], "note": "Image cost is ceil(width/28) x ceil(height/28) visual tokens."}, {"id": "m-settings", "t": "claude-code", "title": "Where a setting lives", "prompt": "Match each need with the place it belongs.", "pairs": [["Personal tweak for one project, not committed", ".claude/settings.local.json"], ["Team-wide conventions for everyone who clones", ".claude/settings.json"], ["Rule nobody can override", "managed-settings.json"], ["Preference across every project on the machine", "~/.claude/settings.json"]], "note": "A deny rule always wins over an allow rule."}, {"id": "m-hooks", "t": "claude-code", "title": "Hook events", "prompt": "Match each need with the hook event.", "pairs": [["Block a call to a protected path", "PreToolUse"], ["Run a formatter after an edit", "PostToolUse"], ["Validate the environment when a session begins", "SessionStart"], ["Inject context before the model sees a prompt", "UserPromptSubmit"]], "note": "Only PreToolUse can block, by exiting with code 2."}, {"id": "m-mcp-scope", "t": "mcp", "title": "MCP transport and scope", "prompt": "Match each deployment with transport and scope.", "pairs": [["Local SQLite tool for your own machine", "stdio + local scope"], ["Hosted service for the whole team", "HTTP + project scope"], ["Scanner every developer must have", "HTTP + enterprise scope"], ["Experiment this week, not shared", "Local scope"]], "note": "Secrets go in environment variables, never inline in .mcp.json."}, {"id": "m-grader", "t": "evals", "title": "Grader by output shape", "prompt": "Match each output with the grader that fits.", "pairs": [["One correct label", "Exact match"], ["Valid JSON with a required field", "Code-graded check"], ["A paragraph rationale", "LLM-as-judge"], ["Two components passing separately", "Integration test"]], "note": "Calibrate a judge against human labels before trusting it."}, {"id": "m-platforms", "t": "platforms", "title": "Platform and its key trait", "prompt": "Match each platform with what defines it.", "pairs": [["First-party Claude API", "Newest features first"], ["Claude in Amazon Bedrock", "Data stays in the AWS boundary"], ["Claude Platform on AWS", "Anthropic-operated inference, AWS account access"], ["Google Vertex AI", "Google Cloud identity and regional endpoints"]], "note": "Confirm residency per model and platform at build time."}], "S": [{"id": "s-toolerr", "topic": "tooluse", "title": "Tool request rejected with 400", "intro": "An agent works for a few turns, then every request fails with 400: a tool_result does not match a tool_use.", "start": "n1", "lesson": "Every tool_result must answer a tool_use in the immediately preceding assistant message. Keep that turn intact.", "nodes": {"n1": {"q": "What do you inspect first?", "opts": [["The messages array you send: is the assistant turn with the tool_use blocks still there?", "n2", "Right: the history is what the API validates."], ["The API key permissions", "x", "A permission problem would be a 403, not a validation error."], ["The model's temperature", "x", "Sampling settings cannot cause a structural 400."]]}, "n2": {"q": "The history trimming code removed old assistant turns but kept the tool_result messages. What is the fix?", "opts": [["Trim tool_use and its tool_result together, or summarize them as plain text", null, "Correct: pairs must stay together or be removed together."], ["Retry the same request after a pause", "x", "A 400 does not go away by retrying."], ["Raise max_tokens", "x", "The output limit is unrelated."]]}}, "t": "tooluse"}, {"id": "s-cachemiss", "topic": "caching", "title": "The cache never hits", "intro": "A team added cache_control to a long system prompt. The bill did not drop and cache_read_input_tokens is always 0.", "start": "n1", "lesson": "Check the minimum length, exact prefix equality and what changes between requests.", "nodes": {"n1": {"q": "What do you check first?", "opts": [["Whether the prompt is long enough and the cached prefix is byte-identical across requests", "n2", "Right: short prompts are silently not cached, and any change in the prefix misses."], ["Whether streaming is enabled", "x", "Streaming has no influence on caching."], ["Whether the response used end_turn", "x", "The stop reason does not decide caching."]]}, "n2": {"q": "The prompt is long enough, but the first system line contains the current time. What do you do?", "opts": [["Move the changing data after the cached part, for example into the user message", null, "Correct: the stable content must come first."], ["Raise max_tokens", "x", "Unrelated to the prefix."], ["Use a different model for every call", "x", "A different model has its own cache and makes it worse."]]}}, "t": "caching"}, {"id": "s-injection", "topic": "security", "title": "The agent obeys a web page", "intro": "A research agent summarizes web pages. One page contained hidden text telling it to email the user's notes to an outside address, and the agent tried.", "start": "n1", "lesson": "Assume injection can succeed. Limit what the agent can do and keep a human in the loop for sensitive actions.", "nodes": {"n1": {"q": "What type of problem is this?", "opts": [["Indirect prompt injection through third-party content", "n2", "Right: the user is trusted, the page is the attacker."], ["A direct jailbreak by the user", "x", "The user did not write the instruction."], ["A rate limit problem", "x", "No limit was involved."]]}, "n2": {"q": "Which change has the biggest protective effect?", "opts": [["Remove the agent's ability to send email on its own, or require explicit user approval", "n3", "Right: least privilege and human approval cap the damage."], ["Make the system prompt more polite", "x", "A prompt alone is not a control."], ["Increase the effort level", "x", "More reasoning is not access control."]]}, "n3": {"q": "What else should be done with the fetched page content?", "opts": [["Return it inside a tool_result, labelled as untrusted, with a system prompt policy that tool content is data", null, "Correct, and a screening call can be added for high-risk cases."], ["Paste it into the system prompt for more authority", "x", "That gives attacker text the highest authority."], ["Strip all links and trust the rest", "x", "Instructions can hide in plain text."]]}}, "t": "security"}, {"id": "s-truncated", "topic": "stop", "title": "Half-finished JSON", "intro": "A service extracts data with structured outputs. About 2% of responses fail JSON parsing.", "start": "n1", "lesson": "Constrained decoding guarantees valid JSON only for finished outputs. Truncation and refusals still need handling.", "nodes": {"n1": {"q": "What do you look at on the failing responses?", "opts": [["stop_reason: max_tokens or refusal", "n2", "Right: both can produce output that does not match the schema."], ["The HTTP status only", "x", "Both cases return 200."], ["The model's knowledge cutoff", "x", "Unrelated to parsing."]]}, "n2": {"q": "Most failures show max_tokens on long documents. What is the fix?", "opts": [["Raise max_tokens, shorten the output schema, or split the document", null, "Correct."], ["Retry without a schema", "x", "That removes the guarantee."], ["Lower the temperature", "x", "Temperature does not change the length limit."]]}}, "t": "stop"}, {"id": "s-expensive", "topic": "batch", "title": "The bill is too high", "intro": "A nightly job classifies 300,000 documents with the most capable model through synchronous calls. The cost is far above budget.", "start": "n1", "lesson": "Match the model and the delivery mode to the work: small model, batch, caching.", "nodes": {"n1": {"q": "Which change is the biggest and the safest first step?", "opts": [["Test a small model on an eval set for the classification", "n2", "Right: classification is typically a small-model job, and evals tell you whether it holds."], ["Ask the model to answer more briefly in every call", "x", "Output is already short for classification."], ["Add a longer system prompt", "x", "More input tokens increase the cost."]]}, "n2": {"q": "The small model passes the evals. Nobody waits for the results. What next?", "opts": [["Move the job to the Message Batches API and cache the shared instructions", null, "Correct: 50% off plus cheaper repeated prefixes."], ["Keep synchronous calls but add streaming", "x", "Streaming does not reduce price."], ["Split the job into one request per word", "x", "More requests, more overhead."]]}}, "t": "batch"}, {"id": "s-stream-partial", "topic": "stream", "title": "A retry fails after a dropped stream", "intro": "An agent streams its answers. After a network blip, the retry fails with a validation error about a malformed tool_use block.", "start": "n1", "lesson": "A stream ending is not a message completing. Commit a turn only after message_stop.", "nodes": {"n1": {"q": "Where do you look first?", "opts": [["At how the previous streamed turn was committed to history", "n2", "Right: the retry shows the symptom, the cause is upstream."], ["At the tool's input schema", "x", "The schema was fine before the blip."], ["At the temperature setting", "x", "Unrelated to structure."]]}, "n2": {"q": "The handler appends the turn whenever its read loop ends. What is the fix?", "opts": [["Append only after message_stop, discard a partial turn and retry", null, "Correct."], ["Parse each delta immediately to catch errors early", "x", "A single fragment is invalid JSON."], ["Increase max_tokens", "x", "Unrelated."]]}}, "t": "stream"}, {"id": "s-hitl-write", "topic": "agents", "title": "The agent edited a production config", "intro": "A file-editing agent corrected a value, validation passed, and the customer's application started failing.", "start": "n1", "lesson": "The exit condition was scoped to the file. Irreversible actions need a human checkpoint before the write.", "nodes": {"n1": {"q": "What was missing?", "opts": [["A human checkpoint between a valid proposal and the committed write", "n2", "Right: validation only checked the file, not downstream dependents."], ["A longer system prompt about configs", "x", "A prompt is not a control."], ["A higher iteration cap", "x", "The loop ended cleanly after one pass."]]}, "n2": {"q": "Where should the gate go during design?", "opts": [["Before destructive calls, after plans and on unexpected output", null, "Correc function blank(){ return {v:2,q:{},c:{},d:{},s:{},log:{},rec:[],exams:[],conf:1,ses:0}; }

  Object.keys(b.log||{}).forEach(function(k){ var x=a.log[k], y=b.log[k]; if(!x){ a.log[k]=y; } else { Object.keys(y).forEach(function(f){ x[f]=Math.max(x[f]||0,y[f]||0); }); } });

function viewOrder(it){

function viewMatch(it){

// ---------- exam
function buildExam(){
  var order=Object.keys(D.DOMAINS), cnt=D.EXAM.counts, pick=[];
  order.forEach(function(d){ var pool=shuffle(QB.filter(function(q){ return q.d===d; })); pool.sort(function(a,b){ return (S.q[a.id]?1:0)-(S.q[b.id]?1:0); }); pick=pick.concat(pool.slice(0,cnt[d])); });
  return shuffle(pick);
}
function startExam(){
  var qs=buildExam(); E={qs:qs,ans:qs.map(function(){ return -1; }),cur:0,end:Date.now()+D.EXAM.minutes*60000,view:"q"}; E.timer=setInterval(tick,1000);
  run=null; setBack(function(){ if(leave()) go("practice"); }); title("Exam"); renderExam();
}
