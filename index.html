 split into ten smaller prompts"], "a": 1, "e": "Put the stable document at the front with the breakpoint so later requests read it from the cache.", "w": "A — a varying prefix never matches. C — repeats tokens and breaks caching. D — loses the shared context."}, {"id": 2202948888, "d": "model", "t": "caching", "q": "What is the effect of a cache hit on the price of the cached tokens?", "o": ["The same price as normal uncached input", "They are free of charge for the call", "Twice the base input price per token", "A small fraction of the base input price"], "a": 3, "e": "Reads cost 0.1x of the base price by default, and 0.05x on Opus 5.5 and Sonnet 5.5.", "w": "B — not free. C — that is the 1-hour write. A — that is the uncached price."}, {"id": 991708479, "d": "model", "t": "caching", "q": "What does cache_creation_input_tokens show in the usage object?", "o": ["Tokens rejected before reaching the model", "Tokens written to the cache by this call", "Tokens read from the cache on this call", "Tokens saved by sending the call in a batch"], "a": 1, "e": "<code>cache_creation_input_tokens<\/code> counts tokens written, <code>cache_read_input_tokens<\/code> counts tokens read.", "w": "C — that is cache_read_input_tokens. A — no such measure. D — unrelated to batching."}, {"id": 265661104, "d": "model", "t": "caching", "q": "After a prompt change, cache hits dropped to zero. What is the most likely reason?", "o": ["The change was inside the cached prefix", "The cache storage for your org was full", "The model forgot the earlier prompt text", "The previous response ended with end_turn"], "a": 0, "e": "Any change inside the prefix breaks an exact match. Stable parts should come first.", "w": "B — no such limit applies to your prompt. C — models keep nothing. D — the stop reason is unrelated."}, {"id": 2308272748, "d": "model", "t": "caching", "q": "Which element can you place after the last cache breakpoint without hurting the cache?", "o": ["The system prompt edited per user", "A tool definition that changes daily", "The new user question of this request", "The tool_choice setting"], "a": 2, "e": "Content after the final breakpoint is processed normally. Changes before it invalidate the cache.", "w": "B — tools are at the start of the prefix. A — system comes before messages. D — changes to tool_choice invalidate system and tools."}, {"id": 2167872835, "d": "model", "t": "caching", "q": "A team enables the 1-hour TTL for a prompt used once a week. What is the result?", "o": ["They get cache hits all week long", "The cache refreshes itself every week", "They pay nothing for the cache writes", "They pay the write cost and get no hits"], "a": 3, "e": "A cache that expires before the next use is wasted money. Match the TTL to the reuse pattern.", "w": "A — it expires after an hour. C — writes cost 2x. B — no automatic refresh exists."}, {"id": 3899477975, "d": "model", "t": "caching", "q": "Can thinking blocks carry a cache_control marker directly?", "o": ["Only for requests sent in batch mode", "Yes, every block can carry the marker", "Only when the 1-hour TTL is selected", "No, they are cached within the prefix"], "a": 3, "e": "Thinking blocks cannot be marked directly, but they become part of the cached prefix.", "w": "B — not allowed for thinking blocks. C — TTL does not change it. A — batch is unrelated."}, {"id": 2911747518, "d": "model", "t": "caching", "q": "Why does a long conversation benefit from automatic caching?", "o": ["The breakpoint moves forward with each turn", "The model gets smarter as the chat goes on", "Old turns are deleted from history for free", "Input tokens are billed once per day only"], "a": 0, "e": "Automatic caching places the breakpoint on the last cacheable block and moves it as the conversation grows.", "w": "C — nothing is deleted. B — models do not learn in-session. D — billing is per request."}, {"id": 2294068975, "d": "model", "t": "batch", "q": "Which pairing of features can cut the cost of a bulk job the most?", "o": ["Batch API plus a shared cached prefix", "More retries plus backoff", "Streaming plus higher effort", "A bigger model plus longer prompts"], "a": 0, "e": "Batch gives 50% off, and cache reads make the shared instructions cheap.", "w": "C — raises cost. D — raises cost. B — retries do not lower cost."}, {"id": 2504581074, "d": "model", "t": "batch", "q": "A batch result for one request has type expired. What does it mean?", "o": ["It was blocked by a safety filter", "It was not processed within 24 hours", "Its custom_id was a duplicate of another", "Its response was too long to store"], "a": 1, "e": "Batches expire after 24 hours. Unprocessed requests are reported as expired and can be resubmitted.", "w": "A — that would be an error or a refusal. C — duplicates are rejected on creation. D — truncation shows in stop_reason."}, {"id": 240692507, "d": "model", "t": "batch", "q": "How long do finished batch results stay downloadable?", "o": ["24 hours after completion", "Forever", "7 days after completion", "29 days after creation"], "a": 3, "e": "Results are available for 29 days from batch creation.", "w": "A — that is the processing window. C — wrong number. B — not forever."}, {"id": 3252196592, "d": "model", "t": "batch", "q": "Which is a good reason to split one huge batch into several?", "o": ["Smaller batches are billed less per token", "Batches cannot use system prompts", "Batches cannot use more than one model", "Limits of 100,000 requests or 256 MB per batch"], "a": 3, "e": "A batch holds up to 100,000 requests or 256 MB, whichever is reached first.", "w": "C — one model per batch is fine, all requests can share it. B — system prompts are allowed. A — the discount is the same."}, {"id": 2175376710, "d": "agents", "t": "agents", "q": "An agent must read 200 files to answer one question. Which design protects the main context?", "o": ["Paste all 200 files into one message", "Lower the temperature for the whole run", "Ask the user to pick which files matter", "Sub-agents summarize batches of files"], "a": 3, "e": "Sub-agents work in separate contexts and return short results to the orchestrator.", "w": "A — exhausts the window. C — shifts work to the user. B — unrelated."}, {"id": 2426255863, "d": "agents", "t": "agents", "q": "What does an agent do differently from a fixed workflow?", "o": ["It ignores the system prompt entirely", "It never calls any tools during the task", "It chooses its own next step at run time", "It always uses exactly one single request"], "a": 2, "e": "Workflows follow code-defined paths. Agents let the model direct the process.", "w": "B — agents use tools. D — they loop. A — the system prompt defines the goal."}, {"id": 3595162717, "d": "agents", "t": "agents", "q": "A coding agent should never delete production data on its own. What is the strongest control?", "o": ["Tell it in the prompt never to delete data", "Do not give it that permission at all", "Lower the effort setting of the agent", "Log every deletion after it has happened"], "a": 1, "e": "Remove the capability. Instructions can fail, permissions cannot be talked around.", "w": "A — a prompt is not enforcement. D — after the harm. C — unrelated."}, {"id": 4290736628, "d": "agents", "t": "agents", "q": "An agent task can run for hours. How should progress survive a crash?", "o": ["Checkpoint state outside the model", "Keep everything in the context window", "Rely on the model to remember the state", "Restart from the first step each time"], "a": 0, "e": "Store state in your own system so a restart resumes instead of repeating or losing work.", "w": "B — lost on crash. D — repeats side effects. C — models are stateless."}, {"id": 324700297, "d": "agents", "t": "agents", "q": "Which question helps decide whether to use an agent instead of a workflow?", "o": ["Is the end user a developer or not?", "Does the task involve any text at all?", "Can the steps be listed in advance?", "Is streaming enabled on the account?"], "a": 2, "e": "If the path is predictable, a workflow is simpler, cheaper and easier to test.", "w": "B — nearly everything does. A — irrelevant. D — irrelevant."}, {"id": 2645390794, "d": "agents", "t": "agents", "q": "Which log entry is most useful for debugging a failed agent run?", "o": ["Only the final answer shown to the user", "Every prompt, tool call, result, stop reason", "Only the very first message of the user", "Only the token counts of each request"], "a": 1, "e": "A full trace shows where the reasoning or tooling went wrong.", "w": "A — hides the cause. D — shows cost, not behavior. C — too little."}, {"id": 3264236704, "d": "agents", "t": "agents", "q": "An agent keeps asking the same tool the same question. What is a sensible guard?", "o": ["Detect repeated calls, then stop or adapt", "Switch the agent to the cheapest model", "Disable all of the tools for the agent", "Raise max_tokens so the agent can continue"], "a": 0, "e": "Loop detection plus iteration limits prevent wasted spend.", "w": "D — does not stop repetition. C — removes capability. B — may worsen quality."}, {"id": 1953943901, "d": "agents", "t": "agents", "q": "What is the right moment to ask the user a clarifying question in an agent flow?", "o": ["Only after the whole task has failed once", "When the request is ambiguous and a guess is costly", "Never, an agent should always just guess", "Before every single tool call it makes"], "a": 1, "e": "Ask when ambiguity could cause wrong or irreversible work. Do not interrupt for trivial choices.", "w": "D — too noisy. C — risky. A — too late."}, {"id": 467710941, "d": "agents", "t": "workflows", "q": "A pipeline first extracts facts and then writes a summary from them. Which pattern is this?", "o": ["Routing", "Orchestrator-workers", "Prompt chaining", "Voting"], "a": 2, "e": "Each step uses the previous output in a fixed sequence.", "w": "A — routing branches by input type. D — voting repeats one task. B — workers are planned dynamically."}, {"id": 2336843994, "d": "agents", "t": "workflows", "q": "Running the same classification three times and taking the majority is an example of:", "o": ["Evaluator-optimizer loop", "Routing by category", "Parallelization by voting", "Prompt chaining"], "a": 2, "e": "Voting runs the same task several times for higher confidence.", "w": "D — sequential steps. B — branches by category. A — critic and rewrite loop."}, {"id": 2959524489, "d": "agents", "t": "workflows", "q": "Which signal suggests adding an evaluator-optimizer loop?", "o": ["Inputs from five different customer types", "Clear criteria and drafts that improve", "A task whose subtasks are unknown upfront", "Independent subtasks that must finish fast"], "a": 1, "e": "A loop pays off when a critic can judge against a rubric and revisions help.", "w": "A — routing. D — parallelization. C — orchestrator-workers."}, {"id": 2938023422, "d": "agents", "t": "workflows", "q": "Why use a small model as a router?", "o": ["Routing needs no prompt", "Classifying the input is simple and cheap", "Small models cannot be wrong", "Small models are always more accurate"], "a": 1, "e": "Routing is classification, a good fit for the fastest, cheapest tier.", "w": "D — not always. A — it needs clear categories. C — they can be wrong."}, {"id": 933810752, "d": "agents", "t": "workflows", "q": "An orchestrator delegates to workers. What is a key risk?", "o": ["The orchestrator cannot see the results", "Cost and complexity grow with delegation", "Workers are not able to use any tools", "Workers must all use the very same model"], "a": 1, "e": "More calls mean more tokens and harder debugging. Use only when subtasks are unpredictable.", "w": "C — they can. A — results come back. D — models can differ."}, {"id": 822835613, "d": "agents", "t": "workflows", "q": "A validation step between two LLM calls checks the JSON of the first. What is it called in workflow design?", "o": ["A router", "A gate", "A worker", "A cache"], "a": 1, "e": "Gates validate intermediate output so errors do not compound.", "w": "A — routes by category. C — executes subtasks. D — stores prefixes."}, {"id": 3343723045, "d": "agents", "t": "agents", "q": "Which of these best describes the human-in-the-loop checkpoint?", "o": ["A pause for approval before a risky step", "A retry of the call after a timeout", "A prompt that sounds extra polite", "A fallback to a smaller model on error"], "a": 0, "e": "Show what will happen and let a person approve or reject.", "w": "C — wording only. D — a cost tactic. B — a reliability tactic."}, {"id": 642660962, "d": "prompt", "t": "prompting", "q": "Which instruction is most likely to be followed reliably?", "o": ["Answer in whatever way feels the best", "Be short but complete but also thorough", "Do your best and use no particular limit", "Reply in two sentences using plain words"], "a": 3, "e": "Specific, measurable and consistent instructions work best. Contradictions confuse the model.", "w": "B — contradictory. C — vague. A — vague."}, {"id": 1760281395, "d": "prompt", "t": "prompting", "q": "What is a good use of a role in the system prompt?", "o": ["A specific role such as a support analyst", "The exact version number of the model", "Only the current date and the time zone", "Only that you are a helpful assistant"], "a": 0, "e": "A specific role focuses behavior and tone more than a generic one.", "w": "D — generic. B — not helpful. C — useful, but not a role."}, {"id": 2686515608, "d": "prompt", "t": "prompting", "q": "Few-shot examples in a prompt mainly help to:", "o": ["Switch on the thinking mode of the model", "Reduce the cost per token of the call", "Raise the context window of the model", "Show the exact format and style wanted"], "a": 3, "e": "Examples demonstrate the target output. Use diverse, relevant ones wrapped in tags.", "w": "C — fixed. B — they add tokens. A — unrelated."}, {"id": 1873418177, "d": "prompt", "t": "prompting", "q": "Examples in a prompt all share one unusual feature, and every answer now has it. What is the lesson?", "o": ["XML tags around examples cause copying", "Few-shot prompting never really works", "The temperature of the call is too low", "Examples are copied closely, so vary them"], "a": 3, "e": "Models imitate examples strongly. Use diverse examples that differ in irrelevant ways.", "w": "B — it works well. C — unrelated. A — tags are not the cause."}, {"id": 1046015042, "d": "prompt", "t": "prompting", "q": "Why ask Claude to think before the final answer on a hard problem?", "o": ["It prevents the model from refusing a task", "Reasoning improves accuracy on hard tasks", "It makes the response cheaper to produce", "It removes the need for any further tests"], "a": 1, "e": "Allow reasoning (thinking or step by step), then request a concise final answer.", "w": "C — it costs more tokens. D — tests are still needed. A — unrelated."}, {"id": 3582221988, "d": "prompt", "t": "prompting", "q": "A prompt asks for JSON but sometimes adds a sentence before the JSON. What is the most robust fix?", "o": ["Use structured outputs", "Ask politely again", "Add the word JSON ten times", "Lower the max_tokens"], "a": 0, "e": "Structured outputs constrain the text to the schema. Prompt-only methods are best effort.", "w": "B — no guarantee. C — no guarantee. D — would truncate."}, {"id": 1120102065, "d": "prompt", "t": "prompting", "q": "Which change usually improves a vague prompt the most?", "o": ["Make it much longer with repeated phrases", "Write the whole prompt in capital letters", "State the task, audience and format", "Remove most of the surrounding context"], "a": 2, "e": "Clarity beats length. Tell Claude what good looks like.", "w": "A — repetition adds noise. B — emphasis is weak. D — context is needed."}, {"id": 1035877718, "d": "prompt", "t": "prompting", "q": "Which is a reasonable way to keep prompt changes safe?", "o": ["Edit the prompts live in production", "Never change a prompt that works today", "Version prompts and run evals first", "Let each developer keep a private copy"], "a": 2, "e": "Treat prompts as code: review, version, test.", "w": "A — risky. D — drift. B — blocks improvement."}, {"id": 1451839496, "d": "prompt", "t": "context", "q": "Which info belongs in a long-term memory store for a coding agent?", "o": ["Every raw tool output that was returned", "Random notes without any clear purpose", "The user's passwords and access tokens", "Project conventions and earlier decisions"], "a": 3, "e": "Store durable, useful facts. Never store secrets or noise.", "w": "A — bloat. C — never store secrets. B — noise."}, {"id": 147790889, "d": "prompt", "t": "context", "q": "A conversation includes 10 large tool results that are no longer needed. What helps the context budget?", "o": ["Raising the temperature of the requests", "Adding even more tools to the agent", "Switching the conversation over to batch", "Context editing or summarizing old results"], "a": 3, "e": "Stale tool results waste tokens. Clear or summarize them.", "w": "A — unrelated. C — unrelated. B — adds tokens."}, {"id": 1627408434, "d": "prompt", "t": "context", "q": "What is a risk of putting too many irrelevant documents into the prompt?", "o": ["The API rejects the request at once", "The model becomes slower to learn", "Cost rises and answer quality can drop", "Citations stop working"], "a": 2, "e": "Context is a budget. Retrieve what is relevant, not everything.", "w": "A — it only fails past the window. B — models do not learn in context. D — citations still work."}, {"id": 3314550601, "d": "prompt", "t": "context", "q": "A retrieval system returns 8 chunks. How should they be given to Claude?", "o": ["In the system prompt as rules", "As tagged documents with source names", "As the assistant's previous reply", "As one unlabeled paragraph"], "a": 1, "e": "Label sources so Claude can cite and separate data from instructions.", "w": "D — loses structure. A — gives data authority. C — misuses the assistant role."}, {"id": 1532170260, "d": "prompt", "t": "context", "q": "Where does Claude's knowledge of your private data come from during a chat?", "o": ["From training on your own usage data", "From past conversations of other users", "From the API key used for the request", "Only what you put in the request or tools"], "a": 3, "e": "The model has no access to your data unless you provide it in the context or through tools.", "w": "B — no cross-user memory. A — requests are not used this way by default. C — a key only authenticates."}, {"id": 971781158, "d": "prompt", "t": "context", "q": "A support bot answers using a 500-page manual. Which approach scales best?", "o": ["Fine-tune the model every single week", "Paste the whole manual into every prompt", "Ask Claude to recall the manual by heart", "Retrieve relevant sections per question"], "a": 3, "e": "Retrieval keeps prompts small and the answers current.", "w": "B — costly. A — slow. C — the manual is not in the model."}, {"id": 1765071890, "d": "prompt", "t": "context", "q": "What should happen to untrusted retrieved text in the prompt?", "o": ["Treat it as part of the system rules", "Put it in tagged data blocks, not rules", "Merge it into the user's question text", "Hide where the text came from entirely"], "a": 1, "e": "Separate data from instructions and keep the source visible.", "w": "A — dangerous. D — hides context. C — mixes roles."}, {"id": 1767599531, "d": "prompt", "t": "prompting", "q": "When Claude ignores a formatting rule, what should you check first?", "o": ["The request id of the response headers", "Whether another instruction contradicts it", "The release date of the model snapshot", "The API version header of the request"], "a": 1, "e": "Contradictions and missing examples are common causes.", "w": "C — unrelated. D — unrelated. A — unrelated."}, {"id": 1034924403, "d": "prompt", "t": "context", "q": "Why place the instructions after a very long document?", "o": ["It saves a few tokens from the request", "It switches off prompt caching entirely", "The API rejects questions placed up front", "Queries at the end improve long-input quality"], "a": 3, "e": "Put long data first and the question last.", "w": "C — not required. A — same tokens. B — caching is unaffected."}, {"id": 2077047977, "d": "tools", "t": "tooluse", "q": "Where do the parameters of a tool call from Claude come from?", "o": ["They are copied from the previous tool call", "Your server sends them before the call", "The API fills them from account settings", "Claude generates them from your input_schema"], "a": 3, "e": "Claude produces the <code>input<\/code> object of the tool_use block according to the schema you defined.", "w": "C — nothing is filled from account settings. B — the server does not pre-send arguments. A — each call is generated again."}, {"id": 132582837, "d": "tools", "t": "tooluse", "q": "What does is_error true on a tool_result tell Claude?", "o": ["The tool_use id was not valid anymore", "The tool failed and the content explains why", "The next request should use another model", "The conversation must stop immediately"], "a": 1, "e": "Claude can read the message and retry, change arguments or explain the problem to the user.", "w": "D — nothing forces a stop. A — ids are checked by the API, not signalled this way. C — models are not switched."}, {"id": 985413903, "d": "tools", "t": "tooluse", "q": "Claude never calls a tool you expected, and answers from memory instead. What is the best first step?", "o": ["Increase max_tokens so it can decide later on", "Move the tool to the end of the tools array", "Improve the tool description and its usage hint", "Rename the tool to a much longer name"], "a": 2, "e": "The description tells Claude when the tool applies. You can also require it with tool_choice.", "w": "A — output length does not decide tool use. D — a long name is not a better description. B — order has little effect."}, {"id": 2084483169, "d": "tools", "t": "tooluse", "q": "How can an application stop Claude from calling more than one tool in a single turn?", "o": ["Ask for short answers in the system prompt", "Set disable_parallel_tool_use in tool_choice", "Lower the temperature of the request to zero", "Define only one property in each input_schema"], "a": 1, "e": "<code>tool_choice: {type: auto, disable_parallel_tool_use: true}<\/code> limits Claude to at most one call per turn.", "w": "D — schema size does not limit the call count. C — temperature does not control it. A — answer length is a different matter."}, {"id": 1940648773, "d": "tools", "t": "tooluse", "q": "What should a tool return when a search finds nothing?", "o": ["An error that stops the whole conversation", "A made-up result so Claude can continue", "A clear empty result that says nothing matched", "Nothing, so that no tool_result is sent"], "a": 2, "e": "An explicit empty result lets Claude try another query or tell the user. Every tool_use needs a tool_result.", "w": "A — an empty result is not a failure. B — fabricated data misleads the model. D — a missing result makes the next request invalid."}, {"id": 3185734678, "d": "tools", "t": "tooluse", "q": "Which tool type runs entirely inside Anthropic's infrastructure?", "o": ["The bash tool", "A function you define", "The text editor tool", "Web search"], "a": 3, "e": "Server tools such as web search, web fetch and code execution run on Anthropic's side. Bash and text editor are client tools you execute.", "w": "B — your own functions run in your app. A — bash is executed by your code. C — edits are applied by your code."}, {"id": 2777183368, "d": "tools", "t": "tooluse", "q": "What is the role of the tool_use id?", "o": ["It selects which tool should run next", "It links a tool_result to the call it answers", "It stores the tool arguments for later reuse", "It signs the call so it cannot be changed"], "a": 1, "e": "Each <code>tool_result<\/code> carries the matching <code>tool_use_id<\/code>.", "w": "A — the name selects the tool. C — ids hold no arguments. D — ids are not signatures."}, {"id": 4268797110, "d": "tools", "t": "tooluse", "q": "A tool returns a huge HTML page. What is the best change?", "o": ["Return only the relevant text in compact form", "Send the page in the system prompt instead", "Split the page into many assistant messages", "Raise max_tokens to the largest allowed value"], "a": 0, "e": "Tool output uses context tokens. Trim and structure it for what Claude needs.", "w": "D — output limit is not the problem. B — gives untrusted text authority. C — misuses the assistant role."}, {"id": 565072687, "d": "tools", "t": "mcp", "q": "Which side of an MCP connection exposes tools and resources?", "o": ["The server", "The model provider", "The user's browser", "The host application"], "a": 0, "e": "Servers expose capabilities. Clients connect from the host application and relay them to the model.", "w": "D — hosts contain the clients. B — the model only sees what the client passes. C — not part of the protocol roles."}, {"id": 37210180, "d": "tools", "t": "mcp", "q": "A team writes an MCP server in Python. What do the function docstring and type hints become?", "o": ["The server's authentication rules", "Comments that the client ignores", "The list of allowed users", "The tool description and input schema"], "a": 3, "e": "SDKs such as FastMCP derive the tool description and schema from the function definition.", "w": "B — they are used. A — authentication is separate. C — access control is separate."}, {"id": 2381291202, "d": "tools", "t": "mcp", "q": "Which tool helps you test and debug an MCP server interactively?", "o": ["The MCP Inspector", "The batch endpoint", "The models list endpoint", "The token counting endpoint"], "a": 0, "e": "The Inspector lets you call tools, read resources and see messages during development.", "w": "B — not for MCP. D — only counts tokens. C — lists models."}, {"id": 3022437592, "d": "tools", "t": "mcp", "q": "An MCP server needs a database password. Where should it be stored?", "o": ["In the messages sent to the model", "In the tool description for Claude to read", "In an environment variable or a secret store", "In the resource list of the server"], "a": 2, "e": "Never place secrets where the model or the logs can see them. Keep credentials outside the prompt path.", "w": "B — exposes it to the model. D — resources are exposed content. A — messages are visible to the model."}, {"id": 1791326258, "d": "tools", "t": "mcp", "q": "Which MCP primitive would you use to give a user a reusable slash-command-like template?", "o": ["A transport", "A prompt", "A resource", "A tool"], "a": 1, "e": "Prompts are templates the user chooses. Tools are model-controlled and resources are application-controlled.", "w": "D — model-controlled. C — data. A — a connection mechanism."}, {"id": 3313960059, "d": "tools", "t": "mcp", "q": "What is the main risk of connecting an unknown third-party MCP server?", "o": ["It changes the training data of the model", "It will make the model slower to start up", "Its tools may read data or act unexpectedly", "It switches off prompt caching for requests"], "a": 2, "e": "Treat servers like third-party code: review tools, apply least privilege and require confirmation for risky actions.", "w": "B — not the main concern. A — nothing is trained. D — unrelated."}, {"id": 3609714788, "d": "tools", "t": "tooluse", "q": "Why is the order of tool_result blocks inside the user message important?", "o": ["They must be sorted alphabetically by tool name", "They must alternate with assistant text blocks", "They must be placed after the system prompt", "They must come before any other text there"], "a": 3, "e": "Put <code>tool_result<\/code> blocks first, then optional text.", "w": "A — no sorting rule exists. C — the system prompt is a separate parameter. B — they sit in one user message."}, {"id": 2394712538, "d": "tools", "t": "tooluse", "q": "Which design makes tool selection easier for Claude?", "o": ["One tool that accepts any free text", "Tools named with random short codes", "Few tools with clearly different purposes", "Many tools with almost the same description"], "a": 2, "e": "Distinct, well-described tools reduce confusion and token cost.", "w": "D — overlap causes wrong picks. A — hides the structure. B — names carry meaning for the model."}, {"id": 3261758052, "d": "sec", "t": "security", "q": "Which source of text is the most dangerous for indirect prompt injection?", "o": ["The system prompt written by your team", "A web page fetched by an agent tool", "A reviewed internal style guide", "A constant defined in your code"], "a": 1, "e": "Third-party content can be written by an attacker. Treat it as data.", "w": "A — controlled by you. D — controlled by you. C — reviewed and trusted."}, {"id": 3144513655, "d": "sec", "t": "security", "q": "A summarizing agent is allowed to call a send_email tool. What is the best way to reduce injection risk?", "o": ["Raise the effort level of the agent", "Log the sent emails every night", "Remove the tool or require approval for each send", "Tell the agent in bold never to send emails"], "a": 2, "e": "Capabilities should match the task. Sensitive actions need explicit user approval.", "w": "D — a prompt is not enforcement. A — more reasoning is not control. B — detects harm after it happened."}, {"id": 1143153802, "d": "sec", "t": "security", "q": "A system prompt contains a secret API key so the model can use a service. What is wrong?", "o": ["Keys use too many tokens", "The API rejects prompts that contain keys", "Keys in prompts make caching impossible", "The model and its output can reveal the key"], "a": 3, "e": "Never put secrets in prompts. Call services from your code or tools and keep the key outside the model's context.", "w": "C — caching is not the issue. B — the API does not scan for keys. A — token use is not the problem."}, {"id": 2976735432, "d": "sec", "t": "security", "q": "Why should logs of prompts and answers be handled carefully?", "o": ["They can contain personal data and secrets", "Logs void the model's safety features", "Logs are not allowed by the API", "Logs make the API slower"], "a": 0, "e": "Apply retention limits, masking and access control to anything that stores user content.", "w": "D — logging is on your side. B — unrelated. C — logging is allowed and recommended."}, {"id": 340128480, "d": "sec", "t": "security", "q": "A jailbreak attempt appears in user chat input. Which layer helps most before the main call?", "o": ["A small model screening the input", "A lower temperature", "A longer answer from the main model", "A higher max_tokens value"], "a": 0, "e": "A harmlessness screen with a cheap model and a structured verdict filters obvious attacks.", "w": "C — unrelated. D — unrelated. B — does not block attacks."}, {"id": 1172553912, "d": "sec", "t": "security", "q": "What does least privilege mean for an agent with database access?", "o": ["Admin rights so that it never fails a task", "Read access only to the tables it needs", "One shared admin account for all the agents", "Write access now, with logging done later on"], "a": 1, "e": "Limit scope so a successful attack can do little damage.", "w": "A — maximal damage. C — no accountability. D — after the fact."}, {"id": 2745428726, "d": "sec", "t": "security", "q": "Which handling of a refusal is best in a customer-facing app?", "o": ["Retry the same request ten times", "Switch to a larger model automatically", "Show a clear message and offer a safe next step", "Hide the response and show a blank screen"], "a": 2, "e": "Refusals are valid outcomes. Communicate clearly instead of looping.", "w": "A — likely to refuse again. D — confusing. B — a fallback may be reasonable but not automatic for every refusal."}, {"id": 196459277, "d": "sec", "t": "security", "q": "A web app lets users upload documents that Claude summarizes. Which is the right mental model for the document text?", "o": ["Trusted configuration written by the app", "Untrusted data that may contain instructions", "System instructions with high priority", "Private text that cannot influence the model"], "a": 1, "e": "Uploaded text may carry hidden instructions. Tag it as data and limit what the agent can do.", "w": "A — users can write anything. C — documents are not system instructions. D — anything in context can influence the model."}, {"id": 1077122677, "d": "sec", "t": "security", "q": "Which practice helps comply with data minimization when calling Claude?", "o": ["Send only needed fields and mask identifiers", "Send the whole customer record for context", "Ask the users to share passwords for speed", "Store the full prompts forever for debugging"], "a": 0, "e": "Less personal data in prompts means less exposure.", "w": "B — more data than needed. D — long retention increases risk. C — never collect passwords this way."}, {"id": 1277204935, "d": "sec", "t": "security", "q": "How should JSON-encoding help with untrusted tool output?", "o": ["It marks boundaries so text cannot act as rules", "It removes every malicious word from the text", "It makes the output smaller and cheaper", "It lets the model skip its safety checks"], "a": 0, "e": "Escaping gives unambiguous delimiters between data and the surrounding structure.", "w": "C — size is unchanged. B — it does not filter words. D — safety checks are unaffected."}, {"id": 175436721, "d": "sec", "t": "security", "q": "Which statement about monitoring a deployed agent is correct?", "o": ["Users will always report attacks themselves", "Monitoring is only needed before launch", "Sample outputs and alert on unusual tool use", "Logs make attacks impossible"], "a": 2, "e": "Continuous monitoring finds successful injections and drift so you can refine defenses.", "w": "B — risks appear after launch. D — logs only help detection. A — many attacks stay invisible to users."}, {"id": 4145568207, "d": "sec", "t": "security", "q": "Model output will be shown in a web page. What is required before rendering it?", "o": ["Lower the temperature", "Escape or sanitize it like any untrusted input", "Add the word safe to the prompt", "Nothing, the model always writes safe HTML"], "a": 1, "e": "Model text can contain scripts or markup, so treat it as untrusted to avoid cross-site scripting.", "w": "D — not guaranteed. C — a prompt is not a sanitizer. A — unrelated."}, {"id": 3767336719, "d": "cc", "t": "claude-code", "q": "Where can personal Claude Code preferences that apply to all your projects be stored?", "o": ["In the model's own system prompt on the server", "Only in each repository's CLAUDE.md file", "Inside the configuration of the CI pipeline", "In your user-level settings under the home folder"], "a": 3, "e": "User-level files apply across projects. Project files are shared with the team.", "w": "B — project file is shared per repository. A — not editable by users. C — unrelated to personal setup."}, {"id": 77870704, "d": "cc", "t": "claude-code", "q": "A team wants Claude Code to run tests automatically after each edit. Which feature fits best?", "o": ["A different permission mode", "A sub-agent that only reads files", "A hook triggered after file edits", "A longer CLAUDE.md file"], "a": 2, "e": "Hooks run your commands at lifecycle events, which makes the behavior deterministic.", "w": "D — advice only. B — cannot run tests. A — controls approvals, not triggers."}, {"id": 798587434, "d": "cc", "t": "claude-code", "q": "What is plan mode in Claude Code used for?", "o": ["Running code faster while using less memory", "Skipping all of the permission checks", "Turning off every configured hook for a while", "Exploring and planning without any changes"], "a": 3, "e": "Plan mode keeps Claude read-only while it explores and proposes a plan for approval.", "w": "A — not its purpose. B — it does the opposite. C — unrelated."}, {"id": 1306187958, "d": "cc", "t": "claude-code", "q": "How can Claude Code be used inside a CI pipeline?", "o": ["It cannot run without a person being present", "Only by typing into a terminal by hand", "Only through the desktop application window", "In headless mode with claude -p or the SDK"], "a": 3, "e": "Headless mode and the Agent SDK run Claude Code from scripts.", "w": "C — scripts can call it. B — automation is supported. A — it can run unattended."}, {"id": 2465989328, "d": "cc", "t": "claude-code", "q": "What is a skill in Claude Code?", "o": ["A list of commands that are always banned", "A hardware key used for authentication", "A model setting that gives faster output", "A folder of instructions Claude loads on demand"], "a": 3, "e": "Skills package reusable know-how that Claude pulls in when the task matches.", "w": "B — unrelated. C — unrelated. A — that is a deny rule."}, {"id": 4010775424, "d": "cc", "t": "claude-code", "q": "Which habit gives the best results when working with Claude Code?", "o": ["Never review the changes", "Keep one huge conversation for all tasks", "Plan first, implement, then verify with tests", "Ask for the whole app in one prompt"], "a": 2, "e": "Give Claude a way to check its work and clear context between unrelated tasks.", "w": "D — large unfocused tasks fail more often. A — review is essential. B — context bloat hurts quality."}, {"id": 175132291, "d": "eval", "t": "evals", "q": "What should an eval set contain besides typical cases?", "o": ["Only examples the prompt already passes", "Edge cases and past production failures", "Only the easiest examples", "Random text unrelated to the task"], "a": 1, "e": "Evals should reflect real difficulty. Add every new failure so it stays fixed.", "w": "C — hides weaknesses. A — no signal. D — no value."}, {"id": 338815610, "d": "eval", "t": "evals", "q": "Which grader type is fastest and cheapest for checking that output matches a schema?", "o": ["A customer survey", "A human reviewer", "An LLM judge with a rubric", "A code-based grader"], "a": 3, "e": "Deterministic checks (schema, exact match, tests) are cheap and reliable where they apply.", "w": "B — slow. C — slower and costlier. A — too slow and noisy."}, {"id": 39821988, "d": "eval", "t": "evals", "q": "Why compare scores per category instead of only the overall average?", "o": ["Category scores are free of charge", "An average can hide a drop in one category", "Categories are required by the API", "Averages are always wrong about quality"], "a": 1, "e": "Break results down so a drop in one area is not masked by gains elsewhere.", "w": "C — not required. D — averages are useful. A — no such rule."}, {"id": 1511673021, "d": "eval", "t": "evals", "q": "Production monitoring shows more refusals after a prompt change. What is the best first step?", "o": ["Remove the monitoring to avoid the alerts", "Raise max_tokens for every single request", "Switch the model name at random each day", "Inspect sampled traces and compare with evals"], "a": 3, "e": "Use traces to find what changed and reproduce it on evals.", "w": "A — hides the issue. B — unrelated. C — adds variables."}, {"id": 864824421, "d": "eval", "t": "evals", "q": "When using Claude as a judge, what should you do before trusting its scores?", "o": ["Compare its verdicts with human labels on a sample", "Ask it to be extremely strict", "Skip the rubric to avoid bias", "Use the same prompt for generation and grading"], "a": 0, "e": "Calibrate the judge against human judgment and keep the rubric specific.", "w": "D — shares blind spots. B — vague instruction. C — a rubric is needed."}, {"id": 2950515089, "d": "app", "t": "api", "q": "A team estimates the cost of a feature by counting the words in its prompts. What is the better habit?", "o": ["Count characters and apply one fixed ratio", "Count words and multiply by a fixed factor", "Count tokens, since that is what the API bills", "Count requests, because pricing is per call"], "a": 2, "e": "Tokens are the unit of input, output and cost. Estimate in tokens, not words.", "w": "A — a fixed ratio is model-dependent. B — the same problem as characters. D — pricing is per token, not per request."}, {"id": 1848653875, "d": "app", "t": "api", "q": "Why is a characters-per-token rule of thumb unreliable?", "o": ["Images change the ratio for all text in the request", "Tokens are always exactly one word each in every model", "It depends on the tokenizer and changes by model generation", "The API converts text to tokens only after billing it"], "a": 2, "e": "Tokenizers differ between models and generations. Count tokens with the counting endpoint.", "w": "B — tokens are pieces of text, not words. D — conversion happens before processing. A — images do not change how text is tokenized."}, {"id": 1081184528, "d": "app", "t": "api", "q": "A request has an input that is larger than the whole context window. What happens?", "o": ["It waits in a queue until a larger model is free", "Claude drops the oldest messages and still answers", "It is rejected with a validation error before generation", "It is cut and answered with stop_reason max_tokens"], "a": 2, "e": "An oversized input never starts generating. Your application must trim or summarize history first.", "w": "B — nothing is dropped silently. D — max_tokens is an output limit. A — no such queue exists."}, {"id": 3251110410, "d": "app", "t": "stop", "q": "A request fits on input, but generation reaches the end of the context window. What does a current model return?", "o": ["A normal end_turn with the answer marked complete", "An error, and the partial output is discarded", "A second window that continues without any notice", "Partial output, stop reason model_context_window_exceeded"], "a": 3, "e": "Current models stop and return what they generated so far with <code>model_context_window_exceeded<\/code>.", "w": "B — the partial output is returned, not discarded. C — there is no second window. A — the stop reason says otherwise."}, {"id": 2927544902, "d": "app", "t": "api", "q": "A long session works in development but fails in production. What is the most likely reason?", "o": ["Real inputs and more turns fill the fixed window faster", "Production uses a smaller window than development does", "Production models forget turns after a time limit", "Tool definitions are removed from production requests"], "a": 0, "e": "Test inputs are short. Production histories grow, so the application must trim or summarize.", "w": "B — the window is a property of the model. C — models keep nothing between calls. D — tools stay in the request."}, {"id": 1918149432, "d": "app", "t": "api", "q": "Why can the same prompt return different wording on two calls?", "o": ["The API picks between model versions at random", "A hidden history from the last call changes it", "The server edits answers to avoid repeating itself", "The model samples each next token from a distribution"], "a": 3, "e": "Sampling makes generation non-deterministic, even when both answers are correct.", "w": "A — the model ID is pinned. C — no such editing exists. B — the API is stateless."}, {"id": 3133160689, "d": "app", "t": "api", "q": "On a model that accepts temperature, what does a lower value do?", "o": ["Guarantees byte-identical output on every single call", "Shortens the output to save tokens on each call", "Favors likely tokens, so output is more repeatable", "Switches the call to a cheaper model tier"], "a": 2, "e": "Lower temperature makes output more repeatable, but never guaranteed identical.", "w": "A — no guarantee exists. B — length is not controlled by it. D — it never changes the model."}, {"id": 4221693071, "d": "app", "t": "api", "q": "A team sends a non-default temperature to the newest Claude models and gets HTTP 400. What is the right fix?", "o": ["Retry with exponential backoff until the API accepts it", "Drop the sampling parameter and steer with the prompt", "Switch to streaming, which ignores sampling settings", "Raise max_tokens so the request passes validation"], "a": 1, "e": "The newest models reject non-default <code>temperature<\/code>, <code>top_p<\/code> and <code>top_k<\/code>. Use prompting to steer.", "w": "A — a 400 is not transient. D — max_tokens is unrelated. C — streaming does not change validation."}, {"id": 2111626467, "d": "app", "t": "api", "q": "How should tests treat Claude's non-deterministic output?", "o": ["Set temperature to zero and compare the full strings", "Skip testing, since the output varies between runs", "Assert the exact text and rerun until it matches", "Assert properties that must hold, like fields and ranges"], "a": 3, "e": "Test structure and rules, not exact wording.", "w": "C — flaky and wasteful. A — still no guarantee, and the parameter may be rejected. B — leaves quality unchecked."}, {"id": 2011597014, "d": "eval", "t": "evals", "q": "You need to judge the meaning of an answer rather than its structure. What fits best?", "o": ["Exact string matching against one answer", "An eval with a model-graded judge", "A higher temperature to compare variants", "A regular expression on the first sentence"], "a": 1, "e": "A model-graded judge with a rubric scores meaning. Exact matching only suits fixed outputs.", "w": "A — fails for valid rewordings. D — only checks wording. C — temperature does not grade anything."}, {"id": 241494825, "d": "model", "t": "models", "q": "According to the course, what is the practical default when choosing a model tier?", "o": ["Start with Sonnet, move only when an eval says so", "Pick a tier at random and keep the cheapest winner", "Start with Fable and move down when the bill grows", "Start with Haiku and move up after user complaints"], "a": 0, "e": "Sonnet is the balanced default. Evals decide whether to go up or down.", "w": "C — starts with the most expensive tier. D — waits for complaints instead of evals. B — no measurement."}, {"id": 2664521603, "d": "model", "t": "models", "q": "What is a good reason to move from Sonnet up to Opus?", "o": ["The team wants a more recent release date", "An eval shows Sonnet misses your quality bar", "The prompt has grown past ten thousand tokens", "Streaming has been turned on for the feature"], "a": 1, "e": "Move up only when measured quality is not enough.", "w": "C — prompt length alone is not a reason. A — release date is not quality. D — streaming is unrelated."}, {"id": 309068648, "d": "model", "t": "models", "q": "When is it justified to move down from Sonnet to Haiku?", "o": ["The prompt already contains a few worked examples", "The task is important to many customers of the app", "The context window is almost full on most calls", "An eval shows the quality drop is acceptable here"], "a": 3, "e": "Go down a tier only when the eval shows the lower quality is fine for that task.", "w": "B — importance argues for caution. A — examples do not decide the tier. C — Haiku has the same window."}, {"id": 1682869420, "d": "model", "t": "thinking", "q": "Which statement about model choice and reasoning mode is correct?", "o": ["Reasoning mode is chosen by picking a certain tier", "Reasoning mode is fixed once for the whole account", "They are independent settings you combine per call", "Model choice is made after the response has arrived"], "a": 2, "e": "A capable model can run with reasoning off, and a smaller one with reasoning on.", "w": "A — tiers do not determine it. B — it is a per-call setting. D — the model is chosen before the call."}, {"id": 1311782206, "d": "model", "t": "thinking", "q": "On current models, how do you tune how deeply Claude reasons?", "o": ["With the temperature parameter of the request", "With the max_tokens value of the response", "With the effort setting under adaptive thinking", "With a fixed budget_tokens value on every model"], "a": 2, "e": "Adaptive thinking lets the model decide, and effort steers how much.", "w": "D — budget_tokens is deprecated and rejected on the newest models. A — temperature is not a reasoning control. B — max_tokens caps output."}, {"id": 332277775, "d": "model", "t": "thinking", "q": "What happens when budget_tokens is sent to the newest model generations?", "o": ["The request fails with a 400 error", "It moves the call to batch processing", "It is silently ignored by the server", "It doubles the length of the thinking"], "a": 0, "e": "The manual budget is deprecated and returns a 400 on the newest generations.", "w": "C — it is not ignored. D — no such effect. B — unrelated to batch."}, {"id": 2827850506, "d": "model", "t": "thinking", "q": "On the newest models, what happens to thinking content by default?", "o": ["It is omitted unless summarized display is requested", "It is always returned in full with every response", "It is billed at half the price of normal output", "It is returned only when streaming is turned on"], "a": 0, "e": "Ask for summarized display when you need to show the reasoning to users.", "w": "B — omitted by default. C — thinking tokens are billed as output. D — streaming is not the trigger."}, {"id": 1910708633, "d": "prompt", "t": "prompting", "q": "Which description matches multi-shot (few-shot) prompting?", "o": ["Fine-tuning the model on a handful of examples", "Running the prompt a few times and taking a vote", "Sending the same prompt to several different models", "Several input-output examples placed in the prompt"], "a": 3, "e": "Zero-shot has no examples, one-shot has one, multi-shot has several.", "w": "A — nothing is trained. B — that is voting. C — that is not prompting mode."}, {"id": 3836308992, "d": "prompt", "t": "prompting", "q": "Are examples placed in a prompt used as training data?", "o": ["Only when the request is sent without streaming", "No, they sit in the prompt and show the expected shape", "Yes, but only for calls from your own organization", "Yes, they update the model for all later calls"], "a": 1, "e": "Examples guide one call. The model weights do not change.", "w": "D — models do not learn from prompts. C — no organization-level training. A — streaming is unrelated."}, {"id": 4032844228, "d": "prompt", "t": "prompting", "q": "A zero-shot prompt already returns correct, well-shaped answers. What does adding three examples most likely do?", "o": ["Switches sampling off for the whole request", "Improves the accuracy of the answers substantially", "Adds token cost on every call for little or no gain", "Changes the model that is used for the call"], "a": 2, "e": "Add examples when the output shape is wrong, not when zero-shot already works.", "w": "B — there is little left to improve. D — examples never change the model. A — sampling is unaffected."}, {"id": 1369676067, "d": "prompt", "t": "prompting", "q": "Output keeps coming back in the wrong structure under a zero-shot prompt. What should you try first?", "o": ["Add another paragraph of detailed instructions", "Move straight to a larger model tier", "Raise the temperature to vary the structure", "Add one or two correct examples of the output"], "a": 3, "e": "One or two correct examples usually fix a shape problem faster than more instruction text.", "w": "A — descriptions often fail to pin down a shape. C — randomness does not fix structure. B — try the cheaper fix first."}, {"id": 3845155889, "d": "prompt", "t": "prompting", "q": "A more capable model succeeds zero-shot where a smaller one needs examples. What follows from that?", "o": ["Examples change the price tier of the model", "Adding examples can let a cheaper model do the job", "Capable models can never benefit from examples", "Examples never help the smaller models at all"], "a": 1, "e": "Mode and model are related levers. Try the simplest model and the fewest examples that meet your eval.", "w": "D — examples help small models. C — they can help any model. A — examples do not change pricing tiers."}, {"id": 1367841317, "d": "app", "t": "api", "q": "How do an official SDK and raw REST calls differ?", "o": ["The SDK bypasses the rate limits of the account", "The SDK is a thin layer over the same API and model", "The SDK calls a different, faster model than REST", "Raw REST is not able to stream any responses"], "a": 1, "e": "Both reach the same API. The SDK saves you from building requests and parsing responses by hand.", "w": "C — same model. D — REST can stream with server-sent events. A — limits apply equally."}, {"id": 2681342122, "d": "app", "t": "api", "q": "Which Python SDK client supports non-blocking async and await?", "o": ["StreamAnthropic", "BatchAnthropic", "RealtimeAnthropic", "AsyncAnthropic"], "a": 3, "e": "<code>AsyncAnthropic<\/code> uses non-blocking async/await so your thread is free while waiting.", "w": "A — not a class of the SDK. B — not a class of the SDK. C — not a class of the SDK."}, {"id": 1309516684, "d": "app", "t": "api", "q": "How do you make non-blocking calls in the TypeScript SDK?", "o": ["Await the standard Promise-based client directly", "Use a separate AsyncAnthropic class instead", "Wrap every call in its own worker thread", "Send every request through the Batch API"], "a": 0, "e": "The TypeScript client is already Promise-based, so there is no separate async class.", "w": "B — that is the Python class. C — unnecessary. D — batch is asynchronous bulk processing, not a call style."}, {"id": 62318130, "d": "app", "t": "batch", "q": "How do you get results from the Message Batches API?", "o": ["Submit requests, get an identifier, poll for completion", "Read the results directly from the submit response", "Register a webhook that Claude calls when done", "Keep one connection open until all results stream in"], "a": 0, "e": "Batches are asynchronous: submit, then poll, within a 24-hour window.", "w": "D — not how batches return. B — results are not immediate. C — polling is the documented pattern."}, {"id": 1817021998, "d": "app", "t": "stream", "q": "When is a plain synchronous request a good fit?", "o": ["Bulk jobs of fifty thousand offline documents", "Real-time chat that needs instant first words", "Short answers and backend jobs nobody waits for", "Long outputs while a user watches the screen"], "a": 2, "e": "Synchronous is the simplest pattern. Use streaming for long or watched output and batch for bulk offline work.", "w": "D — streaming fits. A — batch fits. B — streaming fits."}, {"id": 2932194644, "d": "prompt", "t": "prompting", "q": "A classifier returns the right category, but sometimes as a full sentence and sometimes in lowercase. Which piece is missing?", "o": ["An output constraint on the label set", "A longer description of each category", "A higher temperature for more variety", "A larger model tier for better judgment"], "a": 0, "e": "The content is right and the <b>shape<\/b> varies, so the missing piece is an output constraint: exactly one label from a fixed set, nothing else.", "w": "B — more description does not fix the shape. C — randomness makes the shape less stable. D — a larger model does not enforce format."}, {"id": 1770519406, "d": "prompt", "t": "prompting", "q": "Over a long conversation, an assistant drifts from its scope and starts answering broader questions. What is most likely missing?", "o": ["A JSON schema on the final answer", "A lower max_tokens value for every call", "A set of few-shot examples in each turn", "A specific system prompt that holds scope"], "a": 3, "e": "Scope drift across turns means the behavioral contract is too vague. A specific system prompt holds role, scope and format steady.", "w": "A — a schema controls shape, not scope. C — examples fix structure, not scope. B — the output ceiling does not set scope."}, {"id": 3876591596, "d": "prompt", "t": "prompting", "q": "Claude understands the task but invents its own structure for the answer. What is the best fix?", "o": ["Rewrite the instruction with more adjectives", "Add one or two few-shot input-output examples", "Increase the effort setting to the maximum", "Switch from XML tags to plain paragraphs"], "a": 1, "e": "A description rarely pins down an exact structure. Examples show the pattern.", "w": "A — wording does not fix a missing pattern. D — removing structure makes it worse. C — more reasoning does not supply the shape."}, {"id": 1031958481, "d": "prompt", "t": "prompting", "q": "A prompt works on every test ticket but breaks on a rare variant. What should you do?", "o": ["Rerun the tests until the variant passes", "Remove the variant from future inputs", "Repeat the whole instruction a second time", "Name the variant in a rule or an example"], "a": 3, "e": "The prompt covers only the happy path. Close the gap with a rule or an example that covers the variant.", "w": "A — hides the problem. B — not realistic for production inputs. C — repetition adds length, not coverage."}, {"id": 1908619578, "d": "prompt", "t": "prompting", "q": "A team has re-prompted a classifier five times and the output is still wrong. What is the best next step?", "o": ["Diagnose the failure type before adding more text", "Switch to a different provider for comparison", "Add a reminder to be precise to the prompt", "Add another paragraph of edge cases"], "a": 0, "e": "Growing prompts without improvement signal skipped diagnosis. Name the failure and add the one matching technique.", "w": "D — more text is what failed so far. C — vague reminders do not constrain output. B — not a diagnosis."}, {"id": 1669613270, "d": "prompt", "t": "prompting", "q": "Why can a long, wordy prompt hurt a simple classification service?", "o": ["It tends to produce long, unfocused output", "It disables the use of few-shot examples", "It lowers the accuracy of every label", "It makes the API reject the whole request"], "a": 0, "e": "Models calibrate response length and style to the input. A verbose prompt can cause verbose output with no accuracy gain.", "w": "C — accuracy did not drop by itself. B — examples remain usable. D — length alone is not a validation error."}, {"id": 858048270, "d": "prompt", "t": "prompting", "q": "Which task needs only one prompting technique rather than all four?", "o": ["Summarize this paragraph in plain words", "Classify tickets into a fixed label set", "Route requests with a parser downstream", "Extract five fields into a strict JSON shape"], "a": 0, "e": "A simple task does not need a schema and examples. Stack techniques only for clearly defined output contracts.", "w": "B — benefits from constraint and examples. D — benefits from a schema and examples. C — needs a strict output contract."}, {"id": 4195823805, "d": "prompt", "t": "prompting", "q": "What is the job of XML tags in a prompt that also contains examples?", "o": ["They lower the price of examples per call", "They force the answer to be valid JSON text", "They separate examples from instructions", "They make the model run faster on long input"], "a": 2, "e": "Tags mark where each part starts and ends so Claude does not read an example as part of the task.", "w": "D — speed is unchanged. B — only a schema constrains output. A — tokens are billed as usual."}, {"id": 886582617, "d": "app", "t": "structured", "q": "Why move output control from the prompt into the API with a JSON schema?", "o": ["A schema is cheaper than any prompt text", "The model remembers schemas from earlier sessions", "The API enforces the schema on every token", "Schemas remove the need to check stop_reason"], "a": 2, "e": "A prompt is a request, a schema is enforced through constrained decoding, so untested inputs cannot slip.", "w": "B — the API is stateless. A — injected format text adds input tokens. D — refusal and max_tokens still need checks."}, {"id": 3961541474, "d": "app", "t": "structured", "q": "A service sees slower first calls after it started changing its JSON schema every few minutes. What explains this?", "o": ["Streaming is switched off for schema requests", "The API throttles accounts that use schemas", "Each new schema must be compiled before use", "The model needs time to learn each schema"], "a": 2, "e": "Schemas are compiled into a grammar and cached for 24 hours. Constant changes pay the compile cost repeatedly.", "w": "D — nothing is learned. A — streaming still works. B — there is no such throttle."}, {"id": 633984827, "d": "app", "t": "structured", "q": "Which combination is NOT allowed on one request?", "o": ["Strict tool use together with parallel calls", "JSON outputs together with strict tool use", "JSON outputs together with message prefilling", "A JSON schema together with prompt caching"], "a": 2, "e": "JSON outputs and prefilling are incompatible: pick the one that fits the task.", "w": "B — they can be combined. A — allowed. D — allowed."}, {"id": 2270302248, "d": "app", "t": "structured", "q": "A schema-constrained call returns stop_reason refusal. What is true about the output?", "o": ["It is guaranteed to match the schema exactly", "It is automatically retried by the API itself", "It is billed at a reduced price for refusals", "It may not match the schema, so handle it"], "a": 3, "e": "A guaranteed schema is not a guaranteed success. Refusals and truncation still need handling.", "w": "A — the guarantee does not cover refusals. B — no automatic retry. C — refusals are billed."}, {"id": 1702256489, "d": "model", "t": "thinking", "q": "Where does a thinking block appear in a response?", "o": ["Inside the system prompt of the next call", "In a separate response header field", "Just before the block that holds the answer", "After the answer, as a footnote"], "a": 2, "e": "Reasoning comes back as its own block placed before the answer block.", "w": "D — it precedes the answer. A — it is a response block, not a prompt. B — it is part of the content array."}, {"id": 4064439812, "d": "model", "t": "thinking", "q": "Which task is a poor fit for extended thinking?", "o": ["Deriving a result with many constraints", "A multi-hop logic puzzle with traps", "Extracting one field from a short email", "Planning dependent steps across several tools"], "a": 2, "e": "Mechanical tasks gain nothing from reasoning and cost more output tokens.", "w": "D — benefits from planning. A — benefits from reasoning. B — benefits from reasoning."}, {"id": 3924410619, "d": "model", "t": "thinking", "q": "A developer drops thinking blocks from history to save tokens during a tool loop with thinking on. What happens?", "o": ["The model quietly forgets and answers worse", "The next request is rejected by a signature check", "Nothing, thinking blocks are optional history", "The tokens saved are refunded as account credits"], "a": 1, "e": "Thinking blocks must return unchanged. Editing, summarizing or dropping them breaks the signature.", "w": "A — the API validates it, so it fails outright. D — no credits exist. C — they are required in tool loops."}, {"id": 1953419338, "d": "model", "t": "thinking", "q": "What must be done with a redacted thinking block?", "o": ["Pass it back unchanged, though encrypted", "Replace it with a short text block of notes", "Delete it, since nobody can read the content", "Decrypt it locally and edit its summary text"], "a": 0, "e": "Redacted blocks follow the same rule as normal thinking blocks: return them untouched.", "w": "C — breaks the next request. D — it is not meant to be decrypted. B — replacing breaks validation."}, {"id": 60193799, "d": "model", "t": "thinking", "q": "In an agent loop with several tool calls, how should extended thinking be budgeted?", "o": ["Set the maximum effort on each classification", "Disable it for every call in the loop", "Enable it and budget for the planning step", "Enable it only for the very last answer"], "a": 2, "e": "Reasoning before a plan reduces wrong-tool selection later, so budget for planning rather than per call.", "w": "B — loses planning benefit. D — misses the planning step. A — wastes tokens on simple calls."}, {"id": 3661187102, "d": "tools", "t": "tooluse", "q": "Who actually executes a client tool such as get_account_balance?", "o": ["Anthropic's servers, on behalf of your account", "Claude, inside the model, using your schema", "Your application, after reading the tool_use", "The browser of the end user, called directly"], "a": 2, "e": "Claude picks a tool and its inputs. Your code runs it and returns a tool_result.", "w": "B — models only produce the call. A — only server tools run there. D — not part of the loop."}, {"id": 795783366, "d": "tools", "t": "tooluse", "q": "In which role is a tool_result block sent?", "o": ["The system role", "The user role", "A separate tool role", "The assistant role"], "a": 1, "e": "Tool results are sent in the <b>user<\/b> role even though your code produced the content.", "w": "D — assistant turns carry tool_use. A — system is a top-level parameter. C — no such role exists."}, {"id": 628542670, "d": "tools", "t": "tooluse", "q": "An assistant turn contains two tool_use blocks. How should the results be returned?", "o": ["In two user turns, sent one after the other", "Only the first result, ignoring the second one", "In the next assistant turn, as text blocks", "Together in the next user turn, one per id"], "a": 3, "e": "Every tool_use needs a tool_result with the same id in the immediately following user turn.", "w": "A — results must be in the immediately following turn. C — they belong to a user turn. B — every call needs an answer."}, {"id": 3417816319, "d": "tools", "t": "tooluse", "q": "A turn contained a text block next to a tool_use block. What should the history keep?", "o": ["The full content array, text block included", "Only the text block, since it is the shorter", "Neither, because the tool_result is enough", "Only the tool_use block, to save some tokens"], "a": 0, "e": "Dropping the text block corrupts the context Claude relies on in follow-up turns.", "w": "D — loses context. B — breaks the tool pairing. C — the call must remain in history."}, {"id": 1831376695, "d": "tools", "t": "tooluse", "q": "Which tool description is the best for a balance lookup?", "o": ["Gets data.", "Use this tool to find information about accounts.", "A banking tool that works with account data.", "Gets one account's balance. Not for history."], "a": 3, "e": "A good description says what the tool does and when not to use it.", "w": "B — identical to every other lookup tool. C — vague. A — too short to route on."}, {"id": 1247228028, "d": "tools", "t": "tooluse", "q": "Two tools both say Use this to find information and Claude picks the wrong one. What is the first fix?", "o": ["Make every parameter required in both tools", "Rename both tools to shorter identifiers", "Lower the max_tokens on the whole request", "Add an exclusion condition to each one"], "a": 3, "e": "Without a boundary, descriptions look identical. One sentence per tool naming when not to call it resolves most cases.", "w": "B — names are not the deciding signal. A — forces invented values. C — unrelated to routing."}, {"id": 1385899288, "d": "tools", "t": "tooluse", "q": "When should a parameter be marked required in an input schema?", "o": ["Only when it is a string value", "Never, Claude fills everything itself", "Whenever the tool could possibly use it", "When the call makes no sense without it"], "a": 3, "e": "Required fields force a value. Marking everything required makes Claude invent values it cannot know.", "w": "C — leads to guessed values. A — type does not decide it. B — required fields are respected."}, {"id": 4111062715, "d": "tools", "t": "tooluse", "q": "A second tool call depends on the result of the first. How should this be modelled?", "o": ["As one call with every argument guessed", "As two parallel calls in one assistant turn", "As one tool with no description at all", "As separate turns, so the result comes first"], "a": 3, "e": "Dependent calls run in sequence. Independent calls may be issued together.", "w": "B — the second call cannot be built yet. C — hides the logic. A — fabricates inputs."}, {"id": 1532347250, "d": "tools", "t": "tooluse", "q": "A tool_result carries tool_use_id toolu_02 but the call was toolu_01. What happens on the next request?", "o": ["Claude fixes the id and continues anyway", "The result is silently dropped from history", "It fails validation: the id is unknown", "The API matches results by tool name instead"], "a": 2, "e": "The id must match exactly. This is structural, so the fix is in your code, not in the prompt.", "w": "A — nothing is auto-repaired. D — matching is by id. B — it is rejected, not dropped."}, {"id": 3285410935, "d": "tools", "t": "mcp", "q": "Why does connecting many MCP servers at once cost context?", "o": ["Their definitions use budget even when unused", "Each server adds its own long system prompt", "Servers copy full results into the history", "MCP disables prompt caching on every request"], "a": 0, "e": "Tool definitions are loaded into the window up front. Connect only the servers you actively use.", "w": "B — servers do not add system prompts. D — caching is unaffected. C — results are returned only when tools are called."}, {"id": 2116672139, "d": "tools", "t": "mcp", "q": "With the API MCP connector, which setting delays loading a tool definition until it is needed?", "o": ["defer_loading", "enabled set to false", "default_config only", "lazy_schema"], "a": 0, "e": "<code>defer_loading<\/code> inside the toolset configuration cuts upfront context cost. <code>enabled<\/code> turns tools on or off.", "w": "D — not a real setting. B — hides the tool completely. C — a block that sets defaults, not a loading rule."}, {"id": 389842159, "d": "tools", "t": "mcp", "q": "Which statement about the API MCP connector is correct?", "o": ["It rewrites tool descriptions for better routing", "It spawns local stdio servers for you", "It supports only remote servers exposed over HTTP", "It needs no beta header in any case"], "a": 2, "e": "A stdio server needs your own MCP client via the SDK. The connector talks to remote servers.", "w": "B — it does not start local processes. D — it requires the mcp-client beta header. A — descriptions come from the server."}, {"id": 3842990946, "d": "tools", "t": "mcp", "q": "When is writing your own schemas better than connecting to an MCP server?", "o": ["No server fits, or you need tight control", "A maintained server covers every operation", "You want to avoid writing any execution code", "The service already publishes an official server"], "a": 0, "e": "Use MCP when a well-maintained server covers your needs. Write schemas for gaps or precise control.", "w": "B — that favors MCP. C — manual schemas need executors. D — that favors MCP."}, {"id": 485414164, "d": "app", "t": "stream", "q": "When can a streamed tool_use input be parsed and the tool run?", "o": ["After content_block_stop for that block", "After each single delta has been applied", "Only when the stream finally times out", "As soon as the very first delta has arrived"], "a": 0, "e": "Input arrives as partial JSON text. It is valid only when the block closes.", "w": "D — one fragment is incomplete. B — a delta may end mid-key. C — a timeout means interruption."}, {"id": 738876405, "d": "app", "t": "stream", "q": "When should a streamed assistant turn be appended to the conversation history?", "o": ["After the first content_block_stop arrives", "Whenever the read loop of the stream ends", "Before the stream starts, as a placeholder", "After message_stop, all blocks assembled"], "a": 3, "e": "Only message_stop means the message is whole. A stream ending is not a message completing.", "w": "B — an interrupted stream also ends the loop. A — other blocks may be open. C — a placeholder breaks history."}, {"id": 1119420079, "d": "app", "t": "stream", "q": "A stream drops after a tool_use block received part of its JSON. What should the handler do?", "o": ["Save the partial turn and repair the JSON later", "Discard the partial turn, retry the last complete", "Close the session and clear all of the history", "Run the tool with the arguments received so far"], "a": 1, "e": "A half-built block in history breaks the next request. Treat accumulated data as provisional until message_stop.", "w": "A — corrupts history. D — missing arguments cause wrong actions. C — far too drastic."}, {"id": 2797250664, "d": "app", "t": "stream", "q": "A retry fails with an error about a malformed tool_use block. Where should you look first?", "o": ["At the temperature of the earlier request", "At the model name used for the retry", "At how the previous stream was committed", "At the length of the system prompt used"], "a": 2, "e": "The retry shows the symptom. The cause is often a half-built block from a dropped stream.", "w": "A — unrelated. D — unrelated. B — unrelated."}, {"id": 1533260975, "d": "app", "t": "stream", "q": "Which event reports the stop_reason in a streamed response?", "o": ["message_delta", "content_block_delta", "content_block_start", "message_start"], "a": 0, "e": "Check the stop_reason from <code>message_delta<\/code> before continuing a loop: tool_use means the calls are ready.", "w": "C — opens a block. D — opens the message. B — carries fragments."}, {"id": 3095386849, "d": "prompt", "t": "context", "q": "An agent chooses wrong tools after about turn eight, in every run. What should be checked first?", "o": ["Whether streaming is enabled for this run", "Whether the tool names happen to be too short", "Whether the temperature value is set too low", "Whether tool results fill the context window"], "a": 3, "e": "Tool selection that degrades after a fixed number of turns points to a filling window, not the schema.", "w": "C — unrelated. B — would fail from the first turn. A — unrelated."}, {"id": 1850295848, "d": "prompt", "t": "context", "q": "An agent worked for 20 turns with 800-token tool outputs in tests. In production outputs are 3,200 tokens and it fails at turn 8. What is the root cause?", "o": ["Production uses a model with less memory", "The tools were registered in the wrong order", "Outputs grew, so the budget filled up early", "The model has a limit of eight turns in production"], "a": 2, "e": "Test fixtures were shorter than production data. Measure token cost on the largest real input before shipping.", "w": "D — there is no turn limit. A — the model did not change. B — order does not matter."}, {"id": 559677243, "d": "prompt", "t": "context", "q": "Which strategy fits when the next task is completely different from the current one?", "o": ["Clearing the context and starting a new session", "Compacting the old conversation into a summary", "Handing the work to a subagent", "Pruning back to an earlier message"], "a": 0, "e": "Clearing starts empty. Anything needed later must live somewhere persistent.", "w": "D — keeps related history. B — carries the old bias forward. C — useful for isolated subtasks, not a topic change."}, {"id": 2628616918, "d": "prompt", "t": "context", "q": "Why does a vague summarizer prompt cause trouble in manual compaction?", "o": ["Task-critical state can be lost in the summary", "It disables prompt caching for the session", "It makes the summary longer than the original", "It changes the model for later turns"], "a": 0, "e": "Tell the summarizer to keep file paths, decisions and errors with their resolutions.", "w": "C — summaries are shorter. B — unrelated. D — models do not change."}, {"id": 926562545, "d": "prompt", "t": "context", "q": "A subtask is self-contained and its exploration would clutter the main context, but the answer is short. What fits?", "o": ["Increasing the size of the context window", "Pruning the main conversation afterwards", "Clearing the whole session before the subtask", "A subagent that returns a short summary"], "a": 3, "e": "Subagents keep the journey out of the main context. You lose visibility of how they reached the result.", "w": "B — loses useful progress. C — loses the task state. A — the window is fixed per model."}, {"id": 2895133374, "d": "prompt", "t": "context", "q": "What does the count_tokens endpoint return?", "o": ["The exact cost of the next response in dollars", "The output length Claude is going to produce", "The number of tokens in the cached prefix only", "The input token count, without running inference"], "a": 3, "e": "Use it to check budgets against real tool outputs and to gate requests that would exceed the window.", "w": "A — it counts tokens, not price. C — it counts the whole request. B — output is unknown before generation."}, {"id": 3648959586, "d": "prompt", "t": "context", "q": "A retrieval system misses a chunk that contains an exact product code, although semantically similar chunks were returned. What is a sound response?", "o": ["Ask Claude to guess the code from memory", "Add a lexical match next to the embeddings", "Make every chunk much larger than before", "Remove the chunk overlap to avoid duplicates"], "a": 1, "e": "Embedding search finds semantically close text, which may outrank an exact identifier.", "w": "C — large chunks dilute matches. D — overlap protects boundary facts. A — the model has no access to your data."}, {"id": 2643052727, "d": "agents", "t": "agents", "q": "Which situation points to an agent instead of a workflow?", "o": ["The exact steps can be listed in code", "The goal and tools are known but the path is not", "The inputs are well-constrained to a known set", "Every run follows the same fixed sequence"], "a": 1, "e": "Agents fit unpredictable paths. Workflows fit enumerable steps.", "w": "A — workflow. D — workflow. C — workflow."}, {"id": 2844437679, "d": "agents", "t": "agents", "q": "A company needs a long-running agent and does not want to build a sandbox, but the data is covered by HIPAA. What follows?", "o": ["Use Managed Agents and add a note in the prompt", "Managed Agents is fine, Anthropic runs the loop", "Switch to a consumer plan for these sessions", "Managed Agents is out; use the SDK or a raw loop"], "a": 3, "e": "Managed Agent sessions are stored server-side and are currently not eligible for ZDR or a HIPAA BAA.", "w": "B — storage rules it out. A — a prompt does not change eligibility. C — consumer plans are not covered by a BAA either."}, {"id": 640287938, "d": "agents", "t": "agents", "q": "Which path leaves tool execution to your own code while giving the loop structure in your process?", "o": ["The Agent SDK", "The Message Batches API", "Claude Managed Agents", "The Files API"], "a": 0, "e": "The SDK runs the same loop in your process. Managed Agents runs it on Anthropic's side.", "w": "C — Anthropic runs the loop and sandbox. B — bulk async processing. D — file storage."}, {"id": 1888563918, "d": "agents", "t": "agents", "q": "Which of these is NOT one of the four steps that hold on every wiring path?", "o": ["Define the exit conditions of the whole loop", "Fine-tune the model on your tool traces", "Register the tools the agent is going to need", "Scope the system prompt to the actual task"], "a": 1, "e": "The four steps are register tools, scope the system prompt, handle the tool-use loop and define exit conditions.", "w": "C — a step. D — a step. A — a step."}, {"id": 3553994082, "d": "agents", "t": "agents", "q": "An agent edited a config value, the validation passed, and the customer's application broke. What was missing?", "o": ["A higher iteration cap for the editing loop", "A longer system prompt about configuration files", "A human checkpoint before the write was committed", "A second validation call after the same write"], "a": 2, "e": "The exit condition was scoped to the file. No checkpoint sat between a valid proposal and a committed write.", "w": "B — a prompt is not a control. A — the cap was never reached. D — the same check would pass again."}, {"id": 1200483894, "d": "agents", "t": "agents", "q": "Where should human-in-the-loop checks be placed?", "o": ["Nowhere, as long as the prompt is detailed", "Before every one of the read-only tool calls", "Before destructive calls, after plans, on odd output", "Only at the very end of every single run"], "a": 2, "
