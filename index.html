e": "Ask what the worst outcome is if the step runs without a human check.", "w": "D — too late for irreversible actions. B — noisy, low value. A — a prompt cannot replace a control."}, {"id": 1444863841, "d": "agents", "t": "agents", "q": "Why does registering every tool just in case hurt an agent?", "o": ["Unused tools are billed at full price", "The API limits an agent to five tools", "Tools cannot be combined in one request", "Routing degrades as the tool surface grows"], "a": 3, "e": "Start with the minimum set and add a tool only for a confirmed capability gap.", "w": "B — no such limit. A — they cost input tokens, not a separate fee. C — they can be combined."}, {"id": 2526444038, "d": "agents", "t": "agents", "q": "A firm bound by GDPR must keep model execution inside the EU. Which route fits?", "o": ["Any route, since residency is automatic", "A consumer app plan for the whole team", "The direct API on the default global endpoint", "Bedrock or Vertex, with the region pinned"], "a": 3, "e": "The direct API does not currently provide EU data residency. Pin the region on a cloud-mediated route.", "w": "C — cannot pin the region. A — not automatic. B — not suitable for regulated workloads."}, {"id": 801681659, "d": "agents", "t": "memory", "q": "A support agent continues the same case over two weeks of daily check-ins. Which memory scope fits?", "o": ["No persistent memory between the sessions", "External storage, read at session start", "In-context memory held in the conversation", "A larger context window for the same model"], "a": 1, "e": "State must survive between sessions, so write it to storage and read it back.", "w": "C — lost when the session ends. A — would forget the case. D — does not persist across sessions."}, {"id": 3006517429, "d": "agents", "t": "memory", "q": "A formatter receives a file, transforms it, returns the output and ends. Which memory scope fits?", "o": ["Stateless, with no persistent memory", "External storage with its own database", "Summarized memory of all earlier runs", "In-context memory carried across runs"], "a": 0, "e": "Independent jobs need no memory. Adding storage is pure overhead.", "w": "B — needless latency. C — nothing to summarize. D — nothing carries over."}, {"id": 3382371739, "d": "agents", "t": "memory", "q": "What is the drawback of summarized memory?", "o": ["It cannot be used across sessions", "It needs a separate model for every user", "It costs more than replaying full history", "Details the summarizer did not keep are lost"], "a": 3, "e": "The agent only sees what the summarization prompt chose to keep.", "w": "C — it is usually cheaper. A — it is made for cross-session use. B — not required."}, {"id": 1864416552, "d": "agents", "t": "memory", "q": "Why is it cheaper to choose the memory scope at design time?", "o": ["Moving state out under pressure takes far longer", "Databases are free before the first deployment", "In-context memory is not allowed in production", "The API forbids changing the memory scope later"], "a": 0, "e": "The refactor is mechanical, but doing it during an incident costs time and attention.", "w": "B — storage costs the same. C — it is allowed. D — nothing forbids it."}, {"id": 2026479308, "d": "agents", "t": "memory", "q": "When does a Skill load its full instructions?", "o": ["Only when the user types a slash command", "At the start of every single session", "Whenever the context window is empty", "When a request matches its description"], "a": 3, "e": "Claude reads only names and descriptions up front and loads the rest on a match.", "w": "B — that is CLAUDE.md in Claude Code. A — matching is automatic. C — unrelated."}, {"id": 1632565046, "d": "agents", "t": "memory", "q": "What do subagents inherit from the parent session?", "o": ["Skills and history, but not permissions", "Nothing at all from the parent session", "Permissions, but not Skills or history", "Everything, including the thinking blocks"], "a": 2, "e": "List needed Skills in the subagent's configuration. Permission scope is not reset on delegation.", "w": "A — reversed. D — they start clean. B — permissions carry over."}, {"id": 982223985, "d": "agents", "t": "memory", "q": "Instructions that must apply to every task in a codebase belong in:", "o": ["A Skill with a narrow description", "CLAUDE.md", "The memory of a stateless agent", "A one-off chat message"], "a": 1, "e": "CLAUDE.md loads every session. Skills fit task-specific expertise.", "w": "A — loads only on a match. D — lost after the session. C — stateless means nothing persists."}, {"id": 259850347, "d": "app", "t": "multimodal", "q": "How many visual tokens does a 1,000 x 1,000 pixel image cost with 28x28 patches?", "o": ["About 1,000", "About 28,000", "About 36", "About 1,296"], "a": 3, "e": "ceil(1000/28) = 36 per side, and 36 x 36 = 1,296 patches.", "w": "A — not pixels per token. C — that is the patches on one side. B — not the pixel count divided by one."}, {"id": 668827546, "d": "app", "t": "multimodal", "q": "The same reference diagram is needed in every request of a pipeline. Which encoding is best?", "o": ["A brand new URL for every single request", "Files API: upload once, use the file_id", "Inline base64 in every single request", "The Message Batches API for each request"], "a": 1, "e": "Reused assets belong in the Files API. Inline base64 sends the bytes every time.", "w": "C — multiplies payload cost. D — a submission model, not an encoding. A — pointless churn."}, {"id": 4062183888, "d": "app", "t": "multimodal", "q": "A support engineer submits a one-off screenshot in a single request. Which encoding fits best?", "o": ["The Message Batches API with polling", "A pipeline of resize and upload steps", "Inline base64 in the message block", "Files API with a later cleanup job"], "a": 2, "e": "For a one-off image, an upload step adds complexity without payoff.", "w": "D — overkill for one use. A — async bulk processing. B — unnecessary."}, {"id": 3467144691, "d": "app", "t": "multimodal", "q": "Which block type carries a PDF in a request?", "o": ["attachment", "file_text", "image", "document"], "a": 3, "e": "PDFs use a document block, with a source of base64, URL or file_id. Title and context are optional.", "w": "C — for images. A — not a block type. B — not a block type."}, {"id": 2749064571, "d": "app", "t": "batch", "q": "A developer splits 5,000 inputs into chunks and loops over the synchronous API. They still hit rate limits. Why?", "o": ["The synchronous API caps chunks at 100 items", "Chunks are billed at a higher price", "The API still sees one request per item", "Looping disables the retry logic of the SDK"], "a": 2, "e": "Chunking a list is not batching. Batching is a different submission model.", "w": "B — price is per token. A — no such cap. D — retries still apply."}, {"id": 2257523854, "d": "app", "t": "batch", "q": "Why does a batch use custom_id on every request?", "o": ["It lowers the price of every single request", "Results come back unordered and need matching", "It lets the whole batch run in real time", "It encrypts the contents of the requests"], "a": 1, "e": "Use <code>custom_id<\/code> to match results back to inputs.", "w": "A — the discount is automatic. C — batches are asynchronous. D — not its purpose."}, {"id": 186545107, "d": "cc", "t": "claude-code", "q": "Which permission mode holds Claude in the explore phase and blocks edits and shell commands until released?", "o": ["acceptEdits", "plan", "default", "dontAsk"], "a": 1, "e": "<code>plan<\/code> keeps Claude read-only while it explores and proposes a plan for approval.", "w": "C — prompts before most actions but still allows edits after approval. A — auto-approves edits. D — a different non-prompting mode."}, {"id": 3832085207, "d": "cc", "t": "claude-code", "q": "A developer switches to bypassPermissions for a routine cleanup, and a script deletes production files. Which prompt was lost?", "o": ["A prompt shown after every file was saved", "A prompt shown only for read operations", "The prompt before running the cleanup script", "A prompt that only appears in plan mode"], "a": 2, "e": "Bypass silences every prompt, including the protected-path guard. In default or acceptEdits the script invocation would have asked.", "w": "B — reads are auto-approved anyway. A — no such prompt exists. D — plan mode blocks instead of prompting."}, {"id": 1353883389, "d": "cc", "t": "claude-code", "q": "What is true about acceptEdits mode?", "o": ["It blocks all shell commands until released", "It removes the protected-path guard completely", "It prompts before every single file edit", "It auto-approves edits and in-folder rm"], "a": 3, "e": "A script invocation still prompts, but file edits and common file-system commands in the working directory pass silently.", "w": "C — that is default mode. A — that is plan mode. B — that is bypassPermissions."}, {"id": 216633585, "d": "cc", "t": "claude-code", "q": "A user-level allow rule and a project-level deny rule conflict on the same action. What happens?", "o": ["The user is asked to pick a winner", "The more recent rule in the file wins", "The deny rule wins", "The allow rule wins as it is personal"], "a": 2, "e": "A deny rule always wins over an allow rule, in every mode.", "w": "D — personal scope does not beat a deny. A — a deny blocks without asking. B — order is not the tie-breaker."}, {"id": 3301940876, "d": "cc", "t": "claude-code", "q": "Which settings file can users and project files NOT override?", "o": ["managed-settings.json set by administrators", ".claude/settings.json in the repository", "~/.claude/settings.json in the home folder", ".claude/settings.local.json for one project"], "a": 0, "e": "Enterprise managed settings sit above every other level.", "w": "B — overridable by local settings. D — a personal override. C — user level, below project and managed."}, {"id": 3359584490, "d": "cc", "t": "claude-code", "q": "Where do personal preferences for one project that should not be committed belong?", "o": [".claude/settings.json", "managed-settings.json", ".claude/settings.local.json", "A CLAUDE.md in the repository root"], "a": 2, "e": "The local project file is automatically git-ignored.", "w": "A — committed and shared. B — admin-controlled. D — shared with the team."}, {"id": 3522270024, "d": "cc", "t": "claude-code", "q": "An agent proposes a change to a deployment config that several production services read, with edits otherwise auto-approved. Where should the human gate sit?", "o": ["In bypassPermissions so the agent never pauses", "A person reviews it after the next pull request", "Nowhere, since edits are already auto-approved", "A person approves it before the write executes"], "a": 3, "e": "A wrong value is hard to undo and reaches systems outside the file, so the cost of being wrong is high.", "w": "B — too late. C — ignores the worst-case cost. A — removes every gate."}, {"id": 3644531754, "d": "cc", "t": "claude-code", "q": "A team requires a person to review changes to code marked sensitive. How should an AI review be used?", "o": ["As a replacement for review when tests pass", "Only after the change has been merged", "As an input to the human decision, never the only gate", "As the final approval when the findings are confident"], "a": 2, "e": "However confident the agent sounds, a person decides before the merge.", "w": "D — confidence is not a gate. A — passing tests do not replace review. B — too late."}, {"id": 3304055264, "d": "cc", "t": "claude-code", "q": "How should claims in an AI code review be treated?", "o": ["Apply every finding it lists without checking", "Trust claims about other systems over diff ones", "Ignore all of its findings as unreliable", "Trust provable diff findings, test runtime claims"], "a": 3, "e": "A missing null check can be proved from the diff. A claim about runtime behavior elsewhere is a hypothesis.", "w": "A — findings need triage. C — much of it is reliable. B — reversed."}, {"id": 1919499656, "d": "cc", "t": "claude-code", "q": "A CLAUDE.md grew to 847 lines and the agent edited a directory it was told never to touch. What is the best lesson?", "o": ["Raise the effort setting used by the agent", "Write the important rule in capital letters", "Add the same rule again at the file's end", "Keep it short, put the key rule in a hook"], "a": 3, "e": "Every added line dilutes the others. The rule you cannot afford to miss should be enforced by a hook.", "w": "C — more lines dilute further. B — emphasis is weak. A — unrelated."}, {"id": 3483921750, "d": "cc", "t": "claude-code", "q": "A rules file in .claude/rules/database/ has no paths field in its frontmatter. When does it load?", "o": ["Only when files in that folder are read", "Only when the user invokes it by name", "At launch, like CLAUDE.md", "Never, since the paths field is required"], "a": 2, "e": "Scoping comes from the <code>paths<\/code> frontmatter, not from the directory. Without it the rule loads unconditionally.", "w": "A — that needs a paths glob. B — rules are not invoked by name. D — it is optional."}, {"id": 557118257, "d": "cc", "t": "claude-code", "q": "Which guidance belongs in a path-scoped rules file instead of CLAUDE.md?", "o": ["The command that runs the whole test suite", "Never modify the database schema anywhere", "A style choice that applies to the full project", "SQL transaction rules for the database module only"], "a": 3, "e": "Narrow, path-specific guidance would be noise everywhere else. Universal constraints go in CLAUDE.md.", "w": "B — universal. A — universal. C — universal."}, {"id": 1420698435, "d": "cc", "t": "claude-code", "q": "What does a PreToolUse hook do that a CLAUDE.md instruction cannot?", "o": ["Adds its full output to the context each turn", "Reminds the model of a rule it may follow", "Blocks a call with exit code 2, every time", "Runs only after the tool call has finished"], "a": 2, "e": "A hook fires independent of the model's decisions. Exit code 2 with a reason on stderr blocks the call.", "w": "B — that is an instruction. D — that is PostToolUse. A — hooks add little to context."}, {"id": 2846553477, "d": "cc", "t": "claude-code", "q": "Why can a PostToolUse hook not block a tool call?", "o": ["It only runs when the session ends", "The call has already happened by then", "Exit codes are ignored in all hooks", "It runs before the model sees the prompt"], "a": 1, "e": "Use PostToolUse for formatters, tests and audit logs. Use PreToolUse to block.", "w": "C — PreToolUse uses exit code 2. A — that is SessionEnd. D — that is UserPromptSubmit."}, {"id": 360020684, "d": "cc", "t": "claude-code", "q": "Which hook event suits writing an audit log of every tool call?", "o": ["UserPromptSubmit", "SessionStart", "Notification", "PostToolUse"], "a": 3, "e": "It fires after each call deterministically, so the log is not something the model can skip.", "w": "A — before the model processes a prompt. B — once at session start. C — on permission requests and idle."}, {"id": 2392718652, "d": "cc", "t": "claude-code", "q": "You delegate a task to the built-in Explore subagent and a CLAUDE.md rule seems ignored. Why?", "o": ["Rules apply only to the general-purpose agent by name", "Explore overrides rules with its own prompt", "Subagents cannot read any project files", "Explore skips CLAUDE.md to stay fast and cheap"], "a": 3, "e": "Use the general-purpose subagent or a custom one when project rules must apply.", "w": "C — they can read files. B — not how it works. A — the general-purpose agent loads CLAUDE.md, but not by name."}, {"id": 596562531, "d": "cc", "t": "claude-code", "q": "A custom subagent needs a specific skill. How does it get it?", "o": ["Built-in agents preload it automatically", "List the skill in the agent's frontmatter", "Place the skill inside CLAUDE.md", "It inherits every skill from the main session"], "a": 1, "e": "Custom subagents do not see skills automatically.", "w": "D — they start clean. A — built-in agents have no preloaded skills. C — that would load it every session."}, {"id": 2078451139, "d": "cc", "t": "claude-code", "q": "Which statement about running one skill in several runtimes is correct?", "o": ["The same SKILL.md always behaves identically anywhere", "Skills only run in Claude Code, never via the API", "Design for it: avoid local-file and local-tool assumptions", "Beta headers are needed in every runtime equally"], "a": 2, "e": "Each runtime loads and sandboxes the skill differently. Portability is a design choice.", "w": "A — loading and sandboxing differ. B — it runs in the API and SDK too. D — headers apply to the API, settingSources to the SDK."}, {"id": 2397300176, "d": "cc", "t": "claude-code", "q": "A skill runs on the Messages API and its steps call a local shell script. What happens?", "o": ["It silently skips the step and continues", "It runs the script on the developer's laptop", "It works because the API mounts your folder", "It breaks, the container has no such local file"], "a": 3, "e": "On the API a skill runs in a container. Keep steps to what the runtime guarantees, or document the dependency.", "w": "C — nothing is mounted. B — nothing runs locally. A — it fails rather than skipping."}, {"id": 913314891, "d": "cc", "t": "claude-code", "q": "What must be set explicitly so the Agent SDK loads skills from the project?", "o": ["managed-agents beta header", "defer_loading", "mcp_toolset", "settingSources"], "a": 3, "e": "Do not rely on a default. Confirm current default behavior in the SDK reference.", "w": "A — for Managed Agents. C — for the MCP connector. B — for deferred MCP tools."}, {"id": 2811813348, "d": "cc", "t": "claude-code", "q": "A plugin named payments ships a run-tests command. How is it invoked?", "o": ["/run-tests only", "/payments-run-tests", "/plugin:payments/run-tests", "/payments:run-tests"], "a": 3, "e": "Plugin commands are namespaced by plugin name, so two plugins can both ship run-tests.", "w": "A — would collide. C — wrong format. B — wrong format."}, {"id": 2271787598, "d": "cc", "t": "claude-code", "q": "A skill that should run only when called explicitly needs which frontmatter setting?", "o": ["disable-model-invocation: true", "context: always in the frontmatter", "paths: [] with an empty list", "strict: true on the skill itself"], "a": 0, "e": "With that flag Claude does not load it automatically, you call it with /skill-name.", "w": "C — a rules-file setting. D — a tool-schema setting. B — not a real setting."}, {"id": 855572937, "d": "cc", "t": "claude-code", "q": "A plugin installs fine for every teammate but its skill fails for all but the author. What is the likeliest cause?", "o": ["The marketplace rejected the manifest file", "Teammates use a different model tier", "An absolute path to the author's home folder", "The plugin name is longer than allowed"], "a": 2, "e": "Installing copies files. Running resolves paths on the local machine. Use CLAUDE_PROJECT_DIR or CLAUDE_PLUGIN_ROOT.", "w": "D — not a rule. A — then the install would fail. B — unrelated."}, {"id": 98618680, "d": "cc", "t": "claude-code", "q": "Which variable references a script bundled inside the plugin itself?", "o": ["${CLAUDE_PLUGIN_ROOT}", "$CLAUDE_PROJECT_DIR", "$PWD of the running shell", "$HOME of each developer"], "a": 0, "e": "Use <code>$CLAUDE_PROJECT_DIR<\/code> for scripts in the project and <code>${CLAUDE_PLUGIN_ROOT}<\/code> for scripts in the plugin.", "w": "B — for project scripts. D — differs per machine. C — depends on where the session started."}, {"id": 3638320585, "d": "cc", "t": "claude-code", "q": "A marketplace allowlist is set in managed settings. What does it do?", "o": ["Limits which marketplace sources users may add", "Lets users override managed settings freely", "Installs all listed plugins for every user", "Registers those marketplaces for every user"], "a": 0, "e": "To also push a marketplace to everyone, pair the allowlist with extraKnownMarketplaces.", "w": "D — it only restricts. C — it does not install. B — managed settings cannot be overridden."}, {"id": 837314143, "d": "cc", "t": "claude-code", "q": "A deny rule a plugin author used locally is missing on teammates' machines. Why?", "o": ["Deny rules never apply to installed plugins", "The marketplace strips every rule on install", "A plugin carries only what is listed in it", "Teammates need a higher permission mode"], "a": 2, "e": "A guardrail that is not part of the bundle does not travel with it.", "w": "A — they do apply where present. B — nothing is stripped, the rule was never included. D — unrelated."}, {"id": 4140192014, "d": "tools", "t": "mcp", "q": "A shared team service is hosted centrally and every developer should reach it. Which transport and scope fit?", "o": ["HTTP with project scope in .mcp.json", "stdio with user scope in personal settings", "stdio with local scope for one person", "HTTP with local scope for one person"], "a": 0, "e": "A shared server needs a remote transport, and project scope lets the repo carry the configuration.", "w": "C — a local subprocess for one person. B — personal. D — not shared with teammates."}, {"id": 1296684660, "d": "tools", "t": "mcp", "q": "A local SQLite query tool is used only on your own machine. Which setup fits?", "o": ["stdio with project scope", "HTTP with project scope", "HTTP with enterprise scope", "stdio with local scope"], "a": 3, "e": "A local process for one person: stdio, kept in local scope.", "w": "B — shares it with the team. C — pushes it to the organization. A — each teammate would need the same setup."}, {"id": 3933875297, "d": "tools", "t": "mcp", "q": "A security scanner must be present on every developer's Claude Code installation. Which scope fits?", "o": ["User scope in personal settings", "Local scope in ~/.claude.json", "Enterprise scope via managed settings", "Project scope in a committed file"], "a": 2, "e": "Administrators push enterprise servers to all users, locked against override.", "w": "B — personal. A — personal. D — only reaches clones of one repository."}, {"id": 1007865443, "d": "tools", "t": "mcp", "q": "Where is local-scope MCP configuration stored?", "o": ["In ~/.claude.json under the project's path", "In .mcp.json at the repository root", "In the CLAUDE.md of the project", "In managed settings controlled by admins"], "a": 0, "e": "Local scope applies to the current project only and is not shared.", "w": "B — that is project scope. D — that is enterprise scope. C — not a config location."}, {"id": 1512191200, "d": "tools", "t": "mcp", "q": "What is a resource in an MCP server?", "o": ["A function the model decides to call", "The process that runs the whole server", "Read-only data placed in context by address", "A pre-written instruction template to use"], "a": 2, "e": "Direct resources have a fixed address, templated resources take a parameter.", "w": "A — that is a tool. D — that is a prompt. B — that is the transport or the server itself."}, {"id": 2242355718, "d": "tools", "t": "mcp", "q": "Why would a server expose a prompt?", "o": ["So the model can run code in a sandbox", "So every client gets one vetted instruction", "So credentials are kept in a single place", "So tool definitions can load much faster"], "a": 1, "e": "A server-side prompt is maintained once and reused wherever the server is connected.", "w": "A — not its purpose. C — secrets belong in a store. D — unrelated."}, {"id": 759174561, "d": "tools", "t": "mcp", "q": "How do you let one GitHub MCP tool run without a prompt while other tools on the server still prompt?", "o": ["Allow the whole server by its name", "Switch the session to bypassPermissions", "Allow mcp__github__create_issue", "Set enabled to true on that tool"], "a": 2, "e": "Permission rules can name a single tool as <code>mcp__server__tool<\/code>. A deny on one tool overrides an allow on the server.", "w": "A — opens every tool. B — removes all prompts. D — that exposes the tool to the model, it does not grant permission."}, {"id": 4011938255, "d": "tools", "t": "mcp", "q": "By default, how does Claude Code handle the tool definitions of connected MCP servers?", "o": ["It copies them all into the CLAUDE.md file", "It defers them and loads only what is needed", "It never loads them unless a skill asks", "It loads every definition at session start"], "a": 1, "e": "A search step discovers relevant tools. An opt-in mode loads upfront when they fit within about 10 percent of the window.", "w": "D — that is the opt-in mode, conditionally. C — skills are unrelated. A — not how it works."}, {"id": 1131750807, "d": "tools", "t": "mcp", "q": "Which authentication does the GitHub MCP server use in the course example?", "o": ["A password typed in again for every request", "A browser OAuth sign-in with a stored token", "A personal access token as a Bearer header", "File-system permissions only, no credential"], "a": 2, "e": "Supply the token through an environment variable, never inline in <code>.mcp.json<\/code>. Linear is the OAuth example.", "w": "B — that is Linear. D — for local services. A — not a pattern used."}, {"id": 772865977, "d": "sec", "t": "security", "q": "An API key was committed inline in .mcp.json and later moved to an environment variable. What must still be done?", "o": ["Rotate the key, since it remains in history", "Ask teammates to forget the old key", "Delete the old commit message only", "Nothing, the current file no longer shows it"], "a": 0, "e": "Overwriting a file does not remove the value from history. Treat it as compromised.", "w": "D — history keeps it. C — the content stays. B — not a control."}, {"id": 3919867581, "d": "sec", "t": "security", "q": "Which line belongs in a committed .mcp.json?", "o": ["\"apiKey\": \"copied-from-vendor-email\"", "\"Authorization\": \"Bearer sk-prod-abc123\"", "\"Authorization\": \"Bearer ${WAREHOUSE_TOKEN}\"", "\"password\": \"warehouse-admin-2024\""], "a": 2, "e": "The config holds a variable reference, the value lives in the environment or a secret store.", "w": "B — an inline credential. D — an inline credential. A — an inline credential."}, {"id": 617493730, "d": "sec", "t": "security", "q": "How can an agent be stopped from writing credentials inline into .mcp.json?", "o": ["Only a CLAUDE.md rule asking it not to", "A PostToolUse hook that logs the write", "A CLAUDE.md rule plus a blocking hook", "Only a longer system prompt in the API"], "a": 2, "e": "The instruction signals intent, the hook enforces it deterministically.", "w": "A — a convention can be missed. D — not applicable to Claude Code config. B — logging cannot undo or block the write."}, {"id": 3742583258, "d": "sec", "t": "security", "q": "A secret is shared by several services and must be audited. Where should it live?", "o": ["A secret store that logs who reads it", "A shared note in the team wiki page", "The CLAUDE.md file of each project", "A config file kept in each service"], "a": 0, "e": "A secret store centralizes the value, logs access and lets one rotation update every consumer.", "w": "D — copies multiply. B — not protected. C — committed and shared."}, {"id": 1019358106, "d": "sec", "t": "security", "q": "A remote SaaS tool authenticates individual users. Which pattern fits?", "o": ["File-system permissions with a deny rule", "A hardcoded token in the plugin", "An API key shared in the repository", "OAuth with a browser sign-in flow"], "a": 3, "e": "The server answers 401, the client starts a sign-in, a token is issued and stored without anyone copying a secret.", "w": "C — not user identity. A — for local services. B — a leaked credential."}, {"id": 74119841, "d": "sec", "t": "security", "q": "An OAuth MCP connection works on staging and fails on production with a redirect URI mismatch. What is missing?", "o": ["The production host registered as a redirect URI", "A higher permission mode on the developer machine", "A larger context window for the MCP server", "A new CLAUDE.md in the production repository"], "a": 0, "e": "Redirect URIs are registered per host. Many regulated customers also want a separate OAuth app per environment.", "w": "B — unrelated. C — unrelated. D — unrelated."}, {"id": 1874829912, "d": "sec", "t": "security", "q": "A CI pipeline gets 401 from an MCP server while reading a key from a credentials file. What is the best fix?", "o": ["Switch the service to OAuth, change nothing else", "Rotate the key, inject it as a runner variable", "Raise the number of connection retries a lot", "Only rotate the key, keep the same file"], "a": 1, "e": "The deeper problem is where the credential lives. Rotate, move it out of the file and reference it by name.", "w": "D — leaves the credential in a file. A — OAuth does not fit a CI service identity. C — a bad key stays bad."}, {"id": 2083986779, "d": "sec", "t": "security", "q": "What does a regulated customer ask about besides whether authentication works?", "o": ["Only the price of the model per million tokens", "Only the number of tools the server exposes", "Only the programming language of the server", "Data residency, access logging, config lock"], "a": 3, "e": "Answers: region-pinned endpoint and platform, a PostToolUse audit hook, and enterprise managed settings.", "w": "A — not a compliance item. C — not a compliance item. B — not a compliance item."}, {"id": 990510102, "d": "sec", "t": "security", "q": "Before a code modernization session, which question belongs in the scoping?", "o": ["What is the blast radius of a mistake?", "Which font the terminal should be using", "Whether the repository already has a README", "How many files the agent may open a minute"], "a": 0, "e": "Also ask how changes are audited and who approves each phase before the next.", "w": "B — irrelevant. D — not a scoping question. C — not a scoping question."}, {"id": 4145237482, "d": "sec", "t": "security", "q": "Which tool keeps an audit trail of every tool call independent of the model?", "o": ["A PostToolUse hook writing to an audit store", "A skill that loads on demand when matched", "A line in CLAUDE.md asking Claude to log", "A subagent that summarizes the whole session"], "a": 0, "e": "Hooks fire deterministically, the log is not something the model can skip.", "w": "C — advice only. D — a summary is not a complete log. B — loads only on a match."}, {"id": 3802609040, "d": "agents", "t": "agents", "q": "A plugin should include the guardrails the author relies on. What must the author do?", "o": ["Rely on the marketplace to add them later", "Mention them in the README file only", "List the deny rules and hooks in the bundle", "Assume teammates already have the same rules"], "a": 2, "e": "Components that are not in the bundle do not travel to other machines.", "w": "B — documentation does not enforce. D — not true. A — marketplaces do not add rules."}, {"id": 2456830560, "d": "eval", "t": "evals", "q": "Why should the eval be written before the feature?", "o": ["It makes the feature run faster in production", "It removes the need for any later testing", "It lets the model grade itself without a rubric", "It forces you to define success before building"], "a": 3, "e": "Otherwise you may rationalize whatever output the model produces.", "w": "A — an eval does not affect speed. B — testing is still needed. C — a rubric is still required."}, {"id": 788272769, "d": "eval", "t": "evals", "q": "A feature scores 3 out of 10 on its first eval run. How should that be read?", "o": ["A normal starting point to improve step by step", "A reason to ship it anyway with a short note", "A sign that the eval set is far too small", "Proof that the model cannot do the task at all"], "a": 0, "e": "The score matters through its trend as you change the prompt, tools or model, one lever at a time.", "w": "D — a first score says little about the ceiling. B — shipping skips the point of the eval. C — size is not implied by the score."}, {"id": 3870812683, "d": "eval", "t": "evals", "q": "A classifier must output exactly one of three labels. Which grader fits best?", "o": ["A regex on the first sentence", "Exact match against the expected label", "A human reviewer for every single case", "An LLM judge with a long rubric"], "a": 1, "e": "One correct form takes the cheapest grader.", "w": "D — costly and noisy for a single label. C — does not scale. A — brittle and unnecessary."}, {"id": 1982453674, "d": "eval", "t": "evals", "q": "A feature must return valid JSON with a required field. Which grader fits best?", "o": ["An LLM judge scoring the style of the JSON", "A code check that parses and validates it", "Exact string match against one sample output", "A user survey carried out after the release"], "a": 1, "e": "A function can verify structure and required fields cheaply on every commit.", "w": "C — fails valid reorderings. A — structure is checkable by code. D — not a grader."}, {"id": 468353576, "d": "eval", "t": "evals", "q": "Which output needs an LLM-as-judge instead of a code check?", "o": ["A number that must sit inside an allowed range", "A single category label from a fixed set", "A one-paragraph rationale for a recommendation", "A date that is returned in the ISO format"], "a": 2, "e": "Open-ended quality such as faithfulness has no code rule.", "w": "D — a format check. A — a range check. B — an exact match."}, {"id": 4196032430, "d": "eval", "t": "evals", "q": "Why ask a judge for strengths, weaknesses and reasoning before the score?", "o": ["It makes the judge call cheaper for each case", "It lets the judge skip reading the output", "Without it, scores drift to a safe middle", "It guarantees agreement with human reviewers"], "a": 2, "e": "Reasoning first anchors the score to specifics.", "w": "A — more output costs more. B — it must read the output. D — calibration still has to be measured."}, {"id": 3845511603, "d": "eval", "t": "evals", "q": "How do you make a judge's scores defensible?", "o": ["Run it once and trust the average", "Ask it to be as strict as possible", "Check its agreement with human-labeled cases", "Use a higher temperature to vary its scores"], "a": 2, "e": "A judge that disagrees with humans half the time gives a rigorous-looking but meaningless number.", "w": "D — randomness is not calibration. A — unchecked scores are unreliable. B — vague strictness does not help."}, {"id": 1888203026, "d": "eval", "t": "evals", "q": "Agreement between the judge and human labels is low. What is the right fix?", "o": ["Raise the score scale from ten to a hundred", "Tighten the rubric, add good and bad examples", "Remove the human labels from the dataset", "Switch the grader over to an exact match"], "a": 1, "e": "Define what each score band means, then measure agreement again.", "w": "C — hides the problem. A — a wider scale does not add meaning. D — the output is open-ended."}, {"id": 2854748278, "d": "eval", "t": "evals", "q": "After a prompt change the average score is flat. What should you check?", "o": ["Only the cases that already passed before", "The per-case results, since a flat mean hides swaps", "Only the model's confidence in each answer", "Nothing, a flat average means nothing changed"], "a": 1, "e": "Three cases fixed and three broken give the same average.", "w": "D — hides regressions. A — misses the newly failing cases. C — not a measured signal."}, {"id": 3463173515, "d": "eval", "t": "evals", "q": "What is the best way to expand a small eval set quickly?", "o": ["Remove the hard cases to raise the score", "Wait for production failures to arrive first", "Have Claude generate cases, then spot-check them", "Copy the same cases several times over"], "a": 2, "e": "Coverage matters more than a perfect rubric, and generated cases should stay honest through spot checks.", "w": "D — duplicates add no coverage. A — hides weaknesses. B — reactive."}, {"id": 2369627801, "d": "eval", "t": "evals", "q": "An extractor returned the wrong date from a message with two dates, and all validation checks passed. Why?", "o": ["The model failed to return any date at all", "Validation checks shape, not that a value is right", "The validation code had a bug in the date format", "The prompt was too short for the model to read"], "a": 1, "e": "Both dates were well-formed and populated. Only a graded case with the expected date detects this.", "w": "C — the format was fine. A — a date was returned. D — length was not the issue."}, {"id": 25776159, "d": "eval", "t": "evals", "q": "How can you find edge inputs before a customer does?", "o": ["Remove the validation to see what fails first", "Ask the model to list inputs that could break it", "Test only with messages that look like the demo", "Wait for the first complaint and add it later"], "a": 1, "e": "Turn the plausible ones (two dates, no date, a relative date) into graded cases with checked expected outputs.", "w": "C — repeats the blind spot. D — reactive. A — loses protection."}, {"id": 4021783687, "d": "eval", "t": "evals", "q": "A team changes the prompt, the examples and the model in one pass and the score rises. What did they learn?", "o": ["That the new model is the real driver", "That the prompt rewrite was the real cause", "That the examples were the real cause", "Nothing about which change caused the rise"], "a": 3, "e": "Change one component at a time so each effect is attributable.", "w": "A — cannot be isolated. C — cannot be isolated. B — cannot be isolated."}, {"id": 3029193838, "d": "eval", "t": "evals", "q": "Which belongs in the design document before any production code?", "o": ["Criteria, failure handling, budget, trust boundary", "The names of the developers and the reviewers", "The list of tools that the team likes the best", "The final prompt text and the model name"], "a": 0, "e": "Each of the four decisions feeds a later layer: eval, error paths, instrumented budget, hooks.", "w": "D — implementation details come later. B — not a design decision. C — not a design decision."}, {"id": 2222527064, "d": "eval", "t": "evals", "q": "Which test level isolates a single parser function?", "o": ["End-to-end", "Unit", "Functional", "Integration"], "a": 1, "e": "A unit test checks one piece alone.", "w": "C — one Claude call. D — a handoff. A — the whole flow."}, {"id": 527394705, "d": "eval", "t": "evals", "q": "Retrieval and the prompt builder each pass their own tests, but the full flow answers from memory. Which test level was missing?", "o": ["Unit tests for the retrieval function itself", "Integration, covering the handoff between them", "Functional tests for the model call itself", "More end-to-end runs using the very same data"], "a": 1, "e": "Retrieval returned a list of dictionaries and the builder expected a string. Only a test of the seam shows it.", "w": "A — it already passed. C — the call itself was fine. D — an e2e run sees the symptom but cannot localize it."}, {"id": 3498022949, "d": "eval", "t": "evals", "q": "What does a trace add that a failed test does not?", "o": ["It replaces the need for any eval set", "It shows which step produced the bad result", "It lowers the cost of every single call", "It proves that the model is deterministic"], "a": 1, "e": "A trace records prompt, tool calls, intermediate outputs and timing per step.", "w": "D — not its purpose. A — it complements evals. C — it adds overhead."}, {"id": 1925893725, "d": "eval", "t": "evals", "q": "Which test level is slowest and hardest to localize?", "o": ["Unit", "Integration", "End-to-end", "Functional"], "a": 2, "e": "It runs the whole flow and sees only the final result.", "w": "A — fast and local. D — one call. B — one seam."}, {"id": 1692824954, "d": "prompt", "t": "context", "q": "Traffic is a mix of single-fact lookups and multi-part questions. Which design fits?", "o": ["Iterative search used for every single query", "Always asking the user to pick a search mode", "A static index used for every single query", "A cheap router choosing fetch-once or iteration"], "a": 3, "e": "The router pays for iteration only when the question needs it.", "w": "A — inflates cost and latency. C — shallow on multi-step questions. B — poor product behavior."}, {"id": 2997105924, "d": "prompt", "t": "context", "q": "When is a retrieval router not worth adding?", "o": ["When the system uses prompt caching", "When the questions are written in English", "When the corpus is larger than a gigabyte", "When every query has the same shape"], "a": 3, "e": "Hardcode the path that fits when all traffic looks alike.", "w": "C — size is not the deciding factor. B — language is irrelevant. A — caching is unrelated."}, {"id": 553549038, "d": "app", "t": "stop", "q": "Which errors are retriable?", "o": ["Only 404, and no other status code at all", "429, 529 and the 5xx server errors", "None of them, since all errors are terminal", "400, 401 and 403 together, all three"], "a": 1, "e": "Rate limits and overload clear with time. A bad request or auth failure will fail identically.", "w": "D — terminal. A — terminal. C — wrong."}, {"id": 538508009, "d": "app", "t": "stop", "q": "Why is it safer to treat an unclear error as terminal?", "o": ["Terminal errors are cheaper to log than others", "The API requires failing fast on unknown codes", "A wrongly terminal error fails loudly, gets fixed", "Retrying unclear errors always makes them worse"], "a": 2, "e": "A wrongly retriable error hammers a service and hides the real problem behind retries.", "w": "A — cost is not the reason. D — not always. B — not a rule."}, {"id": 3135010632, "d": "app", "t": "stop", "q": "Which retry strategy fits a 429?", "o": ["Exponential backoff with jitter, a cap, retry-after", "A single retry after a fixed one-second pause", "An immediate retry loop until the call passes", "No retry at all, show an error to every user"], "a": 0, "e": "Instant retries add more requests to the same limit.", "w": "C — deepens the limit. B — ignores capacity signals. D — gives up on a transient error."}, {"id": 1422446638, "d": "app", "t": "stop", "q": "A response includes a retry-after header on a 429. What should the client do?", "o": ["Ignore it and use exponential backoff only", "Retry immediately once and then stop", "Switch to another API key", "Wait that long, using backoff only as a fallback"], "a": 3, "e": "The header is the authoritative wait time when present.", "w": "A — guesses when the service said when. B — ignores capacity. C — evading limits is not valid."}, {"id": 2733486178, "d": "app", "t": "stop", "q": "An application wraps its own retry loop around an SDK call that already retries. What is the problem?", "o": ["The retry-after header is no longer sent", "Attempts multiply instead of being capped", "The SDK stops working after the first retry", "The API rejects nested retry loops"], "a": 1, "e": "Decide where the retry lives: let the SDK handle transient cases, or turn it down and own the path.", "w": "C — no such behavior. A — headers are unaffected. D — not enforced by the API."}, {"id": 3019015250, "d": "app", "t": "stop", "q": "Which stop reason is an HTTP 200 that a status-code retry classifier will miss?", "o": ["end_turn", "refusal", "tool_use", "max_tokens"], "a": 1, "e": "A refusal is a content decision, so fail fast: no retry, raise or log it.", "w": "A — a normal completion. C — a tool request. D — a truncation."}, {"id": 2665218937, "d": "app", "t": "stop", "q": "A tool throws an exception. What should the code return to Claude?", "o": ["A tool_result with is_error true and a clear message", "An empty tool_result so the loop can go on", "Nothing, so no tool_result is sent", "A made-up value that looks plausible"], "a": 0, "e": "An empty result looks like valid data, and the model continues on a false premise.", "w": "B — hides the failure. D — fabricates data. C — breaks the tool_use pairing."}, {"id": 2061691018, "d": "app", "t": "stop", "q": "A streamed response breaks halfway through. What is the right response?", "o": ["Run the tool with the partial arguments", "Mark the request as terminal and stop", "Pass the partial output downstream as it is", "Treat it as transient and retry the whole request"], "a": 3, "e": "Partial output must not be passed on.", "w": "C — corrupts downstream state. A — missing arguments. B — it is a transient failure."}, {"id": 368084841, "d": "app", "t": "stop", "q": "What is wrong with this retry: except Exception: time.sleep(0)?", "o": ["It retries only the terminal errors it sees", "An exception type that was never caught at all", "No backoff, no classification and no cap", "It sleeps for longer than the SDK allows"], "a": 1, "e": "It retries every error instantly, including terminal ones, which deepens a rate limit.", "w": "C — it catches everything. D — it does not sleep. A — it retries everything."}, {"id": 3362034128, "d": "app", "t": "stop", "q": "In development a call never failed, so no error path was written. What went wrong in production?", "o": ["The SDK removes error handling in production", "The API behaves differently in development", "Rate limits only exist on production API keys", "Development traffic never produced the failure"], "a": 3, "e": "Low volume and stable connections hide rate limits and timeouts. Decide the retriable and terminal cases on paper.", "w": "B — same API. A — no such behavior. C — limits apply everywhere."}, {"id": 3319573189, "d": "model", "t": "models", "q": "Millions of short messages are classified daily and an eval shows Haiku holds the quality bar. What drives the choice?", "o": ["Cost at volume, with the eval confirming quality", "Consistency across millions of requests", "Reasoning depth on ambiguous messages", "Latency on dependent steps in a long chain"], "a": 0, "e": "When the eval shows the cheaper tier holds the bar, step down.", "w": "C — not the constraint here. B — the eval handles quality. D — not the constraint."}, {"id": 1063123540, "d": "model", "t": "models", "q": "A dependent multi-step refactor has a costly wrong early step, and Sonnet misses the bar on hard cases. What fits?", "o": ["Opus, for quality where a wrong answer is expensive", "Sonnet with more retries", "Haiku, for speed across many steps", "Sonnet with a longer system prompt"], "a": 0, "e": "Step up when the eval fails on the hardest cases and the cost of error is high.", "w": "C — lowers quality. D — an eval already failed. B — retries do not raise quality."}, {"id": 3623634887, "d": "model", "t": "models", "q": "Most requests are simple lookups and a few are complex syntheses. What fits best?", "o": ["The smallest model used for every single request", "One balanced model with no routing of any kind", "A default model with an override for the hard ones", "The largest model used for every single request"], "a": 2, "e": "Pay for the stronger model only where the cheap signal says it is needed.", "w": "D — overpays. A — fails the complex ones. B — loses the saving or the quality."}, {"id": 2083352825, "d": "model", "t": "models", "q": "What is the most common and expensive model-selection mistake?", "o": ["Testing every candidate on an eval set", "Routing requests by the type of task", "Using Sonnet for the bulk of the workloads", "Using the most capable model by default"], "a": 3, "e": "Make the trade-off measurable rather than assuming bigger is better.", "w": "C — Sonnet is the default. A — that is the right discipline. B — a sound pattern."}, {"id": 3816742457, "d": "model", "t": "batch", "q": "Which three metrics should be recorded for every call?", "o": ["Model name, region and date and nothing more", "Temperature, top_p and top_k of each call", "Token usage, latency and error rate", "Prompt length, font and color of each call"], "a": 2, "e": "Per-call data turns a cost problem into a sortable row.", "w": "B — sampling settings. D — irrelevant. A — too little to find a slow or costly step."}, {"id": 2977150405, "d": "model", "t": "batch", "q": "Why does instrumentation need to exist from the start?", "o": ["The API refuses requests without a metrics header", "Tokens cannot be counted after the deployment", "Logs make every call cheaper to run in the end", "The bill arrives before the explanation does"], "a": 3, "e": "Without per-call data you cannot say which step is expensive or slow.", "w": "A — not required. C — logging adds overhead. B — usage is returned with every response."}, {"id": 892935138, "d": "model", "t": "caching", "q": "Why does adding a single word before the cache breakpoint hurt?", "o": ["The API charges a fine for edits", "The cache is limited to one word of change", "The model forgets the cached work", "The prefix no longer matches, so the cache is invalidated"], "a": 3, "e": "The cache matches an exact prefix.", "w": "B — no such limit. C — nothing is forgotten. A — no fines."}, {"id": 3486180953, "d": "model", "t": "caching", "q": "Which content is a good candidate for caching?", "o": ["A long, stable system prompt and large tool schema", "A prompt shorter than the minimum length", "Live inventory data that changes every request", "A user's message that is different every turn"], "a": 0, "e": "Cache what is identical, long and reused soon. Do not cache content that must reflect live state.", "w": "C — goes stale. D — never hits. B — below the threshold nothing is cached."}, {"id": 1826168782, "d": "model", "t": "caching", "q": "When does prompt caching pay off economically?", "o": ["Every request carries a different prefix", "Requests are an hour apart under the default TTL", "The prompt is shorter than the minimum length", "Cache reads outnumber the costlier cache writes"], "a": 3, "e": "Writes cost a premium, reads cost a fraction.", "w": "A — no hits. B — the default entry expires. C — not cached."}, {"id": 2351344517, "d": "model", "t": "batch", "q": "Which job fits the Message Batches API best?", "o": ["An overnight classification of a large backlog", "A voice assistant that must answer instantly", "A user interface that renders words as they arrive", "A chat reply with a user who is waiting"], "a": 0, "e": "Batches trade latency for cost on non-urgent work.", "w": "D — interactive. B — interactive. C — streaming."}, {"id": 470101631, "d": "model", "t": "batch", "q": "A scheduled job reuses a long fixed prompt across thousands of requests. Which combination helps most?", "o": ["Streaming together with a higher effort", "Batch together with prompt caching", "A larger model used for every single request", "Parallel subagents for each single request"], "a": 1, "e": "The batch discount and cheap cache reads compound.", "w": "A — raises cost. D — multiplies tokens. C — raises cost."}, {"id": 2204946219, "d": "agents", "t": "agents", "q": "What does an orchestrator-worker setup cost compared with a single agent, according to Anthropic's reported research system?", "o": ["About the same number of tokens", "Roughly half of the tokens", "Exactly double the tokens", "Roughly fifteen times the tokens"], "a": 3, "e": "Every subagent spends its own tokens in its own context.", "w": "A — more agents mean more tokens. B — reversed. C — not the reported figure."}, {"id": 2369335877, "d": "agents", "t": "agents", "q": "A task has steps that each depend on the previous result. Is parallel fan-out a good fit?", "o": ["Yes, provided every worker uses the largest model", "No, a single agent with good context fits better", "Yes, because cost does not depend on agent count", "Yes, more agents always finish the work sooner"], "a": 1, "e": "Tightly coupled work cannot be explored in parallel, so you pay the multiplier for nothing.", "w": "D — workers would wait. A — raises cost further. C — cost grows with agents."}, {"id": 967005368, "d": "agents", "t": "agents", "q": "How can the cost multiplier of orchestration be lowered?", "o": ["Giving every worker the whole history to read", "Removing retry handling from the subagents", "The largest model used for every worker", "A more capable lead and cheaper workers"], "a": 3, "e": "Pay top-tier rates only where coordination quality matters.", "w": "C — raises cost. B — one failing worker can stall the lead. A — more tokens in every context."}, {"id": 3330061578, "d": "agents", "t": "agents", "q": "What does token usage tell us about why multi-agent research works?", "o": ["It explains most of the gain from parallel compute", "It shows that the workers never need any tools", "It shows that more agents reduce the total tokens", "It proves that the lead agent does all the thinking"], "a": 0, "e": "The architecture works mainly by buying more parallel computation.", "w": "C — the opposite. D — workers do real work. B — unrelated."}, {"id": 257378081, "d": "agents", "t": "agents", "q": "What is the reliability floor?", "o": ["The lowest price the API will accept", "The smallest eval set allowed", "The first retry delay after a failure", "The minimum latency and retry limits cost tuning cannot break"], "a": 3, "e": "Set it first and tune cost above it, backed by a pinned baseline eval score.", "w": "A — not a price. B — not a set size. C — not a delay."}, {"id": 1819446858, "d": "sec", "t": "security", "q": "A fetched web page tells the agent to ignore earlier instructions and write a file. What does this show?", "o": ["The system prompt was too short to prevent it", "Instructions can arrive through content the agent reads", "The model has no safety training whatsoever", "Users cannot be trusted to type correct prompts"], "a": 1, "e": "Trusting the user does not help: the injection arrives through the fetched content.", "w": "D — the user did not write it. A — length does not stop injection. C — training and classifiers reduce but do not eliminate the risk."}, {"id": 1318930463, "d": "sec", "t": "security", "q": "Which statement about prompt injection defenses is accurate?", "o": ["No agent reading untrusted content is fully immune", "Delimiters make injection completely impossible", "Training the model removes the need for any hook", "Only external users are able to inject instructions"], "a": 0, "e": "Training, classifiers and delimiters raise the bar, but the reliable boundary is what the agent is allowed to do.", "w": "B — delimiters are a soft boundary. C — the application must defend too. D — any content someone else can write is a vector."}, {"id": 3873429210, "d": "sec", "t": "security", "q": "Why does least privilege matter even when an injection succeeds?", "o": ["It bounds what the steered agent can reach", "It prevents any text from entering context", "It makes classifiers unnecessary", "It stops the model from reading the injection"], "a": 0, "e": "A denied action and a log entry, instead of an incident.", "w": "D — it still reads it. B — content still enters. C — layers work together."}, {"id": 2179926056, "d": "sec", "t": "security", "q": "What is the difference between a jailbreak and a prompt injection?", "o": ["An injection only happens in the system prompt", "They are two names for the same attack", "A jailbreak targets the model's safety limits, an injection hijacks the app's instructions", "A jailbreak only arrives through fetched documents"], "a": 2, "e": "Different targets with the same layered defense shape.", "w": "B — different targets. D — usually the user. A — usually via untrusted content."}, {"id": 3661365802, "d": "sec", "t": "security", "q": "Why is a rule that lives only in a prompt not a security control?", "o": ["Hooks are always slower to run than prompts", "Prompts are never read by the model at all", "Prompts are billed as extra security fees", "It is not enforced, but a hook before the tool is"], "a": 3, "e": "If it must hold, enforce it with a hook.", "w": "B — they are read. C — no such fees. A — speed is not the point."}, {"id": 3388074295, "d": "sec", "t": "security", "q": "Which precedence order applies when rules conflict on an action?", "o": ["The first rule in the file always wins", "Allow over ask over deny", "Deny over ask over allow", "Ask over allow over deny"], "a": 2, "e": "A single deny blocks regardless of how many allows exist.", "w": "B — reversed. D — wrong. A — order is not the rule."}, {"id": 1700737853, "d": "sec", "t": "security", "q": "A hook blocks writes outside /workspace/output, but the agent makes an outbound call to an unreviewed server. Which control closes that gap?", "o": ["More allow rules added to the existing hook", "OS-level sandboxing with network isolation", "A longer system prompt about network use", "A higher effort setting for the whole agent"], "a": 1, "e": "A hook only covers what it explicitly checks. The sandbox holds even when a hook is missing.", "w": "C — not enforcement. A — widens access. D — unrelated."}, {"id": 2549725005, "d": "sec", "t": "security", "q": "Which pieces form the minimal secure configuration for a fetch-and-write agent?", "o": ["More allow rules and an optional log", "A shared admin key and open paths", "Path-limiting hook, deny paths, env secret, audit log", "A longer prompt and a larger model"], "a": 2, "e": "The hook enforces the boundary, the deny rule limits reach, the secret stays out of config, the log records privileged actions.", "w": "D — not controls. A — widens access. B — the opposite of least privilege."}, {"id": 3925526544, "d": "sec", "t": "security", "q": "A regulated customer requires zero data retention. What should be confirmed at scoping time?", "o": ["That each model is ZDR-eligible on the chosen platform", "That the prompt contains no personal names", "That batch processing is turned on", "That all current models are always eligible"], "a": 0, "e": "Eligibility varies by model and platform and may constrain your choices.", "w": "D — not guaranteed. B — not the criterion. C — unrelated."}, {"id": 734850160, "d": "sec", "t": "security", "q": "What does an audit hook produce for a regulated review?", "o": ["A cheaper bill per token", "A faster response for each request", "A promise that the agent will behave", "A record of privileged actions, who took them and the result"], "a": 3, "e": "Reviewers want evidence, not assurances.", "w": "C — a promise is not evidence. B — not its purpose. A — not its purpose."}], "C": [{"id": 3798616281, "t": "api", "f": "Which parameters are required in a Messages API request?", "b": "model, max_tokens and messages."}, {"id": 1812455697, "t": "api", "f": "Is the Messages API stateful?", "b": "No. You send the full history every call and you store state yourself."}, {"id": 3150992858, "t": "api", "f": "Where does the system prompt go?", "b": "In the top-level system parameter. There is no system role in messages."}, {"id": 508743393, "t": "api", "f": "What does max_tokens limit?", "b": "Only the output tokens of the answer."}, {"id": 3738965975, "t": "api", "f": "How do you count input tokens before sending?", "b": "Use the token counting endpoint."}, {"id": 2137644253, "t": "api", "f": "Does temperature 0 guarantee identical output?", "b": "No. Outputs are very similar but identical text is not guaranteed."}, {"id": 2979213928, "t": "stop", "f": "stop_reason end_turn: what to do?", "b": "Use the answer. Claude finished naturally."}, {"id": 1521242273, "t": "stop", "f": "stop_reason max_tokens: what to do?", "b": "The answer is cut. Raise the limit or ask Claude to continue."}, {"id": 865568409, "t": "stop", "f": "stop_reason tool_use: what to do?", "b": "Run each client tool and send tool_result blocks in a user message."}, {"id": 3298697943, "t": "stop", "f": "stop_reason pause_turn: what to do?", "b": "A server tool loop hit its limit (default 10). Send the assistant response back unchanged."}, {"id": 2199478510, "t": "stop", "f": "stop_reason refusal: what to know?", "b": "It is an HTTP 200 and is billed. Handle it explicitly, do not loop."}, {"id": 17648365, "t": "stop", "f": "stop_reason model_context_window_exceeded", "b": "The context window filled before max_tokens. The output is truncated."}, {"id": 74109250, "t": "stop", "f": "Which HTTP errors are worth retrying?", "b": "429, 500 and 529, with exponential backoff and jitter. Not 400 or 401."}, {"id": 3773666524, "t": "stop", "f": "What does HTTP 413 mean?", "b": "The request is too large."}, {"id": 1666865606, "t": "stop", "f": "Why log the request-id header?", "b": "Support needs it to trace a specific request."}, {"id": 1226936032, "t": "stream", "f": "How do you stream a response?", "b": "Set stream: true and read server-sent events."}, {"id": 3516252653, "t": "stream", "f": "How do you read streamed tool input?", "b": "Accumulate input_json_delta fragments and parse after content_block_stop."}, {"id": 3000150661, "t": "stream", "f": "Which event carries the final stop_reason?", "b": "message_delta."}, {"id": 4193857863, "t": "stream", "f": "Can an error arrive after a 200 in a stream?", "b": "Yes, as an error event in the stream."}, {"id": 2729300426, "t": "models", "f": "Claude Haiku 5.5: what is it for?", "b": "High-volume, latency-sensitive work: classification, extraction, routing. From $0.10 / $0.50 per MTok."}, {"id": 284833187, "t": "models", "f": "Claude Sonnet 5.5: what is it for?", "b": "The best balance of speed and intelligence. $2 / $10 per MTok."}, {"id": 3628026779, "t": "models", "f": "Claude Opus 5.5: what is it for?", "b": "Long-running agentic coding and knowledge work. $4 / $20 per MTok."}, {"id": 2399798199, "t": "models", "f": "Claude Fable 5.2: what is it for?", "b": "Demanding reasoning and long-horizon agentic work. $8 / $40 per MTok."}, {"id": 1667950418, "t": "models", "f": "Context window and max output of the current models", "b": "1M tokens of context and up to 128K tokens of output."}, {"id": 370101800, "t": "models", "f": "How do you choose a model?", "b": "Smallest model that passes your evals, move up only when measured quality is not enough."}, {"id": 1766988607, "t": "models", "f": "Why pin the exact model ID?", "b": "Behavior and cost change between models. A pinned ID is a stable snapshot until retirement."}, {"id": 1524261995, "t": "models", "f": "Where can you run Claude besides the Claude API?", "b": "Amazon Bedrock, Google Cloud, Microsoft Foundry and Claude Platform on AWS. IDs and features differ."}, {"id": 3327737406, "t": "thinking", "f": "How are thinking tokens billed?", "b": "As output tokens."}, {"id": 3980495614, "t": "thinking", "f": "What does the effort parameter control?", "b": "Overall token spending: thinking, tool calls and answer length."}, {"id": 4208595379, "t": "thinking", "f": "Effort levels", "b": "low, medium, high, xhigh, max. Default high; medium on Opus 5.5 and Haiku 5.5."}, {"id": 1765562962, "t": "thinking", "f": "Manual extended thinking: budget_tokens rule", "b": "At least 1,024 and lower than max_tokens. Only on models that still accept the manual mode."}, {"id": 1310634132, "t": "thinking", "f": "Quality too low: what order of fixes?", "b": "Prompt and context, then effort or thinking, then a larger model."}, {"id": 2223713044, "t": "caching", "f": "Order of the cached prefix", "b": "tools, then system, then messages."}, {"id": 3236217691, "t": "caching", "f": "How many explicit cache breakpoints per request?", "b": "Up to 4."}, {"id": 1186982468, "t": "caching", "f": "Cache TTL options", "b": "5 minutes by default (refreshed by every hit) or 1 hour with ttl: 1h."}, {"id": 2783703108, "t": "caching", "f": "Cache write and read multipliers", "b": "5-minute write 1.25x, 1-hour write 2x, read 0.1x (0.05x on Opus 5.5 and Sonnet 5.5)."}, {"id": 2792164809, "t": "caching", "f": "Minimum cacheable length on current models", "b": "512 tokens. Shorter prompts are processed without caching and without an error."}, {"id": 3789288707, "t": "caching", "f": "Where should the breakpoint go?", "b": "On the last block that is identical across requests."}, {"id": 811276592, "t": "caching", "f": "Which changes invalidate the cache?", "b": "Tool definitions, tool_choice, images added or removed, web search or citations toggles, some thinking changes."}, {"id": 1195747675, "t": "caching", "f": "Which usage fields show caching?", "b": "cache_creation_input_tokens and cache_read_input_tokens."}, {"id": 3669014859, "t": "batch", "f": "Message Batches API: discount and limits", "b": "50% off, 100,000 requests or 256 MB per batch."}, {"id": 2367489857, "t": "batch", "f": "Batch completion window and result retention", "b": "Expires after 24 hours; results kept for 29 days after creation."}, {"id": 4063879602, "t": "batch", "f": "How do you match batch results to requests?", "b": "By custom_id. Results may come back in any order."}, {"id": 2273338200, "t": "batch", "f": "Good uses for batch", "b": "Evals, bulk classification, summarization, anything nobody waits for."}, {"id": 2871301982, "t": "structured", "f": "How do you request JSON that matches a schema?", "b": "output_config.format with type json_schema (structured outputs)."}, {"id": 1905217625, "t": "structured", "f": "What does strict: true do on a tool?", "b": "Guarantees tool names and inputs match the schema."}, {"id": 3544396331, "t": "structured", "f": "Structured outputs: unsupported schema features", "b": "Recursive schemas, numeric constraints (minimum, maximum), string length constraints, external $ref."}, {"id": 2724339377, "t": "structured", "f": "Structured outputs: complexity limits", "b": "20 strict tools, 24 optional parameters, 16 union-type parameters per request."}, {"id": 2872756923, "t": "structured", "f": "When can structured output still be invalid?", "b": "On stop_reason max_tokens (truncated) or refusal."}, {"id": 3076456111, "t": "prompting", "f": "Where to put a long document and the question?", "b": "Document first, question or instruction last."}, {"id": 4185606044, "t": "prompting", "f": "Why use XML tags in a prompt?", "b": "To separate instructions, data and examples clearly."}, {"id": 2418645750, "t": "prompting", "f": "How many few-shot examples?", "b": "Three to five diverse, relevant examples in tags."}, {"id": 1499234957, "t": "prompting", "f": "Why explain the reason behind a rule?", "b": "Claude generalizes better when it knows why."}, {"id": 2757801433, "t": "prompting", "f": "How to debug a weak prompt?", "b": "Inspect failures, change one thing, re-run the eval set."}, {"id": 2888327016, "t": "context", "f": "What counts toward the context window?", "b": "System prompt, tools, history, tool results, thinking and the output."}, {"id": 979925042, "t": "context", "f": "Retrieval (RAG): what is it for?", "b": "Put only relevant chunks in the prompt for large or changing knowledge."}, {"id": 416200192, "t": "context", "f": "What is the memory tool?", "b": "A client-side tool: Claude reads and writes files you store, so state survives sessions."}, {"id": 816641976, "t": "context", "f": "Prompt order for caching and quality", "b": "Stable content first, changing content last."}, {"id": 2957530105, "t": "tooluse", "f": "Fields of a tool definition", "b": "name, description, input_schema (and optional strict)."}, {"id": 1054780523, "t": "tooluse", "f": "tool_choice options", "b": "auto, any, tool (a named tool), none."}, {"id": 2129262769, "t": "tooluse", "f": "How do you report a tool failure?", "b": "A tool_result with is_error: true and a helpful message."}, {"id": 3213368789, "t": "tooluse", "f": "Where do tool_result blocks go in the user message?", "b": "First, before any additional text."}, {"id": 2643821277, "t": "tooluse", "f": "Client tools vs server tools", "b": "Client tools run in your app. Server tools (web search, web fetch, code execution) run on Anthropic's side."}, {"id": 1150945576, "t": "tooluse", "f": "Parallel tool use: how to answer?", "b": "Run them concurrently and return all results in one user message."}, {"id": 1891619980, "t": "tooluse", "f": "What matters most in a tool definition?", "b": "The description: what it does, when to use it, when not to."}, {"id": 1938366507, "t": "mcp", "f": "MCP: tools, resources, prompts controlled by whom?", "b": "Tools by the model, resources by the application, prompts by the user."}, {"id": 2892305564, "t": "mcp", "f": "MCP transports", "b": "stdio for local servers, Streamable HTTP for remote servers."}, {"id": 1635853016, "t": "mcp", "f": "stdio MCP server: where do logs go?", "b": "stderr. stdout carries the protocol messages."}, {"id": 3057004955, "t": "mcp", "f": "MCP message format", "b": "JSON-RPC 2.0."}, {"id": 2623328621, "t": "mcp", "f": "How can the Messages API use a remote MCP server?", "b": "With the MCP connector, no custom client needed."}, {"id": 3757248655, "t": "agents", "f": "Agent vs workflow", "b": "An agent lets the model decide the steps; a workflow follows steps your code fixes."}, {"id": 2460853905, "t": "agents", "f": "Stop conditions of an agent loop", "b": "Maximum iterations, a token or cost budget and a timeout."}, {"id": 1344985715, "t": "agents", "f": "When must a human approve?", "b": "Before irreversible or high-impact actions such as sending email, deleting data, payments."}, {"id": 1341020222, "t": "agents", "f": "Multi-agent: benefits and costs", "b": "Clean contexts and parallelism, but more tokens, coordination and harder debugging."}, {"id": 2012751062, "t": "workflows", "f": "Five workflow patterns", "b": "Prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer."}, {"id": 321702968, "t": "workflows", "f": "Routing: when and with which model?", "b": "Different input types need different handling; a small model is a good router."}, {"id": 1738847944, "t": "workflows", "f": "Orchestrator-workers: when?", "b": "When subtasks cannot be predicted in advance."}, {"id": 1594915249, "t": "workflows", "f": "Evaluator-optimizer: when?", "b": "When you have clear criteria and iteration improves the result."}, {"id": 861872108, "t": "security", "f": "Direct vs indirect prompt injection", "b": "Direct: the user is the attacker. Indirect: instructions hidden in third-party content Claude reads."}, {"id": 1426435561, "t": "security", "f": "Where does untrusted content belong?", "b": "Inside tool_result blocks, labelled with its source, never in the system prompt."}, {"id": 966966690, "t": "security", "f": "Best single defense against injection damage", "b": "Least privilege plus human approval for sensitive actions."}, {"id": 3775767157, "t": "security", "f": "Where do API keys belong?", "b": "Environment variables or a secret manager. Never in code, prompts, git or client-side apps."}, {"id": 3682574073, "t": "security", "f": "Is model output trusted?", "b": "No. Validate it before it reaches SQL, a shell, HTML or a file path."}, {"id": 2548638173, "t": "security", "f": "A small screening call returns refusal. Verdict?", "b": "Treat it as suspicious (positive)."}, {"id": 3946290063, "t": "claude-code", "f": "What is CLAUDE.md?", "b": "Durable project context: commands, conventions, architecture. Commit it for the team."}, {"id": 717805472, "t": "claude-code", "f": "Hooks vs instructions in CLAUDE.md", "b": "Hooks are deterministic shell commands at lifecycle events. Instructions are advice."}, {"id": 2077392083, "t": "claude-code", "f": "Permission rule precedence", "b": "Deny wins over allow."}, {"id": 1725231465, "t": "claude-code", "f": "What is a sub-agent?", "b": "A specialised agent with its own context and tool limits that returns a summary."}, {"id": 3607571232, "t": "claude-code", "f": "Headless mode", "b": "claude -p runs Claude Code from scripts and CI."}, {"id": 2963790944, "t": "evals", "f": "Why build evals?", "b": "They define done and catch regressions when prompts or models change."}, {"id": 1218472363, "t": "evals", "f": "Three kinds of graders", "b": "Code-based, LLM-as-judge and human."}, {"id": 1284087932, "t": "evals", "f": "How to make an LLM judge trustworthy?", "b": "Specific rubric, one dimension at a time, validated against human labels."}, {"id": 2807463860, "t": "evals", "f": "How do you debug a production quality drop?", "b": "Trace requests, reproduce the exact input, change one variable, compare on the eval set."}, {"id": 2308077999, "t": "api", "f": "Why is a chars-per-token rule of thumb unreliable?", "b": "The ratio depends on the model's tokenizer and changes between model generations. Count tokens instead."}, {"id": 3232035044, "t": "api", "f": "What happens when the input alone exceeds the context window?", "b": "The request is rejected with a validation error before generation starts."}, {"id": 3829690394, "t": "stop", "f": "Input fits but generation hits the window ceiling: what comes back?", "b": "Partial output with stop reason model_context_window_exceeded on current models."}, {"id": 1160560999, "t": "api", "f": "Newest Claude models and sampling parameters", "b": "Non-default temperature, top_p or top_k return a 400 error. Steer behavior through prompting."}, {"id": 1726415222, "t": "api", "f": "How should you test non-deterministic output?", "b": "Assert properties that must hold (fields, ranges, structure). Use a model-graded judge for meaning."}, {"id": 2093340558, "t": "models", "f": "Course default for choosing a tier", "b": "Start with Sonnet. Move up only when an eval misses your bar, down to Haiku only when the quality drop is acceptable."}, {"id": 863799399, "t": "thinking", "f": "Model choice vs reasoning mode", "b": "Two independent levers set per call. A capable model can run with reasoning off, a smaller one with reasoning on."}, {"id": 3289339947, "t": "thinking", "f": "budget_tokens on the newest models", "b": "Deprecated; it returns a 400 error. Use adaptive thinking with the effort setting."}, {"id": 484055282, "t": "thinking", "f": "Thinking content on the newest models", "b": "Omitted from responses by default. Request summarized display to show it."}, {"id": 1964750631, "t": "prompting", "f": "Zero-shot, one-shot, multi-shot", "b": "No example, one example, several examples placed in the prompt. They are not training data."}, {"id": 63998516, "t": "prompting", "f": "Wrong output structure under zero-shot: first fix?", "b": "Add one or two correct examples. It is usually faster than another paragraph of instructions."}, {"id": 2072134958, "t": "prompting", "f": "When can examples make a cheaper model enough?", "b": "A smaller model may need examples where a capable one succeeds zero-shot. Try the simplest model and fewest examples that meet your eval."}, {"id": 4213395443, "t": "api", "f": "SDK vs raw REST", "b": "The SDK is a thin layer over the same API and model. It handles auth, retries and parsing."}, {"id": 3799821223, "t": "api", "f": "Async in Python vs TypeScript SDKs", "b": "Python has an async client (AsyncAnthropic). The TypeScript client is already Promise-based, no separate class."}, {"id": 431310916, "t": "prompting", "f": "Diagnose before you add words: wrong shape", "b": "An output constraint is missing: state the form, the fixed label set and 'return only the label'."}, {"id": 1226738094, "t": "prompting", "f": "Diagnose: scope drifts over a long chat", "b": "The system prompt is too vague to hold role, scope and format across turns."}, {"id": 2358819892, "t": "prompting", "f": "Diagnose: breaks only on a rare variant", "b": "Name the variant in a rule, or add an example that covers it."}, {"id": 1967779651, "t": "prompting", "f": "Why can a long wordy prompt hurt?", "b": "It tends to produce long, unfocused output and higher latency, with no accuracy gain."}, {"id": 1749737096, "t": "structured", "f": "Costs of structured outputs", "b": "First call per schema is slower (grammar cached 24 h), input tokens rise, and refusal or max_tokens can still break the shape."}, {"id": 1043444386, "t": "structured", "f": "Can JSON outputs be combined with prefilling?", "b": "No. They are incompatible."}, {"id": 3744942145, "t": "thinking", "f": "The carry-back rule", "b": "Return every thinking block to the API exactly as received, including redacted ones. Editing or dropping breaks the signature."}, {"id": 227020095, "t": "thinking", "f": "When is extended thinking worth it?", "b": "Multi-step reasoning and agent planning. Not for classification, extraction or format conversion."}, {"id": 2335553491, "t": "tooluse", "f": "Who runs a client tool?", "b": "Your application. Claude only picks the tool and its inputs."}, {"id": 2700332156, "t": "tooluse", "f": "The tool_use / tool_result invariant", "b": "Every tool_use needs a tool_result with the same id in the user turn immediately after. Return all results together."}, {"id": 1421514389, "t": "tooluse", "f": "Good tool description", "b": "Say what it does and when NOT to use it. Three to four sentences, with example inputs where format matters."}, {"id": 3966598282, "t": "tooluse", "f": "Two tools with overlapping descriptions", "b": "Add an exclusion condition to each description, or merge them into one tool with a type parameter."}, {"id": 398501597, "t": "tooluse", "f": "When must calls run in sequence?", "b": "When one result feeds the next call. Independent calls can be issued together in one turn."}, {"id": 3786728987, "t": "mcp", "f": "defer_loading and enabled in mcp_toolset", "b": "defer_loading delays loading a definition until needed. enabled turns a tool on or off so the model sees only chosen tools."}, {"id": 3292818304, "t": "mcp", "f": "MCP connector limits", "b": "Remote HTTP servers only, and it needs the mcp-client beta header. A stdio server needs your own MCP client."}, {"id": 415270166, "t": "stream", "f": "When do you parse a streamed tool_use input?", "b": "Only after content_block_stop. Append the turn to history only after message_stop."}, {"id": 3734065245, "t": "stream", "f": "Stream drops mid tool_use block", "b": "Discard the partial turn and retry from the last complete one."}, {"id": 938529287, "t": "context", "f": "Four context strategies", "b": "Pruning (rewind), compaction (summarize), clearing (new session), subagent handoff (isolated context, short summary)."}, {"id": 4269341346, "t": "context", "f": "How to write a summarizer prompt", "b": "Specify what to keep: file paths modified, decisions made, errors and how they were resolved."}, {"id": 2249925128, "t": "context", "f": "Symptom: tool choice degrades after a fixed number of turns", "b": "The window is filling. Prune used tool results and compact before the ceiling."}, {"id": 3112822321, "t": "context", "f": "Where retrieval breaks", "b": "Chunking, the embedding match (may miss exact identifiers), and assembly into the prompt."}, {"id": 3501013157, "t": "agents", "f": "Workflow or agent?", "b": "Workflow when steps can be listed in code. Agent when the goal and tools are known but not the path."}, {"id": 1342191694, "t": "agents", "f": "Three wiring paths", "b": "Raw Messages API loop, Agent SDK (loop in your process), Claude Managed Agents (Anthropic runs loop and sandbox)."}, {"id": 3854488935, "t": "agents", "f": "Why can Managed Agents not be used for PHI or ZDR work?", "b": "Sessions are stateful and stored server-side, so they are not eligible for ZDR or a HIPAA BAA."}, {"id": 1151291408, "t": "agents", "f": "Where does a human-in-the-loop checkpoint go?", "b": "Before destructive calls, after a planning step, and on unexpected output."}, {"id": 79792818, "t": "agents", "f": "GDPR and data residency routing", "b": "The direct API does not currently provide EU residency, so pin the region on Bedrock or Vertex."}, {"id": 2751836452, "t": "memory", "f": "Four memory scopes", "b": "In-context, external storage, summarized memory, stateless."}, {"id": 3498350967, "t": "memory", "f": "Skill vs CLAUDE.md", "b": "A skill loads on demand when its description matches. CLAUDE.md loads every session at fixed cost."}, {"id": 1150472704, "t": "memory", "f": "What do subagents inherit?", "b": "The permission context, but not Skills or conversation history."}, {"id": 374761911, "t": "multimodal", "f": "Image token cost", "b": "ceil(width/28) x ceil(height/28) visual tokens. A 1,000 x 1,000 image is 1,296."}, {"id": 1421622047, "t": "multimodal
