?", "b": "The best balance of speed and intelligence. $2 / $10 per MTok."}, {"id": 3628026779, "t": "models", "f": "Claude Opus 5.5: what is it for?", "b": "Long-running agentic coding and knowledge work. $4 / $20 per MTok."}, {"id": 2399798199, "t": "models", "f": "Claude Fable 5.2: what is it for?", "b": "Demanding reasoning and long-horizon agentic work. $8 / $40 per MTok."}, {"id": 1667950418, "t": "models", "f": "Context window and max output of the current models", "b": "1M tokens of context and up to 128K tokens of output."}, {"id": 370101800, "t": "models", "f": "How do you choose a model?", "b": "Smallest model that passes your evals, move up only when measured quality is not enough."}, {"id": 1766988607, "t": "models", "f": "Why pin the exact model ID?", "b": "Behavior and cost change between models. A pinned ID is a stable snapshot until retirement."}, {"id": 1524261995, "t": "models", "f": "Where can you run Claude besides the Claude API?", "b": "Amazon Bedrock, Google Cloud, Microsoft Foundry and Claude Platform on AWS. IDs and features differ."}, {"id": 3327737406, "t": "thinking", "f": "How are thinking tokens billed?", "b": "As output tokens."}, {"id": 3980495614, "t": "thinking", "f": "What does the effort parameter control?", "b": "Overall token spending: thinking, tool calls and answer length."}, {"id": 4208595379, "t": "thinking", "f": "Effort levels", "b": "low, medium, high, xhigh, max. Default high; medium on Opus 5.5 and Haiku 5.5."}, {"id": 1765562962, "t": "thinking", "f": "Manual extended thinking: budget_tokens rule", "b": "At least 1,024 and lower than max_tokens. Only on models that still accept the manual mode."}, {"id": 1310634132, "t": "thinking", "f": "Quality too low: what order of fixes?", "b": "Prompt and context, then effort or thinking, then a larger model."}, {"id": 2223713044, "t": "caching", "f": "Order of the cached prefix", "b": "tools, then system, then messages."}, {"id": 3236217691, "t": "caching", "f": "How many explicit cache breakpoints per request?", "b": "Up to 4."}, {"id": 1186982468, "t": "caching", "f": "Cache TTL options", "b": "5 minutes by default (refreshed by every hit) or 1 hour with ttl: 1h."}, {"id": 2783703108, "t": "caching", "f": "Cache write and read multipliers", "b": "5-minute write 1.25x, 1-hour write 2x, read 0.1x (0.05x on Opus 5.5 and Sonnet 5.5)."}, {"id": 2792164809, "t": "caching", "f": "Minimum cacheable length on current models", "b": "512 tokens. Shorter prompts are processed without caching and without an error."}, {"id": 3789288707, "t": "caching", "f": "Where should the breakpoint go?", "b": "On the last block that is identical across requests."}, {"id": 811276592, "t": "caching", "f": "Which changes invalidate the cache?", "b": "Tool definitions, tool_choice, images added or removed, web search or citations toggles, some thinking changes."}, {"id": 1195747675, "t": "caching", "f": "Which usage fields show caching?", "b": "cache_creation_input_tokens and cache_read_input_tokens."}, {"id": 3669014859, "t": "batch", "f": "Message Batches API: discount and limits", "b": "50% off, 100,000 requests or 256 MB per batch."}, {"id": 2367489857, "t": "batch", "f": "Batch completion window and result retention", "b": "Expires after 24 hours; results kept for 29 days after creation."}, {"id": 4063879602, "t": "batch", "f": "How do you match batch results to requests?", "b": "By custom_id. Results may come back in any order."}, {"id": 2273338200, "t": "batch", "f": "Good uses for batch", "b": "Evals, bulk classification, summarization, anything nobody waits for."}, {"id": 2871301982, "t": "structured", "f": "How do you request JSON that matches a schema?", "b": "output_config.format with type json_schema (structured outputs)."}, {"id": 1905217625, "t": "structured", "f": "What does strict: true do on a tool?", "b": "Guarantees tool names and inputs match the schema."}, {"id": 3544396331, "t": "structured", "f": "Structured outputs: unsupported schema features", "b": "Recursive schemas, numeric constraints (minimum, maximum), string length constraints, external $ref."}, {"id": 2724339377, "t": "structured", "f": "Structured outputs: complexity limits", "b": "20 strict tools, 24 optional parameters, 16 union-type parameters per request."}, {"id": 2872756923, "t": "structured", "f": "When can structured output still be invalid?", "b": "On stop_reason max_tokens (truncated) or refusal."}, {"id": 3076456111, "t": "prompting", "f": "Where to put a long document and the question?", "b": "Document first, question or instruction last."}, {"id": 4185606044, "t": "prompting", "f": "Why use XML tags in a prompt?", "b": "To separate instructions, data and examples clearly."}, {"id": 2418645750, "t": "prompting", "f": "How many few-shot examples?", "b": "Three to five diverse, relevant examples in tags."}, {"id": 1499234957, "t": "prompting", "f": "Why explain the reason behind a rule?", "b": "Claude generalizes better when it knows why."}, {"id": 2757801433, "t": "prompting", "f": "How to debug a weak prompt?", "b": "Inspect failures, change one thing, re-run the eval set."}, {"id": 2888327016, "t": "context", "f": "What counts toward the context window?", "b": "System prompt, tools, history, tool results, thinking and the output."}, {"id": 979925042, "t": "context", "f": "Retrieval (RAG): what is it for?", "b": "Put only relevant chunks in the prompt for large or changing knowledge."}, {"id": 416200192, "t": "context", "f": "What is the memory tool?", "b": "A client-side tool: Claude reads and writes files you store, so state survives sessions."}, {"id": 816641976, "t": "context", "f": "Prompt order for caching and quality", "b": "Stable content first, changing content last."}, {"id": 2957530105, "t": "tooluse", "f": "Fields of a tool definition", "b": "name, description, input_schema (and optional strict)."}, {"id": 1054780523, "t": "tooluse", "f": "tool_choice options", "b": "auto, any, tool (a named tool), none."}, {"id": 2129262769, "t": "tooluse", "f": "How do you report a tool failure?", "b": "A tool_result with is_error: true and a helpful message."}, {"id": 3213368789, "t": "tooluse", "f": "Where do tool_result blocks go in the user message?", "b": "First, before any additional text."}, {"id": 2643821277, "t": "tooluse", "f": "Client tools vs server tools", "b": "Client tools run in your app. Server tools (web search, web fetch, code execution) run on Anthropic's side."}, {"id": 1150945576, "t": "tooluse", "f": "Parallel tool use: how to answer?", "b": "Run them concurrently and return all results in one user message."}, {"id": 1891619980, "t": "tooluse", "f": "What matters most in a tool definition?", "b": "The description: what it does, when to use it, when not to."}, {"id": 1938366507, "t": "mcp", "f": "MCP: tools, resources, prompts controlled by whom?", "b": "Tools by the model, resources by the application, prompts by the user."}, {"id": 2892305564, "t": "mcp", "f": "MCP transports", "b": "stdio for local servers, Streamable HTTP for remote servers."}, {"id": 1635853016, "t": "mcp", "f": "stdio MCP server: where do logs go?", "b": "stderr. stdout carries the protocol messages."}, {"id": 3057004955, "t": "mcp", "f": "MCP message format", "b": "JSON-RPC 2.0."}, {"id": 2623328621, "t": "mcp", "f": "How can the Messages API use a remote MCP server?", "b": "With the MCP connector, no custom client needed."}, {"id": 3757248655, "t": "agents", "f": "Agent vs workflow", "b": "An agent lets the model decide the steps; a workflow follows steps your code fixes."}, {"id": 2460853905, "t": "agents", "f": "Stop conditions of an agent loop", "b": "Maximum iterations, a token or cost budget and a timeout."}, {"id": 1344985715, "t": "agents", "f": "When must a human approve?", "b": "Before irreversible or high-impact actions such as sending email, deleting data, payments."}, {"id": 1341020222, "t": "agents", "f": "Multi-agent: benefits and costs", "b": "Clean contexts and parallelism, but more tokens, coordination and harder debugging."}, {"id": 2012751062, "t": "workflows", "f": "Five workflow patterns", "b": "Prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer."}, {"id": 321702968, "t": "workflows", "f": "Routing: when and with which model?", "b": "Different input types need different handling; a small model is a good router."}, {"id": 1738847944, "t": "workflows", "f": "Orchestrator-workers: when?", "b": "When subtasks cannot be predicted in advance."}, {"id": 1594915249, "t": "workflows", "f": "Evaluator-optimizer: when?", "b": "When you have clear criteria and iteration improves the result."}, {"id": 861872108, "t": "security", "f": "Direct vs indirect prompt injection", "b": "Direct: the user is the attacker. Indirect: instructions hidden in third-party content Claude reads."}, {"id": 1426435561, "t": "security", "f": "Where does untrusted content belong?", "b": "Inside tool_result blocks, labelled with its source, never in the system prompt."}, {"id": 966966690, "t": "security", "f": "Best single defense against injection damage", "b": "Least privilege plus human approval for sensitive actions."}, {"id": 3775767157, "t": "security", "f": "Where do API keys belong?", "b": "Environment variables or a secret manager. Never in code, prompts, git or client-side apps."}, {"id": 3682574073, "t": "security", "f": "Is model output trusted?", "b": "No. Validate it before it reaches SQL, a shell, HTML or a file path."}, {"id": 2548638173, "t": "security", "f": "A small screening call returns refusal. Verdict?", "b": "Treat it as suspicious (positive)."}, {"id": 3946290063, "t": "claude-code", "f": "What is CLAUDE.md?", "b": "Durable project context: commands, conventions, architecture. Commit it for the team."}, {"id": 717805472, "t": "claude-code", "f": "Hooks vs instructions in CLAUDE.md", "b": "Hooks are deterministic shell commands at lifecycle events. Instructions are advice."}, {"id": 2077392083, "t": "claude-code", "f": "Permission rule precedence", "b": "Deny wins over allow."}, {"id": 1725231465, "t": "claude-code", "f": "What is a sub-agent?", "b": "A specialised agent with its own context and tool limits that returns a summary."}, {"id": 3607571232, "t": "claude-code", "f": "Headless mode", "b": "claude -p runs Claude Code from scripts and CI."}, {"id": 2963790944, "t": "evals", "f": "Why build evals?", "b": "They define done and catch regressions when prompts or models change."}, {"id": 1218472363, "t": "evals", "f": "Three kinds of graders", "b": "Code-based, LLM-as-judge and human."}, {"id": 1284087932, "t": "evals", "f": "How to make an LLM judge trustworthy?", "b": "Specific rubric, one dimension at a time, validated against human labels."}, {"id": 2807463860, "t": "evals", "f": "How do you debug a production quality drop?", "b": "Trace requests, reproduce the exact input, change one variable, compare on the eval set."}, {"id": 2381355764, "t": "limits", "f": "The exam in numbers", "b": "53 questions, 120 minutes, multiple choice and multiple response, pass 720 of 1000."}, {"id": 3926569802, "t": "limits", "f": "Exam domain weights", "b": "Applications 33.1, Models 16.8, Agents 14.7, Prompt and context 11.0, Tools and MCP 10.6, Security 8.1, Claude Code 3.1, Evals 2.6 (percent)."}], "O": [{"id": "o-toolloop", "t": "tooluse", "title": "The tool-use loop", "prompt": "Put the steps of one client tool round trip in order.", "steps": ["Send the request with tools and the user message", "Claude answers with stop_reason tool_use and a tool_use block", "Your code runs the requested tool", "Send a user message with a tool_result for the tool_use id", "Claude answers with stop_reason end_turn and the final text"], "note": "Keep the same tools array on the follow-up request and keep the assistant's tool_use turn in the history."}, {"id": "o-stream", "t": "stream", "title": "Streaming events", "prompt": "Put the streamed events of a simple text answer in order.", "steps": ["message_start", "content_block_start", "content_block_delta", "content_block_stop", "message_delta", "message_stop"], "note": "message_delta carries the final stop_reason and output usage."}, {"id": "o-cacheprefix", "t": "caching", "title": "Cache prefix order", "prompt": "Put the levels of the cached prompt prefix in order, first to last.", "steps": ["tools", "system", "messages"], "note": "A change at one level invalidates that level and every level after it."}, {"id": "o-improve", "t": "thinking", "title": "Improving quality cheaply", "prompt": "Put the levers for improving a weak answer in the sensible order, cheapest first.", "steps": ["Improve the prompt and the context", "Add examples and fix the tool descriptions", "Raise effort or enable thinking", "Move to a more capable model"], "note": "Measure with an eval set after each step. A bigger model is the most expensive lever."}, {"id": "o-injection", "t": "security", "title": "Handling untrusted content", "prompt": "Put the safe handling of a fetched web page in order.", "steps": ["Fetch the page with a tool that has narrow permissions", "Label the content with its source and mark it as untrusted", "Return it to Claude inside a tool_result block", "Screen it with a small classifier if the risk is high", "Ask the user to approve any sensitive action Claude proposes"], "note": "Least privilege limits the damage if an injection still gets through."}, {"id": "o-eval", "t": "evals", "title": "Shipping a prompt change", "prompt": "Put the steps of changing a prompt safely in order.", "steps": ["Collect failing cases and write the change", "Run the old and new prompt on the eval set", "Compare scores per category, not only the average", "Ship the change behind a gradual rollout", "Monitor production samples and add new failures to the eval set"], "note": "Evals define done and catch regressions."}], "M": [{"id": "m-stop", "t": "stop", "title": "Stop reasons", "prompt": "Match each stop_reason with the right reaction.", "pairs": [["end_turn", "Use the answer"], ["max_tokens", "Raise the limit or continue the answer"], ["tool_use", "Run the tool and send a tool_result"], ["pause_turn", "Send the assistant response back unchanged"], ["refusal", "Show a message, rephrase or use a fallback"]], "note": "refusal is an HTTP 200 and is billed."}, {"id": "m-models", "t": "models", "title": "Model tiers", "prompt": "Match each model with the work it is built for.", "pairs": [["Haiku 5.5", "High-volume, latency-sensitive classification and routing"], ["Sonnet 5.5", "Best balance of speed and intelligence"], ["Opus 5.5", "Long-running agentic coding and knowledge work"], ["Fable 5.2", "Demanding reasoning and long-horizon agentic work"]], "note": "Start with the smallest model that passes your evals."}, {"id": "m-http", "t": "stop", "title": "HTTP errors", "prompt": "Match each status code with its meaning.", "pairs": [["400", "Invalid request, fix it"], ["401", "Bad or missing API key"], ["403", "No permission for the resource"], ["413", "Request too large"], ["429", "Rate limit, back off and retry"], ["529", "API overloaded, retry later"]], "note": "Retry 429, 500 and 529 with exponential backoff and jitter."}, {"id": "m-mcp", "t": "mcp", "title": "MCP primitives", "prompt": "Match each MCP concept with who controls it or what it does.", "pairs": [["Tools", "Functions the model decides to call"], ["Resources", "Read-only data the application loads into context"], ["Prompts", "Templates the user triggers"], ["stdio", "Local server as a subprocess"], ["Streamable HTTP", "Remote server over the network"]], "note": "Log to stderr on stdio servers, stdout carries the protocol."}, {"id": "m-workflow", "t": "workflows", "title": "Workflow patterns", "prompt": "Match each situation with the best pattern.", "pairs": [["Fixed steps, each uses the previous output", "Prompt chaining"], ["Different kinds of input need different handling", "Routing"], ["Independent subtasks to finish faster", "Parallelization"], ["Subtasks cannot be known in advance", "Orchestrator-workers"], ["A clear rubric and iteration improves quality", "Evaluator-optimizer"]], "note": "Use the simplest pattern that works and measure the gain."}, {"id": "m-cost", "t": "batch", "title": "Cost levers", "prompt": "Match each goal with the best lever.", "pairs": [["Cheaper repeated long prefixes", "Prompt caching"], ["Cheaper non-urgent bulk jobs", "Message Batches API"], ["Cheaper simple high-volume steps", "A smaller model"], ["Faster perceived response", "Streaming"], ["Guaranteed parseable output", "Structured outputs"]], "note": "Batch is 50% off, cache reads cost a fraction of normal input."}], "S": [{"id": "s-toolerr", "topic": "tooluse", "title": "Tool request rejected with 400", "intro": "An agent works for a few turns, then every request fails with 400: a tool_result does not match a tool_use.", "start": "n1", "lesson": "Every tool_result must answer a tool_use in the immediately preceding assistant message. Keep that turn intact.", "nodes": {"n1": {"q": "What do you inspect first?", "opts": [["The messages array you send: is the assistant turn with the tool_use blocks still there?", "n2", "Right: the history is what the API validates."], ["The API key permissions", "x", "A permission problem would be a 403, not a validation error."], ["The model's temperature", "x", "Sampling settings cannot cause a structural 400."]]}, "n2": {"q": "The history trimming code removed old assistant turns but kept the tool_result messages. What is the fix?", "opts": [["Trim tool_use and its tool_result together, or summarize them as plain text", null, "Correct: pairs must stay together or be removed together."], ["Retry the same request after a pause", "x", "A 400 does not go away by retrying."], ["Raise max_tokens", "x", "The output limit is unrelated."]]}}, "t": "tooluse"}, {"id": "s-cachemiss", "topic": "caching", "title": "The cache never hits", "intro": "A team added cache_control to a long system prompt. The bill did not drop and cache_read_input_tokens is always 0.", "start": "n1", "lesson": "Check the minimum length, exact prefix equality and what changes between requests.", "nodes": {"n1": {"q": "What do you check first?", "opts": [["Whether the prompt is long enough and the cached prefix is byte-identical across requests", "n2", "Right: short prompts are silently not cached, and any change in the prefix misses."], ["Whether streaming is enabled", "x", "Streaming has no influence on caching."], ["Whether the response used end_turn", "x", "The stop reason does not decide caching."]]}, "n2": {"q": "The prompt is long enough, but the first system line contains the current time. What do you do?", "opts": [["Move the changing data after the cached part, for example into the user message", null, "Correct: the stable content must come first."], ["Raise max_tokens", "x", "Unrelated to the prefix."], ["Use a different model for every call", "x", "A different model has its own cache and makes it worse."]]}}, "t": "caching"}, {"id": "s-injection", "topic": "security", "title": "The agent obeys a web page", "intro": "A research agent summarizes web pages. One page contained hidden text telling it to email the user's notes to an outside address, and the agent tried.", "start": "n1", "lesson": "Assume injection can succeed. Limit what the agent can do and keep a human in the loop for sensitive actions.", "nodes": {"n1": {"q": "What type of problem is this?", "opts": [["Indirect prompt injection through third-party content", "n2", "Right: the user is trusted, the page is the attacker."], ["A direct jailbreak by the user", "x", "The user did not write the instruction."], ["A rate limit problem", "x", "No limit was involved."]]}, "n2": {"q": "Which change has the biggest protective effect?", "opts": [["Remove the agent's ability to send email on its own, or require explicit user approval", "n3", "Right: least privilege and human approval cap the damage."], ["Make the system prompt more polite", "x", "A prompt alone is not a control."], ["Increase the effort level", "x", "More reasoning is not access control."]]}, "n3": {"q": "What else should be done with the fetched page content?", "opts": [["Return it inside a tool_result, labelled as untrusted, with a system prompt policy that tool content is data", null, "Correct, and a screening call can be added for high-risk cases."], ["Paste it into the system prompt for more authority", "x", "That gives attacker text the highest authority."], ["Strip all links and trust the rest", "x", "Instructions can hide in plain text."]]}}, "t": "security"}, {"id": "s-truncated", "topic": "stop", "title": "Half-finished JSON", "intro": "A service extracts data with structured outputs. About 2% of responses fail JSON parsing.", "start": "n1", "lesson": "Constrained decoding guarantees valid JSON only for finished outputs. Truncation and refusals still need handling.", "nodes": {"n1": {"q": "What do you look at on the failing responses?", "opts": [["stop_reason: max_tokens or refusal", "n2", "Right: both can produce output that does not match the schema."], ["The HTTP status only", "x", "Both cases return 200."], ["The model's knowledge cutoff", "x", "Unrelated to parsing."]]}, "n2": {"q": "Most failures show max_tokens on long documents. What is the fix?", "opts": [["Raise max_tokens, shorten the output schema, or split the document", null, "Correct."], ["Retry without a schema", "x", "That removes the guarantee."], ["Lower the temperature", "x", "Temperature does not change the length limit."]]}}, "t": "stop"}, {"id": "s-expensive", "topic": "batch", "title": "The bill is too high", "intro": "A nightly job classifies 300,000 documents with the most capable model through synchronous calls. The cost is far above budget.", "start": "n1", "lesson": "Match the model and the delivery mode to the work: small model, batch, caching.", "nodes": {"n1": {"q": "Which change is the biggest and the safest first step?", "opts":       else { node=o[1]; draw(o[2]); }
    }; });
  }
  draw();
}

// ---------- exam
function buildExam(){
  var order=Object.keys(D.DOMAINS), cnt=D.EXAM.counts, pick=[];
  order.forEach(function(d){ var pool=shuffle(QB.filter(function(q){ return q.d===d; })); pool.sort(function(a,b){ return (S.q[a.id]?1:0)-(S.q[b.id]?1:0); }); pick=pick.concat(pool.slice(0,cnt[d])); });
  return shuffle(pick);
}
function startExam(){
  var qs=buildExam(); E={qs:qs,ans:qs.map(function(){ return -1; }),cur:0,end:Date.now()+D.EXAM.minutes*60000,view:"q"}; E.timer=setInterval(tick,1000);
  run=null; setBack(function(){ if(leave()) go("practice"); }); title("Exam"); renderExam();
}
function tick(){ if(!E) return; var left=E.end-Date.now(); var t=$("#timer"); if(t){ var m=Math.floor(left/60000), s=Math.floor(left/1000)%60; t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.classList.toggle("low",left<300000); } if(left<=0) finishExam(); }
function renderExam(){
  var n=E.qs.length, answered=E.ans.filter(function(a){ return a>=0; }).length;
  if(E.view==="grid"){
    var h='<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><span class="timer" id="timer"></span><span class="muted">'+answered+' / '+n+' answered</span></div><div class="grid8" style="margin-top:12px">'+E.qs.map(function(_,i){ return '<button data-g="'+i+'" class="'+(E.ans[i]>=0?"done":"")+'">'+(i+1)+'</button>'; }).join("")+'</div><div class="row" style="margin-top:12px"><button class="btn grow" id="back">Back to question</button><button class="btn primary grow" id="fin">Finish exam</button></div></div>';
    main.innerHTML=h; tick();
    main.querySelectorAll("[data-g]").forEach(function(b){ b.onclick=function(){ E.cur=+b.dataset.g; E.view="q"; renderExam(); }; });
    $("#back").onclick=function(){ E.view="q"; renderExam(); }; $("#fin").onclick=confirmFinish; return;
  }
  var q=E.qs[E.cur];
  main.innerHTML='<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><span class="timer" id="timer"></span><span class="muted">Question '+(E.cur+1)+' / '+n+' &middot; '+answered+' answered</span></div><div class="q">'+fmt(q.q)+'</div>'+q.o.map(function(o,i){ return '<button class="opt'+(E.ans[E.cur]===i?" sel":"")+'" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+fmt(o)+'</span></button>'; }).join("")+'<div class="row" style="margin-top:8px"><button class="btn" id="prev"'+(E.cur===0?" disabled":"")+'>&larr;</button><button class="btn grow" id="grid">Overview</button><button class="btn" id="nx">'+(E.cur===n-1?"Finish":"&rarr;")+'</button></div></div>'; tick();
  main.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ E.ans[E.cur]=+b.dataset.i; renderExam(); }; });
  $("#prev").onclick=function(){ E.cur--; renderExam(); }; $("#grid").onclick=function(){ E.view="grid"; renderExam(); };
  $("#nx").onclick=function(){ if(E.cur===n-1) confirmFinish(); else { E.cur++; renderExam(); } };
}
function confirmFinish(){ var un=E.ans.filter(function(a){ return a<0; }).length; if(un&&!confirm(un+" question(s) unanswered. Finish the exam now?")) return; finishExam(); }
function finishExam(){
  if(!E) return; clearInterval(E.timer);
  var per={}; Object.keys(D.DOMAINS).forEach(function(k){per[k]=[0,0];});var ok=0, wrong=[];
  E.qs.forEach(function(q,i){ per[q.d][1]++; var a=E.ans[i]; var good=a===q.a; if(a>=0) recQ(q.id,good,1); if(good){ ok++; per[q.d][0]++; } else wrong.push(i); });
  var n=E.qs.length, pct=Math.round(100*ok/n); S.exams.push({t:Date.now(),pct:pct,per:per}); flush();
  var h='<div class="card"><div class="eyebrow">Exam result</div><h2>'+(pct>=D.EXAM.pass?"Pass":"Not yet")+' &middot; '+pct+'% ('+ok+'/'+n+')</h2><div class="muted">Pass mark here: '+D.EXAM.pass+'%. Unanswered questions count as wrong.</div>';
  Object.keys(per).forEach(function(d){ var a=per[d]; h+='<div class="domrow"><span>'+esc(D.DOMAINS[d].s)+'</span><div class="bar"><i style="width:'+Math.round(100*a[0]/a[1])+'%"></i></div><span>'+a[0]+'/'+a[1]+'</span></div>'; });
  h+='<div class="row" style="margin-top:12px"><button class="btn primary grow" id="rev">Review mistakes ('+wrong.length+')</button><button class="btn grow" id="done">Back</button></div></div><div id="rv"></div>';
  var qs=E.qs, ans=E.ans; E=null; setBack(null); main.innerHTML=h; title("Exam result"); chipStreak();
  $("#done").onclick=function(){ go("practice"); };
  $("#rev").onclick=function(){ $("#rv").innerHTML=wrong.map(function(i){ var q=qs[i], a=ans[i]; return '<div class="card"><span class="tag">'+esc(topicQ(q))+'</span><div class="q">'+fmt(q.q)+'</div><div class="muted">Your answer: '+(a>=0?L[a]+") "+fmt(q.o[a]):"none")+'</div><div><b>Correct: '+L[q.a]+") "+fmt(q.o[q.a])+'</b></div><div class="fb">'+rich(q.e)+(q.w?'<div class="why">'+fmt(q.w)+'</div>':"")+'</div></div>'; }).join(""); };
}

// ---------- progress
function renderProgress(){
  title("Progress"); chipStreak();
  var rd=readiness(), t=today(), h='<div class="card"><h2>Readiness</h2><div class="grid3" style="margin-top:8px"><div class="stat"><b>'+(rd===null?"-":rd+"%")+'</b><span>Recent accuracy</span></div><div class="stat"><b>'+streak()+'</b><span>Day streak</span></div><div class="stat"><b>'+Math.max(0,D.EXAM_DAY-t)+'</b><span>Days left</span></div></div><div class="muted" style="margin-top:8px">'+(rd===null?"Answer at least 10 questions to see this.":(rd>=80?"You are in good shape. Keep reviewing to hold it.":(rd>=D.EXAM.pass?"Close to the pass mark. Focus on weak topics.":"Below the pass mark. Use Mistakes and Weak topics every day.")))+'</div></div>';
  h+='<div class="card"><h3>Mastery by domain</h3>'+Object.keys(D.DOMAINS).map(function(k){ var n=QB.filter(function(q){ return q.d===k; }), seen=n.filter(function(q){ return S.q[q.id]; }).length, learned=n.filter(function(q){ return S.q[q.id]&&S.q[q.id].b>=3; }).length; return '<div class="domrow"><span>'+esc(D.DOMAINS[k].s)+'</span><div class="bar"><i style="width:'+Math.round(100*learned/n.length)+'%"></i></div><span>'+learned+'/'+n.length+'</span></div><div class="muted" style="margin:-4px 0 4px">'+seen+' seen</div>'; }).join("")+'<div class="muted">Mastered = repeated correctly at least three times in a row.</div></div>';
  var last=[]; for(var i=13;i>=0;i--){ var l=S.log[String(t-i)]; last.push((l?(l.q||0)+(l.c||0)+(l.d||0)+(l.s||0):0)); } var mx=Math.max.apply(null,last.concat([1]));
  h+='<div class="card"><h3>Last 14 days</h3><div class="hist">'+last.map(function(v){ return '<i style="height:'+Math.round(100*v/mx)+'%" title="'+v+'"></i>'; }).join("")+'</div></div>';
  var oc=0, gc=0; Object.keys(S.q).forEach(function(k){ oc+=S.q[k].oc||0; gc+=S.q[k].gc||0; });
  h+='<div class="card"><h3>Calibration</h3><div class="muted">Sure but wrong: <b>'+oc+'</b> &middot; Correct while guessing: <b>'+gc+'</b>. Sure-but-wrong answers are the most dangerous gaps; the app sends them back first.</div></div>';
  var wt=weakTopics(); h+='<div class="card"><h3>Weak topics</h3>'+(wt.length?wt.map(function(x){ return '<span class="tag bad" style="margin-right:6px">'+esc(label(x))+'</span>'; }).join(""):'<div class="muted">None yet.</div>')+'</div>';
  var mk=mistakes(); h+='<div class="card"><h3>Mistake notebook ('+mk.length+')</h3>'+(mk.length?mk.slice(0,12).map(function(q){ return '<div class="item" style="cursor:default"><span>'+fmt(q.q.length>110?q.q.slice(0,110)+"...":q.q)+'<small>'+esc(topicQ(q))+'</small></span></div>'; }).join("")+'<button class="btn primary block" data-act="mistakes" style="margin-top:10px">Practice mistakes</button>':'<div class="muted">No open mistakes.</div>')+'</div>';
  if(S.exams.length){ h+='<div class="card"><h3>Exams</h3>'+S.exams.slice(-6).reverse().map(function(e){ return '<div class="item" style="cursor:default"><span>'+new Date(e.t).toLocaleDateString("en-GB")+'</span><span class="tag '+(e.pct>=D.EXAM.pass?"ok":"bad")+'">'+e.pct+'%</span></div>'; }).join("")+'</div>'; }
  h+='<div class="card"><h3>Data</h3><div class="muted">Progress is saved on this device and, inside Telegram, synced through your Telegram account.</div><button class="btn small" id="reset" style="margin-top:8px">Reset all progress</button></div>';
  main.innerHTML=h;
  main.querySelectorAll("[data-act]").forEach(function(x){ x.onclick=function(){ action(x.dataset.act); }; });
  $("#reset").onclick=function(){ if(confirm("Delete all progress on this device (and in Telegram sync)?")){ S=blank(); flush(); go("progress"); } };
}

go("home");
})();
